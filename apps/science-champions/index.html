/* ============ STORAGE (kept in this browser) ============ */
const KEY = 'scienceChampions.v1';
const freshStats = () => ({plants:0, animals:0, materials:0, energy:0, air:0, earth:0, multi:0, streak:0, fix:0});
const fresh = () => ({v:1, sets:{}, badges:[], stats:freshStats(), current:null, lastRun:null, settings:{size:'normal', theme:'auto', sound:true}});
let S = fresh();
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign(fresh(), d);
      S.settings = Object.assign(fresh().settings, d.settings || {});
      S.stats = Object.assign(freshStats(), d.stats || {});
    }
  } catch (e) { storageOK = false; }
}
/* setItem throws when the browser is full, and in a couple of private modes
   it fails quietly, so every write is read back before it is believed. */
function writeKey(k, text) {
  try {
    localStorage.setItem(k, text);
    return localStorage.getItem(k) === text;
  } catch (e) { return false; }
}
/* All the activities on this site share one storage allowance. This one
   saves no pictures of its own, but when the browser is full it may clear
   other activities' saved drawings (their *.art.v keys) to make room — a
   child's stars are never given up for a picture. */
function dropArtElsewhere() {
  let keys, freed = false;
  try { keys = Object.keys(localStorage); } catch (e) { return false; }
  for (const k of keys) {
    if (/\.art\.v\d+$/.test(k)) {
      try { localStorage.removeItem(k); freed = true; } catch (e) {}
    }
  }
  return freed;
}
function save() {
  S.updatedAt = Date.now();
  const body = JSON.stringify(S);
  let ok = writeKey(KEY, body);
  if (!ok && dropArtElsewhere()) ok = writeKey(KEY, body);
  storageOK = ok;
  return ok;
}
function applySettings() {
  const r = document.documentElement;
  r.dataset.size = S.settings.size;
  if (S.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = S.settings.theme;
}
/* The tests always come in the order they were set, oldest first, so that
   "Set 3" is the 2024 paper for every child. Every set is open at any time. */
const setOrder = () => SETS.map(s => s.id);
const orderPos = id => setOrder().indexOf(id);

/* ============ SOUND + READ ALOUD ============ */
let actx = null;
function beep(kind) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [523, 659, 784] : kind === 'part' ? [523, 587] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * 0.1 + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + i * 0.1); o.stop(actx.currentTime + i * 0.1 + 0.25);
    });
  } catch (e) {}
}
const canSpeak = 'speechSynthesis' in window;
/* Circled letters, arrows and units read badly out loud, so they are turned
   into plain words first. */
function sayable(text) {
  return String(text)
    .replace(/[①-⑤]/g, c => ' ' + (c.charCodeAt(0) - 0x245F) + ' ')
    .replace(/[ⓐ-ⓩ]/g, c => ' ' + String.fromCharCode(c.charCodeAt(0) - 0x24D0 + 97) + ' ')
    .replace(/[Ⓐ-Ⓩ]/g, c => ' ' + String.fromCharCode(c.charCodeAt(0) - 0x24B6 + 65) + ' ')
    .replace(/→/g, ', then ').replace(/ · /g, ', ').replace(/_{2,}/g, ' blank ')
    .replace(/\(✓ = given, ✗ = not given\)/g, '').replace(/✓/g, ' given ').replace(/✗/g, ' not given ').replace(/△/g, ' triangle ')
    .replace(/°C/g, ' degrees Celsius').replace(/(\d)\s?mL\b/g, '$1 millilitres').replace(/(\d)\s?cm\b/g, '$1 centimetres')
    .replace(/(\d)\s?kg\b/g, '$1 kilograms').replace(/(\d)\s?g\b/g, '$1 grams').replace(/★/g, ' star ')
    .replace(/[\u{1F000}-\u{1FAFF}☀-➿️‍]/gu, '');
}
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(sayable(text));
    u.lang = 'en-GB'; u.rate = 0.9; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ============ CONTENT HELPERS ============ */
const getSet = id => SETS.find(s => s.id === id);
const optOf = (item, i) => item.t === 'multi' ? item.opts[i][0] : item.opts[i];
const isPic = o => o && typeof o === 'object' && !Array.isArray(o);
/* An answer as plain words: a picture answer says what the picture shows. */
function optWords(o) {
  if (isPic(o)) return o.label || (FIGURES[o.fig] ? FIGURES[o.fig].cap : 'picture');
  return Array.isArray(o) ? o.join('; ') : String(o);
}
const optLine = (item, i) => `${CIRC[i]} ${optWords(optOf(item, i))}`;
function itemTotal(item) { return item.t === 'multi' ? item.opts.length : 1; }
function flat(set) { if (!set._flat) { set._flat = []; set.sections.forEach(sec => sec.items.forEach(item => set._flat.push({sec:sec.key, item}))); } return set._flat; }
const setTotal = set => flat(set).reduce((a, q) => a + itemTotal(q.item), 0);
const starsFor = pct => pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
const starRow = n => `<span class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i => `<span class="${i < n ? 'star-on' : 'star-off'}">★</span>`).join('')}</span>`;
const setsFinished = s => Object.values(s.sets).filter(r => r && r.best).length;
const threeStarSets = s => Object.values(s.sets).filter(r => r && r.best && starsFor(r.best.pct) === 3).length;
const promptFor = item => item.prompt || (item.t === 'multi' ? 'Tick every answer that fits.' : 'Choose one answer.');
function questionLabel(item) { return `Q${item.no}. ${item.text}`; }
function answerText(item) {
  if (item.t === 'multi') return 'Tick ' + item.opts.map((o, i) => o[1] ? optLine(item, i) : null).filter(Boolean).join('; ');
  return optLine(item, item.ans);
}
function leadWords(lead) {
  return (lead || []).map(b => typeof b === 'string' ? b
    : b.h ? b.h
    : b.marks || b.ul || b.ol ? (b.marks || b.ul || b.ol).join('. ')
    : b.chat ? b.chat.map(([who, said]) => `${who}: ${said}`).join('. ')
    : b.table ? b.table.rows.map(r => r.join(', ')).join('. ') : '').join('. ');
}
function speakText(item) {
  const bits = [promptFor(item)];
  if (item.lead) bits.push(leadWords(item.lead));
  bits.push(item.text);
  item.opts.forEach((o, i) => bits.push(`Answer ${i + 1}: ${optWords(item.t === 'multi' ? o[0] : o)}`));
  return bits.join('. ');
}
/* The story, list or chat that comes before a question. */
function leadHtml(lead) {
  if (!lead) return '';
  const block = b => typeof b === 'string' ? `<p>${esc(b)}</p>`
    : b.h ? `<p class="lh">${esc(b.h)}</p>`
    : b.marks ? `<ul class="marks">${b.marks.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    : b.ul ? `<ul>${b.ul.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    : b.ol ? `<ol>${b.ol.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`
    : b.chat ? `<div class="chat">${b.chat.map(([who, said, side]) => `<div class="bubble ${side === 'r' ? 'r' : 'l'}"><b>${esc(who)}</b>${esc(said)}</div>`).join('')}</div>`
    : b.table ? tableHtml(b.table.head, b.table.rows, b.table.left) : '';
  return `<div class="lead">${lead.map(block).join('')}</div>`;
}
/* One answer's contents: words, a few lines, or a small picture. */
function optInner(o) {
  if (isPic(o)) { const f = FIGURES[o.fig]; return `<svg viewBox="${f.box}" role="img" aria-label="${esc(f.cap)}">${f.svg}</svg>${o.label ? `<span class="plabel">${esc(o.label)}</span>` : ''}`; }
  if (Array.isArray(o)) return `<span class="otext">${o.map(l => `<span class="oline">${esc(l)}</span>`).join('')}</span>`;
  return `<span class="otext">${esc(o)}</span>`;
}
const numBadge = i => `<span class="onum" aria-hidden="true">${i + 1}</span><span class="sr">Answer ${i + 1}: </span>`;

/* ============ QUESTION TYPES ============ */
const TYPES = {};

/* One right answer out of the five. */
TYPES.choice = (item, root, changed) => {
  let sel = -1, locked = false;
  const pics = isPic(item.opts[0]);
  /* Only very short answers (a letter or a number) sit in the big two-column
     grid; anything longer reads better as a full-width list. */
  const long = !pics && item.opts.some(o => optWords(o).length > 6);
  root.innerHTML = `${leadHtml(item.lead)}<p class="qtext">${esc(item.text)}</p>
    <div class="opts ${pics ? 'pics' : long ? 'long' : ''}" role="group" aria-label="Answers">${item.opts.map((o, i) =>
      `<button type="button" class="opt" data-i="${i}" aria-pressed="false">${pics ? `<span class="ohead">${numBadge(i)}</span>` : numBadge(i)}${optInner(o)}</button>`).join('')}</div>`;
  const btns = $$('.opt', root);
  btns.forEach(b => b.addEventListener('click', () => {
    if (locked) return;
    sel = +b.dataset.i;
    btns.forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
    changed();
  }));
  return {
    ready: () => sel >= 0,
    check() {
      locked = true;
      btns.forEach((b, i) => { b.disabled = true; b.classList.remove('sel'); if (i === item.ans) b.classList.add('ok'); else if (i === sel) b.classList.add('no'); });
      return {e: sel === item.ans ? 1 : 0, t: 1, answer: esc(optLine(item, item.ans))};
    }
  };
};

/* Tick every answer that fits. Scored per answer, so each line has to be
   judged on its own — the skill a TEDET question with several right
   answers is testing. */
TYPES.multi = (item, root, changed) => {
  const sel = item.opts.map(() => false);
  const pics = isPic(item.opts[0][0]);
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `${leadHtml(item.lead)}<p class="qtext">${esc(item.text)}</p>
      <div class="opts multi ${pics ? 'pics' : 'long'}" role="group" aria-label="Tick every answer that fits">${item.opts.map(([o, want], i) => {
        const tick = `<span class="tickbox" aria-hidden="true">${sel[i] ? '✓' : ''}</span>${numBadge(i)}`;
        const should = marks ? `<span class="should">${want ? 'should be ticked' : 'should be left'}</span>` : '';
        return `<button type="button" class="opt ${sel[i] ? 'sel' : ''} ${marks ? (marks[i] ? 'ok' : 'no') : ''}" data-i="${i}" aria-pressed="${sel[i]}" ${locked ? 'disabled' : ''}>${pics ? `<span class="ohead">${tick}${should}</span>${optInner(o)}` : `${tick}${optInner(o)}${should}`}</button>`;
      }).join('')}</div>
      <p class="tip">Tick as many as you need — there may be more than one. Every line you get right is a star.</p>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b || locked) return;
    const i = +b.dataset.i;
    sel[i] = !sel[i];
    draw(); changed();
    const again = root.querySelector(`.opt[data-i="${i}"]`); if (again) again.focus();
  });
  draw();
  return {
    ready: () => sel.some(Boolean),
    check() {
      locked = true;
      marks = sel.map((v, i) => v === item.opts[i][1]);
      draw();
      return {e: marks.filter(Boolean).length, t: item.opts.length,
        answer: item.opts.map((o, i) => o[1] ? `✓ ${esc(optLine(item, i))}` : null).filter(Boolean).join('<br>')};
    }
  };
};

/* ============ APP ============ */
const app = $('#app'), dock = $('#dock'), dockInner = $('#dockInner'), layer = $('#layer');
let screen = 'home', Q = null, timer = null, paused = false, cleanups = [], streak = 0;

function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function showLayer(html) { layer.innerHTML = html; const b = $('button', layer); if (b) b.focus(); }
function hideLayer() { layer.innerHTML = ''; }
function confirmBox({title, text, yes, no = 'Cancel', onYes, bot = false}) {
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="cbT"><div class="modal">${bot ? medal() : ''}<h2 id="cbT">${esc(title)}</h2><p>${esc(text)}</p><button class="btn btn-go btn-wide" id="cbYes">${esc(yes)}</button>${no === null ? '' : `<button class="btn btn-wide" id="cbNo">${esc(no)}</button>`}</div></div>`);
  $('#cbYes').onclick = () => { hideLayer(); onYes(); };
  const nb = $('#cbNo'); if (nb) nb.onclick = hideLayer;
}

function go(name) {
  screen = name; runCleanups(); hideLayer(); stopTimer();
  if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} }
  dock.className = 'dock hidden'; dockInner.innerHTML = ''; Q = null;
  ({home:renderHome, quiz:openQuiz, results:renderResults, history:renderHistory, settings:renderSettings}[name] || renderHome)();
  if (name !== 'quiz') window.scrollTo(0, 0);
}

/* ---------- Home ---------- */
function renderHome() {
  const c = S.current;
  let resume = '';
  if (c) {
    const set = getSet(c.setId), done = Object.keys(c.answers).length;
    resume = `<section class="resume" aria-labelledby="rsT">
      <h2 id="rsT">⏸ Paused: ${set.emoji} ${esc(set.title)}</h2>
      <p>${done} of ${c.queue.length} questions done${c.mode === 'fix' ? ' while fixing mistakes' : ''}. Time so far: ${fmtTime(c.elapsed)}.</p>
      <div class="row"><button class="btn btn-go" id="contBtn">▶ Continue</button><button class="btn" id="discardBtn">Start over</button></div>
    </section>`;
  }
  const order = setOrder();
  app.innerHTML = `
    <header class="hero">
      <div><h1>Science Champions</h1><p>Real TEDET science tests for Grade 3, written in easy English.</p></div>
      ${medal()}
    </header>
    ${storageOK ? '' : '<div class="notice">This browser is not saving progress right now. You can still play, but results may be lost when you close the page.</div>'}
    ${resume}
    <section class="sets" aria-labelledby="setsT">
      <h2 class="label" id="setsT">Choose a test</h2>
      ${order.map((id, pos) => {
        const set = getSet(id), rec = S.sets[id], best = rec && rec.best;
        const meta = best ? `Best: ${best.e} of ${best.t} (${best.pct}%)`
          : `${flat(set).length} questions, ${setTotal(set)} stars to win`;
        return `<button class="setcard" data-set="${id}">
          <span class="emoji" aria-hidden="true">${set.emoji}</span>
          <span><span class="sc-title">Set ${pos + 1}: ${esc(set.title)}</span><br><span class="meta">${esc(set.about)}</span><br><span class="meta">${meta}</span></span>
          <span class="go">${best ? starRow(starsFor(best.pct)) : 'Start ▶'}</span>
        </button>`;
      }).join('')}
    </section>
    <section class="card" style="margin-top:1.25rem">
      <h2 style="font-size:1.15rem">What every test covers</h2>
      <div class="knows">${Object.values(SECTIONS).map(s => `<span class="know">${s.icon} ${esc(s.name)}</span>`).join('')}</div>
      <p class="tip">Each set is one real TEDET test, with its 30 questions in the same order as the paper. In TEDET, some questions have more than one right answer. When a question says <b>Tick every answer that fits</b>, check every line on its own.</p>
    </section>
    <nav class="homefoot" aria-label="More">
      <button class="btn btn-sun" id="histBtn">🏆 My results</button>
      <button class="btn" id="setBtn">⚙️ Settings for grown-ups</button>
      <a class="btn" href="/">🏠 All activities</a>
    </nav>`;
  if (c) {
    $('#contBtn').onclick = () => go('quiz');
    $('#discardBtn').onclick = () => confirmBox({title:'Start over?', text:'The answers in your paused test will be cleared.', yes:'Yes, clear it', no:'Keep it', onYes(){ S.current = null; save(); go('home'); }});
  }
  $$('.setcard').forEach(b => b.onclick = () => tryStart(+b.dataset.set));
  $('#histBtn').onclick = () => go('history');
  $('#setBtn').onclick = () => go('settings');
}

function tryStart(id, mode = 'full', queue = null) {
  const c = S.current;
  if (c && c.setId === id && mode === 'full') {
    confirmBox({title:'That test is paused', text:'Do you want to keep going from where you stopped?', yes:'▶ Continue', no:'Start again', onYes(){ go('quiz'); }});
    $('#cbNo').onclick = () => { hideLayer(); startSet(id, mode, queue); };
    return;
  }
  if (c) { confirmBox({title:'You have a paused test', text:`Starting now will clear your paused test: ${getSet(c.setId).title}.`, yes:'Start the new test', no:'Cancel', onYes(){ startSet(id, mode, queue); }}); return; }
  startSet(id, mode, queue);
}
function startSet(id, mode = 'full', queue = null) {
  const f = flat(getSet(id));
  S.current = {setId:id, mode, queue: queue || f.map((_, i) => i), answers:{}, elapsed:0, started:Date.now()};
  streak = 0;
  save(); go('quiz');
}

/* ---------- Quiz ---------- */
function startTimer() {
  stopTimer();
  let last = Date.now(), ticks = 0;
  timer = setInterval(() => { const now = Date.now(); if (S.current && !paused) { S.current.elapsed += now - last; if (++ticks % 5 === 0) save(); } last = now; }, 1000);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function openQuiz() { if (!S.current) return go('home'); paused = false; renderQuestion(); if (screen === 'quiz' && S.current) startTimer(); }
function tally(c) { let e = 0, t = 0; Object.values(c.answers).forEach(a => { e += a.e; t += a.t; }); return {e, t}; }

function figureHtml(fig) {
  if (!fig) return '';
  if (fig.html) return `<figure class="figure" style="margin:0 0 1rem"><figcaption class="sr">${esc(fig.cap)}</figcaption>${fig.html}</figure>`;
  return `<div class="figure"><svg viewBox="${fig.box}" role="img" aria-label="${esc(fig.cap)}">${fig.svg}</svg></div>`;
}

function renderQuestion() {
  runCleanups();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  const pos = c.queue.findIndex(i => !c.answers[i]);
  if (pos < 0) return finishRun();
  const idx = c.queue[pos], {sec, item} = f[idx];
  const done = c.queue.length - c.queue.filter(i => !c.answers[i]).length;
  const pct = done / c.queue.length;
  const {e, t} = tally(c);
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-icon" id="pauseBtn" aria-label="Pause">⏸</button>
      <span class="where"><b>${set.emoji} ${esc(set.title)}</b><span>Question ${done + 1} of ${c.queue.length}</span></span>
      ${streak >= 3 ? `<span class="pill fire" aria-label="${streak} right in a row">🔥 ${streak}</span>` : ''}
      <span class="pill" id="scorePill" aria-label="${e} stars out of ${t}">⭐ ${e}/${t}</span>
    </div>
    <div class="track-wrap" aria-hidden="true">
      <div class="track"></div><div class="fill" style="width:${pct * 100}%"></div>
      <div class="walker" style="left:${pct * 100}%">${medal()}</div><div class="goal">🏁</div>
    </div>
    <article class="card" id="qcard">
      <span class="sec-tag">${SECTIONS[sec].icon} ${SECTIONS[sec].name} · Q${item.no}</span>
      <div class="prompt"><h2>${esc(promptFor(item))}</h2>${canSpeak ? '<button class="speak" id="speakBtn" aria-label="Read the question out loud">🔊</button>' : ''}</div>
      ${figureHtml(item.fig ? FIGURES[item.fig] : null)}
      <div id="qbody"></div>
    </article>
    <div class="dock-space" id="dockSpace"></div>`;
  const body = $('#qbody');
  const h = TYPES[item.t](item, body, () => { const b = $('#checkBtn'); if (b) b.disabled = !h.ready(); }, cleanups);
  Q = {idx, item, sec, h, checked:false};
  const sb = $('#speakBtn'); if (sb) sb.onclick = () => speak(speakText(item));
  $('#pauseBtn').onclick = pause;
  dock.className = 'dock';
  dockInner.innerHTML = `<button class="btn btn-go btn-wide" id="checkBtn" disabled>Check my answer</button>`;
  $('#checkBtn').onclick = doCheck;
  $('#checkBtn').disabled = !h.ready();
  syncDockSpace();
}
function syncDockSpace() { const sp = $('#dockSpace'); if (sp) sp.style.height = (dock.offsetHeight + 24) + 'px'; }

function doCheck() {
  if (!Q || Q.checked || !Q.h.ready()) return;
  const c = S.current, item = Q.item;
  const res = Q.h.check();
  Q.checked = true;
  c.answers[Q.idx] = {e: res.e, t: res.t};

  const full = res.t > 0 && res.e === res.t;
  if (full) { S.stats[Q.sec] = (S.stats[Q.sec] || 0) + 1; if (item.t === 'multi') S.stats.multi++; }
  streak = full ? streak + 1 : 0;
  if (streak > S.stats.streak) S.stats.streak = streak;

  const earned = newBadges();
  save();

  const {e, t} = tally(c);
  const pill = $('#scorePill'); pill.textContent = `⭐ ${e}/${t}`; pill.setAttribute('aria-label', `${e} stars out of ${t}`);

  const kind = res.e === res.t ? 'good' : res.e === 0 ? 'bad' : 'part';
  const frac = res.t ? res.e / res.t : 1;
  const title = kind === 'good' ? '✅ ' + pick(['Great thinking!', 'You got it!', 'Spot on!', 'Well done!', 'Exactly right!'])
    : kind === 'part' ? '🌟 ' + (frac >= 0.6
        ? pick(['Almost!', 'So close!', 'Good work, nearly all of it!'])
        : pick(['A good start!', 'Some of it is right.', 'Part of the way there.']))
    : '💪 ' + pick(['Nice try!', 'Good try!', 'Not quite yet.']);
  let body = '';
  if (kind !== 'good') body += `<p><span class="ans">The answer:</span><br>${res.answer}</p>`;
  if (kind === 'part' && res.t > 2) body += `<p>You got ${res.e} of the ${res.t} lines right.</p>`;
  if (item.explain) body += `<p class="why">💡 ${esc(item.explain)}</p>`;
  if (streak === 3) body += `<p>🔥 Three right in a row!</p>`;
  else if (streak >= 6) body += `<p>🔥 ${streak} in a row — you are on fire!</p>`;
  earned.forEach(b => { body += `<div class="badge-pop"><span class="bi">${b.icon}</span><span><b>New badge: ${esc(b.name)}</b><br><small>${esc(b.desc)}</small></span></div>`; });

  const last = c.queue.every(i => c.answers[i]);
  dock.className = 'dock ' + kind;
  dockInner.innerHTML = `<div class="fb" role="status"><h3>${title}<span class="gain">+${res.e} of ${res.t}</span></h3>${body}</div>
    <button class="btn btn-go btn-wide" id="nextBtn">${last ? '🏁 See my results' : 'Next question ▶'}</button>`;
  $('#nextBtn').onclick = next;
  $('#nextBtn').focus({preventScroll:true});
  syncDockSpace();
  beep(kind);
  if (kind === 'good') { const b = $('.walker .medal'); if (b) { b.classList.remove('happy'); void b.offsetWidth; b.classList.add('happy'); } }
}
function next() { if (!Q || !Q.checked) return; if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} } renderQuestion(); window.scrollTo(0, 0); }

function newBadges() {
  const out = [];
  BADGES.forEach(b => { if (!S.badges.includes(b.id) && b.got(S)) { S.badges.push(b.id); out.push(b); } });
  return out;
}

function pause() {
  if (!S.current) return;
  paused = true; save();
  if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) {} }
  const {e, t} = tally(S.current);
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="modal">${medal('sleepy')}<h2 id="pT">Paused</h2>
    <p>You have ${e} of ${t} stars so far. Your place is saved, so you can come back any time.</p>
    <button class="btn btn-go btn-wide" id="resumeBtn">▶ Keep going</button>
    <button class="btn btn-wide" id="homeBtn">Save and go home</button></div></div>`);
  $('#resumeBtn').onclick = resumeQuiz;
  $('#homeBtn').onclick = () => go('home');
}
function resumeQuiz() { paused = false; hideLayer(); }

function finishRun() {
  stopTimer();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  let e = 0, t = 0; const bySec = {};
  c.queue.forEach(i => { const a = c.answers[i], s = f[i].sec; bySec[s] = bySec[s] || {e:0, t:0}; if (a) { e += a.e; t += a.t; bySec[s].e += a.e; bySec[s].t += a.t; } });
  const pct = t ? Math.round(e / t * 100) : 0;
  const rec = S.sets[set.id] = S.sets[set.id] || {attempts:[], best:null};
  rec.attempts.unshift({mode:c.mode, e, t, pct, time:c.elapsed, date:Date.now()});
  rec.attempts = rec.attempts.slice(0, 20);
  if (c.mode === 'full' && (!rec.best || pct > rec.best.pct || (pct === rec.best.pct && c.elapsed < rec.best.time))) rec.best = {e, t, pct, time:c.elapsed, date:Date.now()};
  if (c.mode === 'fix') S.stats.fix++;
  S.lastRun = {setId:set.id, mode:c.mode, e, t, pct, time:c.elapsed, bySec, answers:c.answers, queue:c.queue};
  S.current = null;
  const earned = newBadges();
  S.lastRun.badges = earned.map(b => b.id);
  save();
  go('results');
}

/* ---------- Results ---------- */
function renderResults() {
  const r = S.lastRun; if (!r) return go('home');
  const set = getSet(r.setId), f = flat(set), stars = starsFor(r.pct);
  const order = setOrder(), pos = orderPos(set.id);
  const nextSet = pos + 1 < order.length ? getSet(order[pos + 1]) : null;
  const wrong = r.queue.filter(i => r.answers[i] && r.answers[i].t > 0 && r.answers[i].e < r.answers[i].t);
  const msg = r.mode === 'fix'
    ? (r.e === r.t ? 'You fixed every single mistake. Brilliant!' : `You fixed ${r.e} of ${r.t}. Keep going — you are getting better!`)
    : stars === 3 ? 'Outstanding work, champion!' : stars === 2 ? 'Really good science!' : stars === 1 ? 'Good effort — keep practising!' : 'Every champion starts somewhere. Try again!';
  const gotBadges = (r.badges || []).map(id => BADGES.find(b => b.id === id)).filter(Boolean);
  app.innerHTML = `
    ${storageOK ? '' : '<div class="notice">⚠️ This browser would not save these results. Nothing is lost while this page stays open — open Settings and use <b>Save backup</b> to keep them.</div>'}
    <div class="result-head">
      ${medal(stars >= 2 ? 'happy' : '')}
      <h1 id="rT" class="sr">Results</h1>
      <div class="big-stars" aria-label="${stars} of 3 stars">${[0,1,2].map(i => `<span class="${i < stars ? 'star-on' : 'star-off'}">★</span>`).join('')}</div>
      <p class="score-big">${r.e} / ${r.t}</p>
      <p>${r.pct}% — ${esc(msg)}</p>
      <p>Time: ${fmtTime(r.time)}</p>
    </div>
    ${gotBadges.length ? `<div class="card" style="margin-bottom:1rem"><h2 style="font-size:1.2rem">🎉 New badges</h2><div class="badges">${gotBadges.map(b => `<div class="badge on"><span class="bi">${b.icon}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`).join('')}</div></div>` : ''}
    <div class="card">
      <h2 style="font-size:1.25rem">How each topic went</h2>
      <div class="bars">${Object.keys(SECTIONS).filter(k => r.bySec[k] && r.bySec[k].t).map(k => {
        const b = r.bySec[k], p = Math.round(b.e / b.t * 100);
        return `<div class="bar-row"><span>${SECTIONS[k].icon} ${SECTIONS[k].name}</span><span>${b.e}/${b.t}</span><span class="bar"><i style="width:${p}%"></i></span></div>`;
      }).join('')}</div>
      <p class="tip">This test covered: ${set.aligns.map(a => esc(a)).join(' · ')}</p>
      ${wrong.length ? `<div class="review"><details><summary>🔎 Look again at ${wrong.length} question${wrong.length === 1 ? '' : 's'}</summary><ol>${wrong.map(i => {
        const it = f[i].item;
        return `<li><b>${esc(questionLabel(it))}</b><br>Answer: ${esc(answerText(it))}${it.explain ? `<br><span style="color:var(--ink-soft)">💡 ${esc(it.explain)}</span>` : ''}</li>`;
      }).join('')}</ol></details></div>` : ''}
      <div class="stack" style="margin-top:1.2rem">
        ${wrong.length ? `<button class="btn btn-go btn-wide" id="fixBtn">🔁 Fix my mistakes (${wrong.length})</button>` : ''}
        ${nextSet
          ? `<button class="btn ${wrong.length ? 'btn-sun' : 'btn-go'} btn-wide" id="upBtn">⬆ Next test: ${nextSet.emoji} ${esc(nextSet.title)}</button>`
          : `<p class="tip" style="text-align:center">That was the newest test! 🏁</p>`}
        <button class="btn btn-wide" id="againBtn">Try the whole test again</button>
        <button class="btn btn-wide" id="homeBtn2">🏠 Home</button>
      </div>
    </div>`;
  if (wrong.length) $('#fixBtn').onclick = () => startSet(set.id, 'fix', wrong);
  if (nextSet) $('#upBtn').onclick = () => tryStart(nextSet.id);
  $('#againBtn').onclick = () => startSet(set.id, 'full');
  $('#homeBtn2').onclick = () => go('home');
}

/* ---------- My results ---------- */
function renderHistory() {
  const order = setOrder();
  const any = order.some(id => S.sets[id] && S.sets[id].attempts.length);
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>🏆 My results</h1></div>
    <div class="hist">
      <section class="card">
        <h2 style="font-size:1.3rem">Badges (${S.badges.length} of ${BADGES.length})</h2>
        <div class="badges">${BADGES.map(b => {
          const on = S.badges.includes(b.id);
          return `<div class="badge ${on ? 'on' : 'off'}"><span class="bi">${b.icon}</span><b>${on ? esc(b.name) : 'Locked'}</b><small>${esc(b.desc)}</small></div>`;
        }).join('')}</div>
      </section>
      ${!any ? `<div class="card"><p style="margin:0;font-size:1.15rem">No results yet. Pick a test on the home page and give it a go!</p></div>` : ''}
      ${order.map((id, pos) => {
        const set = getSet(id), rec = S.sets[id];
        if (!rec || !rec.attempts.length) return '';
        return `<section class="card"><h2 style="font-size:1.3rem">${set.emoji} Set ${pos + 1}: ${esc(set.title)}</h2>
          <p style="margin:.3rem 0">${rec.best ? `Best score: <b>${rec.best.e} of ${rec.best.t}</b> (${rec.best.pct}%) ${starRow(starsFor(rec.best.pct))}` : 'Not finished as a whole test yet'}</p>
          <div class="knows">${set.aligns.map(a => `<span class="know">${esc(a)}</span>`).join('')}</div>
          <div class="scroll-x"><table><thead><tr><th>When</th><th>Type</th><th>Score</th><th>Time</th></tr></thead><tbody>
            ${rec.attempts.slice(0, 8).map(a => `<tr><td>${fmtDate(a.date)}</td><td>${a.mode === 'fix' ? 'Fix mistakes' : 'Whole test'}</td><td>${a.e}/${a.t} (${a.pct}%)</td><td>${fmtTime(a.time)}</td></tr>`).join('')}
          </tbody></table></div></section>`;
      }).join('')}
    </div>`;
  $('#backBtn').onclick = () => go('home');
}

/* ---------- Settings ---------- */
function renderSettings() {
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${String(S.settings[key]) === String(v)}">${l}</button>`).join('')}</div>`;
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>⚙️ Settings</h1></div>
    <div class="card">
      <div class="setting"><div><b>Text size</b><small>Bigger text is easier on young eyes.</small></div>${seg('size', [['normal', 'Big'], ['big', 'Bigger']])}</div>
      <div class="setting"><div><b>Colours</b><small>Dark is gentle at night.</small></div>${seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}</div>
      <div class="setting"><div><b>Sounds</b><small>Little chimes for right and wrong answers.</small></div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
      <div class="setting"><div><b>Backup progress</b><small>Saves a file with stars, badges and results.</small></div><button class="btn btn-small" id="exportBtn">Save backup</button></div>
      <div class="setting"><div><b>Restore progress</b><small>Load a backup from another device or an earlier day.</small></div><button class="btn btn-small" id="importBtn">Load backup</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>
      <div class="setting"><div><b>Clear all progress</b><small>Removes scores, badges and any paused test. Use this for a different child sharing this device.</small></div><button class="btn btn-small" id="resetBtn">Clear progress</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">About these tests</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">These are the four TEDET science tests for Grade 3 (Prathom 3) from 2022, 2023, 2024 and 2025 — B.E. 2565 to 2568. TEDET is a yearly test in Thailand that helps children work towards excellence in maths and science.</p>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Every question is here, in the same order and with the same five answers ①–⑤. The Thai has been rewritten in easy English for a Year 4 child who is still learning English, and every picture has been redrawn. Where an answer on the paper could be read two ways, it has been worded so that it is clearly right or clearly wrong. Each question explains its answer after you check it.</p>
      <div class="knows">${[...new Set(SETS.flatMap(s => s.aligns))].map(a => `<span class="know">${esc(a)}</span>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">How scoring works</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">A question with one right answer gives 1 star. In TEDET, some questions have more than one right answer: here those say <b>Tick every answer that fits</b>, and they give one star for each of the five lines judged correctly — ticked when it fits, left when it does not. (The real test gives the mark only when every line is right.) "Fix my mistakes" repeats only what was missed; the best score always comes from a whole-test try.</p>
      <div id="iosNote"></div>
    </div>`;
  $('#backBtn').onclick = () => go('home');
  $$('.seg button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; let v = b.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S.settings[k] = v; save(); applySettings(); renderSettings();
    const again = $(`.seg button[data-k="${k}"][data-v="${b.dataset.v}"]`); if (again) again.focus();
  });
  const installed = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const onIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const note = $('#iosNote');
  if (note) {
    if (onIOS && !installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:.7rem .9rem">' +
        '<b>Worth doing:</b> add this page to the Home Screen (Share → Add to Home Screen) and open it from that icon. ' +
        'Safari erases saved progress after about a week of not visiting. Home Screen apps keep theirs.</p>';
    } else if (installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;color:var(--ink-soft)">Running from the Home Screen — progress is kept safely.</p>';
    }
  }
  $('#exportBtn').onclick = () => {
    try {
      const stamp = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'science-champions-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      confirmBox({title:'Could not save', text:'This browser would not let the file be saved.', yes:'OK', no:null, onYes(){}});
    }
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(String(r.result)); } catch (e) {}
      if (!d || typeof d !== 'object' || typeof d.sets !== 'object' || d.sets === null) {
        confirmBox({title:'That file did not fit', text:'It is not a Science Champions backup. Look for a file named science-champions-....json', yes:'OK', no:null, onYes(){}});
        return;
      }
      const done = Object.keys(d.sets).length;
      const bits = [done + ' test' + (done === 1 ? '' : 's') + ' started'];
      if (d.current) bits.push('a paused test');
      confirmBox({
        title:'Load this backup?',
        text:'It has ' + bits.join(', ') + '. This replaces what is on this device now.',
        yes:'Yes, load it', no:'Cancel',
        onYes(){
          S = Object.assign(fresh(), d);
          S.settings = Object.assign(fresh().settings, d.settings || {});
          S.stats = Object.assign(freshStats(), d.stats || {});
          save(); applySettings(); go('home');
        }
      });
    };
    r.readAsText(f);
  };
  $('#resetBtn').onclick = () => confirmBox({
    title:'Clear all progress?',
    text:'Scores, badges and paused tests will be removed. The settings stay the same.',
    yes:'Yes, clear everything', no:'Cancel',
    onYes(){ const keep = S.settings; S = fresh(); S.settings = keep; save(); go('home'); }
  });
}

/* ---------- Global events ---------- */
document.addEventListener('keydown', e => {
  if (layer.innerHTML) { if (e.key === 'Escape') { if (paused) resumeQuiz(); else hideLayer(); } return; }
  if (screen !== 'quiz' || !Q) return;
  if (e.key === 'Enter' && e.target === document.body) {
    e.preventDefault();
    if (Q.checked) next(); else doCheck();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) return; if (screen === 'quiz') pause(); else save(); });
window.addEventListener('resize', syncDockSpace);
window.addEventListener('pagehide', save);

load(); applySettings(); save(); go('home');

/* ---------- Offline support ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
