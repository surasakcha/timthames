      inp.style.borderColor = ok ? 'var(--leaf)' : 'var(--berry)';
      const exact = item.accept.some(a => norm(a) === norm(inp.value).replace(/^(a|an|the)\s+/, ''));
      return {e: ok ? 1 : 0, t: 1, answer: esc(item.accept[0]), nearly: ok && !exact};
    },
    focus: () => inp.focus()
  };
};

/* The tick-or-cross table from the worksheet. Tap a box to cycle it. */
TYPES.grid = (item, root, changed) => {
  const state = item.rows.map(() => item.cols.map(() => 0)); // 0 blank, 1 tick, 2 cross
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `<div class="gridq"><table>
      <thead><tr><th></th>${item.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${item.rows.map(([label], r) => `<tr><th class="rowhead" scope="row">${esc(label)}</th>${item.cols.map((col, c) => {
        const v = state[r][c], ok = marks ? marks[r][c] : null;
        return `<td><button type="button" class="cell ${v === 1 ? 'tick' : v === 2 ? 'cross' : ''} ${ok === true ? 'ok' : ok === false ? 'no' : ''}"
          data-r="${r}" data-c="${c}" ${locked ? 'disabled' : ''}
          aria-label="${esc(label)}, ${esc(col)}: ${v === 1 ? 'tick' : v === 2 ? 'cross' : 'not answered yet'}">${v === 1 ? '✓' : v === 2 ? '✗' : ''}</button></td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="tip">Tap a box to change it: empty → ✓ → ✗ → empty. Fill in every box.</p>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('.cell');
    if (!b || locked) return;
    const r = +b.dataset.r, c = +b.dataset.c;
    state[r][c] = (state[r][c] + 1) % 3;
    draw(); changed();
  });
  draw();
  return {
    ready: () => state.every(row => row.every(v => v !== 0)),
    check() {
      locked = true;
      marks = state.map((row, r) => row.map((v, c) => (v === 1) === (item.rows[r][1][c] === 1)));
      draw();
      return {e: marks.flat().filter(Boolean).length, t: item.rows.length * item.cols.length,
        answer: item.rows.map(([label, want]) => `<b>${esc(label)}:</b> ${want.map((m, i) => `${esc(item.cols[i])} ${m ? '✓' : '✗'}`).join(' · ')}`).join('<br>')};
    }
  };
};

/* Tick every one that is true. Scored per option, so a child has to judge
   each line on its own instead of hunting for the single best answer. */
TYPES.multi = (item, root, changed) => {
  const sel = item.opts.map(() => false);
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `${item.text ? `<p class="qtext">${esc(item.text)}</p>` : ''}
      <div class="opts long multi" role="group" aria-label="Tick every one that is true">${item.opts.map(([txt, want], i) =>
        `<button type="button" class="opt ${sel[i] ? 'sel' : ''} ${marks ? (marks[i] ? 'ok' : 'no') : ''}" data-i="${i}"
           aria-pressed="${sel[i]}" ${locked ? 'disabled' : ''}>
           <span class="tickbox" aria-hidden="true">${sel[i] ? '\u2713' : ''}</span><span>${esc(txt)}</span>
           ${marks ? `<span class="should">${want ? 'should be ticked' : 'should be left'}</span>` : ''}
         </button>`).join('')}</div>
      <p class="tip">Tick as many as you need \u2014 there may be more than one. Every line you get right is a star.</p>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b || locked) return;
    const i = +b.dataset.i;
    sel[i] = !sel[i];
    draw(); changed();
  });
  draw();
  return {
    ready: () => sel.some(Boolean),
    check() {
      locked = true;
      marks = sel.map((v, i) => v === item.opts[i][1]);
      draw();
      return {e: marks.filter(Boolean).length, t: item.opts.length,
        answer: item.opts.filter(o => o[1]).map(o => `\u2713 ${esc(o[0])}`).join('<br>')};
    }
  };
};

/* Several statements, each one true or false. One star per row. */
TYPES.tfgrid = (item, root, changed) => {
  const given = item.rows.map(() => null);
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `<div class="tflist">${item.rows.map(([text], i) => `
      <div class="tfrow ${marks ? (marks[i] ? 'ok' : 'no') : ''}">
        <span>${esc(text)}</span>
        <span class="tfbtns" role="group" aria-label="True or false: ${esc(text)}">
          <button type="button" data-i="${i}" data-v="1" aria-pressed="${given[i] === true}" ${locked ? 'disabled' : ''}>True</button>
          <button type="button" data-i="${i}" data-v="0" aria-pressed="${given[i] === false}" ${locked ? 'disabled' : ''}>False</button>
        </span>
      </div>`).join('')}</div>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || locked) return;
    given[+b.dataset.i] = b.dataset.v === '1';
    draw(); changed();
  });
  draw();
  return {
    ready: () => given.every(a => a !== null),
    check() {
      locked = true;
      marks = given.map((a, i) => a === item.rows[i][1]);
      draw();
      return {e: marks.filter(Boolean).length, t: item.rows.length,
        answer: item.rows.map(([text, want]) => `<b>${want ? 'True' : 'False'}</b> — ${esc(text)}`).join('<br>')};
    }
  };
};

const LINE_COLORS = ['var(--sky)', 'var(--sun)', '#8E6AC8', '#D0668E', '#2E9C96', '#C07A34'];
TYPES.match = (item, root, changed, cleanups) => {
  const n = item.left.length;
  const rightOrder = shuffleNotSame(item.right.map((_, i) => i));
  const conn = {};
  let sel = null, temp = null, locked = false, result = false;
  root.innerHTML = `<p class="tip" style="margin:0 0 .9rem">Drag from a box on one side to a box on the other, or tap one on each side.</p>
    <div class="match">
      <svg class="lines" aria-hidden="true"></svg>
      <div class="match-col">${item.left.map((l, i) => `<button class="m-item left" data-side="L" data-i="${i}"><span>${esc(l.label)}</span><span class="dot"></span></button>`).join('')}</div>
      <div class="match-col">${rightOrder.map(ri => `<button class="m-item right" data-side="R" data-i="${ri}">${esc(item.right[ri])}<span class="dot"></span></button>`).join('')}</div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:.9rem"><button class="btn btn-small" id="clearLines" type="button">Clear lines</button></div>`;
  const box = $('.match', root), svg = $('svg.lines', root);
  const itemEl = (side, i) => box.querySelector(`.m-item[data-side="${side}"][data-i="${i}"]`);
  const dotPt = el => { const b = box.getBoundingClientRect(), r = el.getBoundingClientRect(); return {x: (el.dataset.side === 'L' ? r.right : r.left) - b.left, y: r.top + r.height / 2 - b.top}; };
  const curve = (a, b) => { const dx = (b.x - a.x) * 0.45; return `M${a.x} ${a.y} C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`; };
  function redraw() {
    let html = '';
    Object.entries(conn).forEach(([li, ri]) => {
      const a = dotPt(itemEl('L', li)), b = dotPt(itemEl('R', ri));
      let color = LINE_COLORS[li % LINE_COLORS.length], extra = '';
      if (result) { const ok = +li === +ri; color = ok ? 'var(--leaf)' : 'var(--berry)'; if (!ok) extra = 'stroke-dasharray="10 8"'; }
      html += `<path d="${curve(a, b)}" stroke="${color}" ${extra}/>`;
    });
    if (temp) { const bb = box.getBoundingClientRect(); html += `<path d="${curve(dotPt(temp.el), {x: temp.cx - bb.left, y: temp.cy - bb.top})}" stroke="var(--ink-soft)" stroke-dasharray="6 7"/>`; }
    svg.innerHTML = html;
    $$('.m-item', box).forEach(el => {
      const side = el.dataset.side, i = +el.dataset.i;
      el.classList.toggle('linked', side === 'L' ? conn[i] !== undefined : Object.values(conn).includes(i));
      el.classList.toggle('sel', !!sel && sel.side === side && sel.i === i);
    });
  }
  function link(li, ri) { for (const k in conn) if (conn[k] === ri) delete conn[k]; conn[li] = ri; sel = null; redraw(); changed(); }
  function unlink(side, i) { if (side === 'L') delete conn[i]; else for (const k in conn) if (conn[k] === i) delete conn[k]; }
  function tapItem(side, i) {
    if (sel && sel.side !== side) { side === 'L' ? link(i, sel.i) : link(sel.i, i); return; }
    if (sel && sel.side === side && sel.i === i) { unlink(side, i); sel = null; redraw(); changed(); return; }
    sel = {side, i}; redraw();
  }
  box.addEventListener('pointerdown', e => {
    const el = e.target.closest('.m-item');
    if (!el || locked || e.button > 0) return;
    e.preventDefault();
    const side = el.dataset.side, i = +el.dataset.i, sx = e.clientX, sy = e.clientY;
    let dragging = false;
    const scroller = autoScroller(() => { if (temp) redraw(); });
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) dragging = true;
      if (dragging) { temp = {el, cx: ev.clientX, cy: ev.clientY}; sel = {side, i}; scroller.update(ev.clientY); redraw(); }
    };
    const end = ev => {
      scroller.stop();
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (dragging) {
        temp = null;
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        const t = hit && hit.closest('.m-item');
        if (ev.type === 'pointerup' && t && box.contains(t) && t.dataset.side !== side) { const j = +t.dataset.i; side === 'L' ? link(i, j) : link(j, i); }
        else { sel = null; redraw(); }
      } else if (ev.type === 'pointerup') tapItem(side, i);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  box.addEventListener('click', e => { const el = e.target.closest('.m-item'); if (el && e.detail === 0 && !locked) tapItem(el.dataset.side, +el.dataset.i); });
  $('#clearLines', root).addEventListener('click', () => { if (locked) return; for (const k in conn) delete conn[k]; sel = null; redraw(); changed(); });
  const ro = new ResizeObserver(() => redraw()); ro.observe(box);
  cleanups.push(() => ro.disconnect());
  requestAnimationFrame(redraw);
  return {
    ready: () => Object.keys(conn).length === n,
    check() {
      locked = true; result = true; let e = 0;
      for (let i = 0; i < n; i++) {
        const ok = conn[i] === i; if (ok) e++;
        itemEl('L', i).classList.add(ok ? 'ok' : 'no');
        const r = itemEl('R', i), rOk = Object.entries(conn).some(([li, ri]) => ri === i && +li === i);
        r.classList.add(rOk ? 'ok' : 'no');
      }
      $$('.m-item', box).forEach(b => b.disabled = true);
      $('#clearLines', root).disabled = true;
      redraw();
      return {e, t: n, answer: item.left.map((l, i) => `<b>${esc(l.label)}</b> ➜ ${esc(item.right[i])}`).join('<br>')};
    }
  };
};

/* Put the steps in the right order: drag them, or use the little arrows. */
TYPES.order = (item, root, changed) => {
  const n = item.items.length;
  let seq = shuffleNotSame(item.items.map((_, i) => i));
  let locked = false, marks = null, dragPos = -1;
  function draw() {
    root.innerHTML = `<p class="tip" style="margin:0 0 .9rem">Drag a card up or down, or use the ▲ ▼ arrows, until the order is right.</p>
      <div class="orderlist">${seq.map((si, p) => `
        <div class="ord ${dragPos === p ? 'dragging' : ''} ${marks ? (marks[p] ? 'ok' : 'no') : ''}" data-p="${p}" role="listitem" aria-label="Position ${p + 1}: ${esc(item.items[si])}">
          <span class="num">${p + 1}</span>
          <span>${esc(item.items[si])}</span>
          <span class="ord-move">
            <button type="button" data-up="${p}" aria-label="Move up" ${p === 0 || locked ? 'disabled' : ''}>▲</button>
            <button type="button" data-down="${p}" aria-label="Move down" ${p === n - 1 || locked ? 'disabled' : ''}>▼</button>
          </span>
        </div>`).join('')}</div>`;
  }
  function move(from, to) {
    if (to < 0 || to >= n || from === to) return;
    const [x] = seq.splice(from, 1); seq.splice(to, 0, x);
  }
  draw();
  root.addEventListener('click', e => {
    if (locked) return;
    const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-down]');
    if (up) { const p = +up.dataset.up; move(p, p - 1); draw(); changed(); const f = $(`[data-up="${p - 1}"]`, root); if (f) f.focus(); }
    else if (dn) { const p = +dn.dataset.down; move(p, p + 1); draw(); changed(); const f = $(`[data-down="${p + 1}"]`, root); if (f) f.focus(); }
  });
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('.ord');
    if (!el || locked || e.button > 0 || e.target.closest('.ord-move')) return;
    e.preventDefault();
    const sy = e.clientY;
    dragPos = +el.dataset.p;
    let ghost = null;
    const scroller = autoScroller(() => {});
    const place = y => {
      const rows = $$('.ord', root);
      let target = dragPos;
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].getBoundingClientRect();
        if (y > r.top && y < r.bottom) { target = i; break; }
        if (i === 0 && y <= r.top) target = 0;
        if (i === rows.length - 1 && y >= r.bottom) target = rows.length - 1;
      }
      if (target !== dragPos) { move(dragPos, target); dragPos = target; draw(); }
    };
    const onMove = ev => {
      if (!ghost) {
        if (Math.abs(ev.clientY - sy) < 8) return;
        ghost = el.cloneNode(true);
        ghost.classList.add('ghost'); ghost.classList.remove('dragging');
        ghost.style.width = el.getBoundingClientRect().width + 'px';
        document.body.appendChild(ghost);
        draw();
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      scroller.update(ev.clientY);
      place(ev.clientY);
    };
    const end = () => {
      scroller.stop();
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (ghost) { ghost.remove(); changed(); }
      dragPos = -1; draw();
    };
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  return {
    ready: () => true,
    check() {
      locked = true;
      marks = seq.map((si, p) => si === p);
      draw();
      return {e: marks.filter(Boolean).length, t: n, answer: item.items.map((t, i) => `<b>${i + 1}.</b> ${esc(t)}`).join('<br>')};
    }
  };
};

/* Label the compass rose. One star per point. */
const COMPASS_PTS = {
  4: [['N', 50, 8], ['E', 92, 50], ['S', 50, 92], ['W', 8, 50]],
  8: [['N', 50, 6], ['NE', 84, 16], ['E', 94, 50], ['SE', 84, 84], ['S', 50, 94], ['SW', 16, 84], ['W', 6, 50], ['NW', 16, 16]]
};
TYPES.compass = (item, root, changed) => {
  const pts = COMPASS_PTS[item.points || 4];
  const words = shuffleNotSame(pts.map(pt => pt[0])).map((w, i) => ({id:i, w}));
  const slots = pts.map(() => null);
  let sel = null, locked = false, marks = null;
  function draw() {
    const bank = words.filter(w => !slots.includes(w.id));
    root.innerHTML = `<div class="bank" data-drop="bank"><span class="bank-label">Drag a label onto a point of the rose, or tap a label and then tap a point.</span>${bank.map(w =>
        `<span class="chip ${sel === w.id ? 'sel' : ''}" data-id="${w.id}" role="button" tabindex="0">${esc(w.w)}</span>`).join('')}</div>
      <div class="compasswrap"><svg viewBox="0 0 200 200" aria-hidden="true">${roseSvg(pts.length, false)}</svg>
      ${pts.map((pt, i) => {
        const cid = slots[i], w = cid === null ? null : words[cid];
        const mk = marks ? (marks[i] ? ' ok' : ' no') : '';
        return `<span class="cslot${mk}" data-drop="${i}" role="button" tabindex="0" style="left:${pt[1]}%;top:${pt[2]}%"
           aria-label="Compass point ${i + 1}${w ? ': ' + esc(w.w) : ', empty'}">${w ? `<span class="chip ${marks ? (marks[i] ? 'ok' : 'no') : ''}" data-id="${w.id}">${esc(w.w)}</span>` : ''}</span>`;
      }).join('')}</div>`;
  }
  function drop(id, zone) {
    id = +id; const from = slots.indexOf(id);
    if (zone === 'bank') { if (from >= 0) slots[from] = null; }
    else { const si = +zone, prev = slots[si]; if (from >= 0) slots[from] = prev; slots[si] = id; }
    sel = null; draw(); changed();
  }
  draw();
  dnd(root, {
    locked: () => locked,
    tap(id) { id = +id; if (slots.includes(id)) drop(id, 'bank'); else { sel = sel === id ? null : id; draw(); } },
    drop,
    zoneTap(zone) { if (sel !== null) drop(sel, zone); else if (zone !== 'bank' && slots[+zone] !== null) drop(slots[+zone], 'bank'); }
  });
  return {
    ready: () => slots.every(x => x !== null),
    check() {
      locked = true;
      marks = slots.map((cid, i) => cid !== null && words[cid].w === pts[i][0]);
      draw();
      return {e: marks.filter(Boolean).length, t: pts.length,
        answer: pts.map(pt => `<b>${pt[0]}</b>`).join(' \u2192 ') + ' going clockwise from the top'};
    }
  };
};

/* Find the square on a map grid. Coordinates read letter first, then number. */
TYPES.gridmap = (item, root, changed) => {
  let sel = null, locked = false;
  function draw() {
    root.innerHTML = `${item.text ? `<p class="qtext">${esc(item.text)}</p>` : ''}
      <div class="gmwrap"><table class="gmap">
        <thead><tr><th></th>${item.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${item.rows.map(r => `<tr><th scope="row">${esc(String(r))}</th>${item.cols.map(c => {
          const key = c + r;
          const here = item.places.filter(pl => pl.c === c && String(pl.r) === String(r));
          const state = locked ? (key === item.ans ? 'ok' : key === sel ? 'no' : '') : (key === sel ? 'sel' : '');
          return `<td><button type="button" class="gcell ${state}" data-k="${key}" ${locked ? 'disabled' : ''}
             aria-label="Square ${key}${here.length ? ': ' + here.map(pl => pl.n).join(', ') : ', empty'}">${here.map(pl =>
               `<span class="ge" aria-hidden="true">${pl.e}</span><span class="gn">${esc(pl.n)}</span>`).join('')}</button></td>`;
        }).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <p class="tip">Tap the square that answers the question. Read the letter across the top first, then the number down the side.</p>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('.gcell');
    if (!b || locked) return;
    sel = b.dataset.k; draw(); changed();
  });
  draw();
  return {
    ready: () => sel !== null,
    check() { locked = true; draw(); return {e: sel === item.ans ? 1 : 0, t: 1, answer: `square <b>${esc(item.ans)}</b>`}; }
  };
};

/* Draw a picture. Saved in My Sketchbook. */
const PEN_COLORS = ['#1F2A37', '#C0392B', '#2F76A8', '#2E8B57', '#D9841C', '#8E6AC8'];
TYPES.draw = (item, root, changed) => {
  root.innerHTML = `<p class="clue">${esc(item.tip)}</p>
    <div class="padwrap">
      <canvas id="pad" class="pad" width="600" height="400" aria-label="Drawing area. Use a finger, a pen or a mouse."></canvas>
      <div class="padtools" role="group" aria-label="Drawing tools">
        ${PEN_COLORS.map((c, i) => `<button type="button" class="swatch" data-c="${i}" style="background:${c}" aria-label="Colour ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}
        <button type="button" class="btn btn-small" id="undoBtn">↶ Undo</button>
        <button type="button" class="btn btn-small" id="clearPad">Start again</button>
      </div>
      <p class="padnote">Draw your picture, then tap Save. There are no wrong answers here.</p>
    </div>`;
  const cv = $('#pad', root), ctx = cv.getContext('2d');
  let strokes = [], cur = null, color = PEN_COLORS[0], locked = false;
  function repaint() {
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of strokes.concat(cur ? [cur] : [])) {
      if (s.pts.length < 2) { ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.pts[0].x, s.pts[0].y, s.w / 2, 0, 7); ctx.fill(); continue; }
      ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
      ctx.stroke();
    }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height}; };
  cv.addEventListener('pointerdown', e => {
    if (locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = {c: color, w: 6, pts: [pos(e)]}; repaint();
  });
  cv.addEventListener('pointermove', e => { if (!cur) return; cur.pts.push(pos(e)); repaint(); });
  const stop = () => { if (!cur) return; strokes.push(cur); cur = null; repaint(); changed(); };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  cv.addEventListener('pointerleave', stop);
  $$('.swatch', root).forEach(b => b.onclick = () => {
    color = PEN_COLORS[+b.dataset.c];
    $$('.swatch', root).forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  $('#undoBtn', root).onclick = () => { if (locked) return; strokes.pop(); repaint(); changed(); };
  $('#clearPad', root).onclick = () => { if (locked) return; strokes = []; repaint(); changed(); };
  repaint();
  return {
    ready: () => strokes.length > 0,
    check() {
      locked = true;
      let url = '';
      try {
        const small = document.createElement('canvas');
        small.width = 420; small.height = 280;
        const sc = small.getContext('2d');
        sc.fillStyle = '#FFFFFF'; sc.fillRect(0, 0, 420, 280);
        sc.drawImage(cv, 0, 0, 420, 280);
        url = small.toDataURL('image/png');
      } catch (e) {}
      return {e: 0, t: 0, picture: url, strokes: strokes.length};
    }
  };
};

/* ============ APP ============ */
const app = $('#app'), dock = $('#dock'), dockInner = $('#dockInner'), layer = $('#layer');
let screen = 'home', Q = null, timer = null, paused = false, cleanups = [], streak = 0;

function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function showLayer(html) { layer.innerHTML = html; const b = $('button', layer); if (b) b.focus(); }
function hideLayer() { layer.innerHTML = ''; }
function confirmBox({title, text, yes, no = 'Cancel', onYes, bot = false}) {
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="cbT"><div class="modal">${bot ? globe() : ''}<h2 id="cbT">${esc(title)}</h2><p>${esc(text)}</p><button class="btn btn-go btn-wide" id="cbYes">${esc(yes)}</button>${no === null ? '' : `<button class="btn btn-wide" id="cbNo">${esc(no)}</button>`}</div></div>`);
  $('#cbYes').onclick = () => { hideLayer(); onYes(); };
  const nb = $('#cbNo'); if (nb) nb.onclick = hideLayer;
}

function go(name) {
  screen = name; runCleanups(); hideLayer(); stopTimer();
  dock.className = 'dock hidden'; dockInner.innerHTML = ''; Q = null;
  ({home:renderHome, quiz:openQuiz, results:renderResults, history:renderHistory, settings:renderSettings}[name] || renderHome)();
  if (name !== 'quiz') window.scrollTo(0, 0);
}

/* ---------- Home ---------- */
function renderHome() {
  const c = S.current;
  let resume = '';
  if (c) {
    const set = getSet(c.setId), done = Object.keys(c.answers).length;
    resume = `<section class="resume" aria-labelledby="rsT">
      <h2 id="rsT">⏸ Paused: ${set.emoji} ${esc(set.title)}</h2>
      <p>${done} of ${c.queue.length} questions done${c.mode === 'fix' ? ' while fixing mistakes' : ''}. Time so far: ${fmtTime(c.elapsed)}.</p>
      <div class="row"><button class="btn btn-go" id="contBtn">▶ Continue</button><button class="btn" id="discardBtn">Start over</button></div>
    </section>`;
  }
  const order = setOrder();
  app.innerHTML = `
    <header class="hero">
      <div><h1>World Explorers</h1><p>Climate, compasses, maps, landforms, resources and people.</p></div>
      ${globe()}
    </header>
    ${storageOK ? '' : '<div class="notice">This browser is not saving progress right now. You can still play, but results may be lost when you close the page.</div>'}
    ${resume}
    <section class="sets" aria-labelledby="setsT">
      <h2 class="label" id="setsT">Choose a set</h2>

        const meta = !open ? `🔒 Score ${PASS}% or more on set ${pos} to open this one`
          : best ? `Best: ${best.e} of ${best.t} (${best.pct}%)`
          : `${flat(set).length} questions, ${setTotal(set)} stars to win`;
        return `<button class="setcard ${open ? '' : 'locked'}" data-set="${id}" ${open ? '' : 'aria-disabled="true"'}>
          <span class="emoji" aria-hidden="true">${set.emoji}</span>
          <span><span class="sc-title">Set ${pos + 1}: ${esc(set.title)}${set.challenge ? '<span class="chal">Challenge</span>' : ''}</span><br><span class="meta">${esc(set.about)}</span><br><span class="meta">${meta}</span></span>
          <span class="go">${open ? (best ? starRow(starsFor(best.pct)) : 'Start ▶') : 'Locked'}</span>
        </button>`;
      }).join('')}
    </section>
    <section class="card" style="margin-top:1.25rem">
      <h2 style="font-size:1.15rem">What every set covers</h2>
      <div class="knows">${Object.values(SECTIONS).map(s => `<span class="know">${s.icon} ${esc(s.name)}</span>`).join('')}</div>
      <p class="tip">Every set covers all six topics, so you can start with any set you like.</p>
    </section>
    <nav class="homefoot" aria-label="More">
      <button class="btn btn-sun" id="histBtn">🏆 My results</button>
      <button class="btn" id="setBtn">⚙️ Settings for grown-ups</button>
      <a class="btn" href="/">🏠 All activities</a>
    </nav>`;
  if (c) {
    $('#contBtn').onclick = () => go('quiz');
    $('#discardBtn').onclick = () => confirmBox({title:'Start over?', text:'The answers in your paused set will be cleared.', yes:'Yes, clear it', no:'Keep it', onYes(){ S.current = null; save(); go('home'); }});
  }
  $$('.setcard').forEach(b => b.onclick = () => {
    const id = +b.dataset.set;
    if (!isUnlocked(id)) {
      const pos = orderPos(id);
      let t = pos - 1; while (t > 0 && !isUnlocked(order[t])) t--;
      confirmBox({title:'This set is locked', text:`Score ${PASS}% or more on set ${pos} to open this one. You can do it!`, yes:`Go to set ${t + 1}`, no:'Close', bot:true, onYes(){ tryStart(order[t]); }});
      return;
    }
    tryStart(id);
  });
  $('#histBtn').onclick = () => go('history');
  $('#setBtn').onclick = () => go('settings');
}

function tryStart(id, mode = 'full', queue = null) {
  const c = S.current;
  if (c && c.setId === id && mode === 'full') {
    confirmBox({title:'That set is paused', text:'Do you want to keep going from where you stopped?', yes:'▶ Continue', no:'Start again', onYes(){ go('quiz'); }});
    $('#cbNo').onclick = () => { hideLayer(); startSet(id, mode, queue); };
    return;
  }
  if (c) { confirmBox({title:'You have a paused set', text:`Starting now will clear your paused set: ${getSet(c.setId).title}.`, yes:'Start the new set', no:'Cancel', onYes(){ startSet(id, mode, queue); }}); return; }
  startSet(id, mode, queue);
}
function startSet(id, mode = 'full', queue = null) {
  const f = flat(getSet(id));
  S.current = {setId:id, mode, queue: queue || f.map((_, i) => i), answers:{}, elapsed:0, started:Date.now()};
  streak = 0;
  save(); go('quiz');
}

/* ---------- Quiz ---------- */
function startTimer() {
  stopTimer();
  let last = Date.now(), ticks = 0;
  timer = setInterval(() => { const now = Date.now(); if (S.current && !paused) { S.current.elapsed += now - last; if (++ticks % 5 === 0) save(); } last = now; }, 1000);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function openQuiz() { if (!S.current) return go('home'); paused = false; renderQuestion(); if (screen === 'quiz' && S.current) startTimer(); }
function tally(c) { let e = 0, t = 0; Object.values(c.answers).forEach(a => { e += a.e; t += a.t; }); return {e, t}; }

function renderQuestion() {
  runCleanups();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  const pos = c.queue.findIndex(i => !c.answers[i]);
  if (pos < 0) return finishRun();
  const idx = c.queue[pos], {sec, item} = f[idx];
  const done = c.queue.length - c.queue.filter(i => !c.answers[i]).length;
  const pct = done / c.queue.length;
  const {e, t} = tally(c);
  const fig = item.fig ? FIGURES[item.fig] : null;
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-icon" id="pauseBtn" aria-label="Pause">⏸</button>
      <span class="where"><b>${set.emoji} ${esc(set.title)}</b><span>Question ${done + 1} of ${c.queue.length}</span></span>
      ${streak >= 3 ? `<span class="pill fire" aria-label="${streak} right in a row">🔥 ${streak}</span>` : ''}
      <span class="pill" id="scorePill" aria-label="${e} stars out of ${t}">⭐ ${e}/${t}</span>
    </div>
    <div class="track-wrap" aria-hidden="true">
      <div class="track"></div><div class="fill" style="width:${pct * 100}%"></div>
      <div class="walker" style="left:${pct * 100}%">${globe()}</div><div class="goal">🏁</div>
    </div>
    <article class="card" id="qcard">
      <span class="sec-tag">${SECTIONS[sec].icon} ${SECTIONS[sec].name}</span>
      <div class="prompt"><h2>${esc(item.prompt)}</h2>${canSpeak ? '<button class="speak" id="speakBtn" aria-label="Read the question out loud">🔊</button>' : ''}</div>
      ${fig ? `<div class="figure"><svg viewBox="${fig.box}" role="img" aria-label="${esc(fig.cap)}">${fig.svg}</svg></div>` : ''}
      <div id="qbody"></div>
    </article>
    <div class="dock-space" id="dockSpace"></div>`;
  const body = $('#qbody');
  const h = TYPES[item.t](item, body, () => { const b = $('#checkBtn'); if (b) b.disabled = !h.ready(); }, cleanups);
  Q = {idx, item, sec, h, checked:false};
  const sb = $('#speakBtn'); if (sb) sb.onclick = () => speak(speakText(item));
  $('#pauseBtn').onclick = pause;
  dock.className = 'dock';
  dockInner.innerHTML = `<button class="btn btn-go btn-wide" id="checkBtn" disabled>${item.t === 'draw' ? 'Save my drawing' : 'Check my answer'}</button>`;
  $('#checkBtn').onclick = doCheck;
  $('#checkBtn').disabled = !h.ready();
  syncDockSpace();
}
function syncDockSpace() { const sp = $('#dockSpace'); if (sp) sp.style.height = (dock.offsetHeight + 24) + 'px'; }

function doCheck() {
  if (!Q || Q.checked || !Q.h.ready()) return;
  const c = S.current, set = getSet(c.setId), item = Q.item;
  const res = Q.h.check();
  Q.checked = true;
  c.answers[Q.idx] = {e: res.e, t: res.t};

  if (item.t === 'draw' && res.picture) { S.gallery.unshift({setId:set.id, img:res.picture, tip:item.tip, date:Date.now()}); S.gallery = S.gallery.slice(0, 12); }

  const full = res.t > 0 && res.e === res.t;
  if (item.t === 'compass' && full) S.stats.compass++;
  if (item.t === 'gridmap' && full) S.stats.map++;
  if (item.t === 'draw') S.stats.draw++;
  if (item.fig && /bars$/.test(item.fig) && full) S.stats.chart++;
  if (Q.sec === 'climate' && full) S.stats.climate++;
  if (Q.sec === 'resources' && full) S.stats.resources++;
  if (res.t > 0) { streak = full ? streak + 1 : 0; if (streak > S.stats.streak) S.stats.streak = streak; }

  const earned = newBadges();
  save();

  const {e, t} = tally(c);
  const pill = $('#scorePill'); pill.textContent = `⭐ ${e}/${t}`; pill.setAttribute('aria-label', `${e} stars out of ${t}`);

  const kind = res.t === 0 || res.e === res.t ? 'good' : res.e === 0 ? 'bad' : 'part';
  let title, body = '';
  if (item.t === 'draw') {
    title = '🎨 Lovely drawing!';
    body = `<p>Your drawing is saved in My Sketchbook. ${res.strokes > 12 ? 'You put a lot of detail into that one!' : 'Come back any time and draw another.'}</p>`;
  } else {
    /* With a table worth a dozen stars, "nearly all of it" has to mean it. */
    const frac = res.t ? res.e / res.t : 1;
    title = kind === 'good' ? '✅ ' + pick(['Great thinking!', 'You got it!', 'Spot on!', 'Well done!', 'Exactly right!'])
      : kind === 'part' ? '🌟 ' + (frac >= 0.6
          ? pick(['Almost!', 'So close!', 'Good work, nearly all of it!'])
          : pick(['A good start!', 'Some of it is right.', 'Part of the way there.']))
      : '💪 ' + pick(['Nice try!', 'Good try!', 'Not quite yet.']);
    if (item.t === 'type' && res.nearly) body += `<p>Right word — just watch the spelling: <b>${esc(item.accept[0])}</b>.</p>`;
    if (kind !== 'good') body += `<p><span class="ans">The answer:</span><br>${res.answer}</p>`;
    if (kind === 'part' && res.t > 2) body += `<p>You got ${res.e} of the ${res.t} parts right.</p>`;
  }
  if (item.explain) body += `<p class="why">💡 ${esc(item.explain)}</p>`;
  if (streak === 3) body += `<p>🔥 Three right in a row!</p>`;
  else if (streak >= 6) body += `<p>🔥 ${streak} in a row — you are on fire!</p>`;
  earned.forEach(b => { body += `<div class="badge-pop"><span class="bi">${b.icon}</span><span><b>New badge: ${esc(b.name)}</b><br><small>${esc(b.desc)}</small></span></div>`; });

  const gain = res.t ? `+${res.e} of ${res.t}` : 'Saved';
  const last = c.queue.every(i => c.answers[i]);
  dock.className = 'dock ' + kind;
  dockInner.innerHTML = `<div class="fb" role="status"><h3>${title}<span class="gain">${gain}</span></h3>${body}</div>
    <button class="btn btn-go btn-wide" id="nextBtn">${last ? '🏁 See my results' : 'Next question ▶'}</button>`;
  $('#nextBtn').onclick = next;
  $('#nextBtn').focus({preventScroll:true});
  syncDockSpace();
  beep(res.t === 0 ? 'good' : kind);
  if (kind === 'good') { const b = $('.walker .globe'); if (b) { b.classList.remove('happy'); void b.offsetWidth; b.classList.add('happy'); } }
}
function next() { if (!Q || !Q.checked) return; renderQuestion(); window.scrollTo(0, 0); const f = Q && Q.h && Q.h.focus; if (f && matchMedia('(pointer: fine)').matches) f(); }

function newBadges() {
  const out = [];
  BADGES.forEach(b => { if (!S.badges.includes(b.id) && b.got(S)) { S.badges.push(b.id); out.push(b); } });
  return out;
}

function pause() {
  if (!S.current) return;
  paused = true; save();
  const {e, t} = tally(S.current);
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="modal">${globe('sleepy')}<h2 id="pT">Paused</h2>
    <p>You have ${e} of ${t} stars so far. Your place is saved, so you can come back any time.</p>
    <button class="btn btn-go btn-wide" id="resumeBtn">▶ Keep going</button>
    <button class="btn btn-wide" id="homeBtn">Save and go home</button></div></div>`);
  $('#resumeBtn').onclick = resumeQuiz;
  $('#homeBtn').onclick = () => go('home');
}
function resumeQuiz() { paused = false; hideLayer(); }

function finishRun() {
  stopTimer();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  let e = 0, t = 0; const bySec = {};
  c.queue.forEach(i => { const a = c.answers[i], s = f[i].sec; bySec[s] = bySec[s] || {e:0, t:0}; if (a) { e += a.e; t += a.t; bySec[s].e += a.e; bySec[s].t += a.t; } });
  const pct = t ? Math.round(e / t * 100) : 0;
  const order = setOrder(), pos = orderPos(set.id), nextId = pos >= 0 && pos + 1 < order.length ? order[pos + 1] : null;
  const wasOpen = nextId !== null && isUnlocked(nextId);
  const rec = S.sets[set.id] = S.sets[set.id] || {attempts:[], best:null};
  rec.attempts.unshift({mode:c.mode, e, t, pct, time:c.elapsed, date:Date.now()});
  rec.attempts = rec.attempts.slice(0, 20);
  if (c.mode === 'full' && (!rec.best || pct > rec.best.pct || (pct === rec.best.pct && c.elapsed < rec.best.time))) rec.best = {e, t, pct, time:c.elapsed, date:Date.now()};
  if (c.mode === 'fix') S.stats.fix++;
  S.lastRun = {setId:set.id, mode:c.mode, e, t, pct, time:c.elapsed, bySec, answers:c.answers, queue:c.queue,
    newlyOpen: nextId !== null && !wasOpen && isUnlocked(nextId)};
  S.current = null;
  const earned = newBadges();
  S.lastRun.badges = earned.map(b => b.id);
  save();
  go('results');
}

/* ---------- Results ---------- */
function renderResults() {
  const r = S.lastRun; if (!r) return go('home');
  const set = getSet(r.setId), f = flat(set), stars = starsFor(r.pct);
  const order = setOrder(), pos = orderPos(set.id);
  const nextSet = pos + 1 < order.length ? getSet(order[pos + 1]) : null;
  const nextOpen = nextSet && isUnlocked(nextSet.id);
  const wrong = r.queue.filter(i => r.answers[i] && r.answers[i].t > 0 && r.answers[i].e < r.answers[i].t);
  const msg = r.mode === 'fix'
    ? (r.e === r.t ? 'You fixed every single mistake. Brilliant!' : `You fixed ${r.e} of ${r.t}. Keep going — you are getting better!`)
    : stars === 3 ? 'Outstanding work, explorer!' : stars === 2 ? 'Really good work!' : stars === 1 ? 'Good effort — keep practising!' : 'Every explorer starts somewhere. Try again!';
  const gotBadges = (r.badges || []).map(id => BADGES.find(b => b.id === id)).filter(Boolean);
  app.innerHTML = `
    <div class="result-head">
      ${globe(stars >= 2 ? 'happy' : '')}
      <h1 id="rT" class="sr">Results</h1>
      <div class="big-stars" aria-label="${stars} of 3 stars">${[0,1,2].map(i => `<span class="${i < stars ? 'star-on' : 'star-off'}">★</span>`).join('')}</div>
      <p class="score-big">${r.e} / ${r.t}</p>
      <p>${r.pct}% — ${esc(msg)}</p>
      <p>Time: ${fmtTime(r.time)}</p>
      ${r.newlyOpen && nextSet ? `<p><b>🔓 You have opened ${nextSet.emoji} ${esc(nextSet.title)}!</b></p>` : ''}
    </div>
    ${gotBadges.length ? `<div class="card" style="margin-bottom:1rem"><h2 style="font-size:1.2rem">🎉 New badges</h2><div class="badges">${gotBadges.map(b => `<div class="badge on"><span class="bi">${b.icon}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`).join('')}</div></div>` : ''}
    <div class="card">
      <h2 style="font-size:1.25rem">How each topic went</h2>
      <div class="bars">${Object.keys(SECTIONS).filter(k => r.bySec[k] && r.bySec[k].t).map(k => {
        const b = r.bySec[k], p = Math.round(b.e / b.t * 100);
        return `<div class="bar-row"><span>${SECTIONS[k].icon} ${SECTIONS[k].name}</span><span>${b.e}/${b.t}</span><span class="bar"><i style="width:${p}%"></i></span></div>`;
      }).join('')}</div>
      <p class="tip">This set covered: ${set.aligns.map(a => esc(a)).join(' · ')}</p>
      ${wrong.length ? `<div class="review"><details><summary>🔎 Look again at ${wrong.length} question${wrong.length === 1 ? '' : 's'}</summary><ol>${wrong.map(i => {
        const it = f[i].item;
        return `<li><b>${esc(questionLabel(it))}</b><br>Answer: ${esc(answerText(it))}${it.explain ? `<br><span style="color:var(--ink-soft)">💡 ${esc(it.explain)}</span>` : ''}</li>`;
      }).join('')}</ol></details></div>` : ''}
      <div class="stack" style="margin-top:1.2rem">
        ${wrong.length ? `<button class="btn btn-go btn-wide" id="fixBtn">🔁 Fix my mistakes (${wrong.length})</button>` : ''}
        ${nextSet ? (nextOpen
          ? `<button class="btn ${wrong.length ? 'btn-sun' : 'btn-go'} btn-wide" id="upBtn">⬆ Next set: ${nextSet.emoji} ${esc(nextSet.title)}</button>`
          : `<p class="tip" style="text-align:center">Score ${PASS}% or more on the whole set to open ${nextSet.emoji} ${esc(nextSet.title)}.</p>`)
          : `<p class="tip" style="text-align:center">You have reached the last set in your atlas! 🏁</p>`}
        <button class="btn btn-wide" id="againBtn">Try the whole set again</button>
        <button class="btn btn-wide" id="homeBtn2">🏠 Home</button>
      </div>
    </div>`;
  if (wrong.length) $('#fixBtn').onclick = () => startSet(set.id, 'fix', wrong);
  if (nextSet && nextOpen) $('#upBtn').onclick = () => tryStart(nextSet.id);
  $('#againBtn').onclick = () => startSet(set.id, 'full');
  $('#homeBtn2').onclick = () => go('home');
}

/* ---------- My results ---------- */
function renderHistory() {
  const order = setOrder();
  const any = order.some(id => S.sets[id] && S.sets[id].attempts.length);
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>🏆 My results</h1></div>
    <div class="hist">
      <section class="card">
        <h2 style="font-size:1.3rem">Badges (${S.badges.length} of ${BADGES.length})</h2>
        <div class="badges">${BADGES.map(b => {
          const on = S.badges.includes(b.id);
          return `<div class="badge ${on ? 'on' : 'off'}"><span class="bi">${b.icon}</span><b>${on ? esc(b.name) : 'Locked'}</b><small>${esc(b.desc)}</small></div>`;
        }).join('')}</div>
      </section>
      ${!any ? `<div class="card"><p style="margin:0;font-size:1.15rem">No results yet. Pick a set on the home page and start exploring!</p></div>` : ''}
      ${order.map((id, pos) => {
        const set = getSet(id), rec = S.sets[id];
        if (!rec || !rec.attempts.length) return '';
        return `<section class="card"><h2 style="font-size:1.3rem">${set.emoji} Set ${pos + 1}: ${esc(set.title)}</h2>
          <p style="margin:.3rem 0">${rec.best ? `Best score: <b>${rec.best.e} of ${rec.best.t}</b> (${rec.best.pct}%) ${starRow(starsFor(rec.best.pct))}` : 'Not finished as a whole set yet'}</p>
          <div class="knows">${set.aligns.map(a => `<span class="know">${esc(a)}</span>`).join('')}</div>
          <div class="scroll-x"><table><thead><tr><th>When</th><th>Type</th><th>Score</th><th>Time</th></tr></thead><tbody>
            ${rec.attempts.slice(0, 8).map(a => `<tr><td>${fmtDate(a.date)}</td><td>${a.mode === 'fix' ? 'Fix mistakes' : 'Whole set'}</td><td>${a.e}/${a.t} (${a.pct}%)</td><td>${fmtTime(a.time)}</td></tr>`).join('')}
          </tbody></table></div></section>`;
      }).join('')}
      ${S.gallery.length ? `<section class="card"><h2 style="font-size:1.3rem">📓 My Sketchbook</h2>
        <div class="gallery">${S.gallery.map(g => `<figure><img src="${g.img}" alt="A diagram drawn on ${fmtDate(g.date)}"><figcaption>${fmtDate(g.date)}</figcaption></figure>`).join('')}</div></section>` : ''}
    </div>`;
  $('#backBtn').onclick = () => go('home');
}

/* ---------- Settings ---------- */
function renderSettings() {
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${String(S.settings[key]) === String(v)}">${l}</button>`).join('')}</div>`;
  const order = setOrder();
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>⚙️ Settings</h1></div>
    <div class="card">
      <div class="setting"><div><b>Text size</b><small>Bigger text is easier on young eyes.</small></div>${seg('size', [['normal', 'Big'], ['big', 'Bigger']])}</div>
      <div class="setting"><div><b>Colours</b><small>Dark is gentle at night.</small></div>${seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}</div>
      <div class="setting"><div><b>Sounds</b><small>Little chimes for right and wrong answers.</small></div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
      <div class="setting"><div><b>Open all sets</b><small>Normally a set opens after ${PASS}% on the one before it.</small></div>${seg('unlockAll', [[false, 'No'], [true, 'Yes']])}</div>
      <div class="setting"><div><b>Backup progress</b><small>Saves a file with stars, badges and sketchbook drawings.</small></div><button class="btn btn-small" id="exportBtn">Save backup</button></div>
      <div class="setting"><div><b>Restore progress</b><small>Load a backup from another device or an earlier day.</small></div><button class="btn btn-small" id="importBtn">Load backup</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>
      <div class="setting"><div><b>Clear all progress</b><small>Removes scores, badges, sketchbook and any paused set.</small></div><button class="btn btn-small" id="resetBtn">Clear progress</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">This learner's set order</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Each new learner gets the sets in their own shuffled order, and that order then stays the same for ever, on every visit. Every set covers all six topics, so no order is harder than another. This device is using:</p>
      <p style="margin:.5rem 0 0;font-size:1.05rem">${order.map((id, i) => `<b>${i + 1}.</b> ${getSet(id).emoji} ${esc(getSet(id).title)}`).join(' &nbsp; ')}</p>
      <div class="setting" style="border:0"><div><b>Give a new order</b><small>Only for a different child sharing this device. It also clears their progress.</small></div><button class="btn btn-small" id="reshuffleBtn">Shuffle again</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">What this covers</h2>
      <p style="margin:.5rem 0 .5rem;font-size:1.05rem">Year 3 to Year 4 social studies: climate zones, the compass and directions, reading maps and relief maps, landforms, natural resources and how to look after them, and how people travel and live together.</p>
      <div class="knows">${[...new Set(SETS.flatMap(s => s.aligns))].map(a => `<span class="know">${esc(a)}</span>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">How scoring works</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Each question counts the first answer. Sorting, matching, ordering, gap-filling, compass roses, tick-and-cross tables and true-or-false lists all give one star per part, so a nearly-right answer still earns most of the stars. Drawings are saved in My Sketchbook rather than marked. "Fix my mistakes" repeats only what was missed; the best score always comes from a whole-set try.</p>
      <div id="iosNote"></div>
    </div>`;
  $('#backBtn').onclick = () => go('home');
  $$('.seg button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; let v = b.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S.settings[k] = v; save(); applySettings(); renderSettings();
    const again = $(`.seg button[data-k="${k}"][data-v="${b.dataset.v}"]`); if (again) again.focus();
  });
  $('#reshuffleBtn').onclick = () => confirmBox({
    title:'Give a new set order?',
    text:'This is for a different child using the same device. It picks a fresh order and clears the stars, badges and sketchbook on this device.',
    yes:'Yes, new learner', no:'Cancel',
    onYes(){ const keep = S.settings; S = fresh(); S.settings = keep; S.seed = (Math.random() * 4294967296) >>> 0; setOrder(); save(); go('home'); }
  });
  const installed = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const onIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const note = $('#iosNote');
  if (note) {
    if (onIOS && !installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:.7rem .9rem">' +
        '<b>Worth doing:</b> add this page to the Home Screen (Share → Add to Home Screen) and open it from that icon. ' +
        'Safari erases saved progress after about a week of not visiting. Home Screen apps keep theirs.</p>';
    } else if (installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;color:var(--ink-soft)">Running from the Home Screen — progress is kept safely.</p>';
    }
  }
  $('#exportBtn').onclick = () => {
    try {
      const stamp = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'world-explorers-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      confirmBox({title:'Could not save', text:'This browser would not let the file be saved.', yes:'OK', no:null, onYes(){}});
    }
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(String(r.result)); } catch (e) {}
      if (!d || typeof d !== 'object' || typeof d.sets !== 'object' || d.sets === null) {
        confirmBox({title:'That file did not fit', text:'It is not a World Explorers backup. Look for a file named world-explorers-....json', yes:'OK', no:null, onYes(){}});
        return;
      }
      const done = Object.keys(d.sets).length, pics = Array.isArray(d.gallery) ? d.gallery.length : 0;
      const bits = [done + ' set' + (done === 1 ? '' : 's') + ' started', pics + ' drawing' + (pics === 1 ? '' : 's')];
      if (d.current) bits.push('a paused set');
      confirmBox({
        title:'Load this backup?',
        text:'It has ' + bits.join(', ') + '. This replaces what is on this device now.',
        yes:'Yes, load it', no:'Cancel',
        onYes(){
          S = Object.assign(fresh(), d);
          S.settings = Object.assign(fresh().settings, d.settings || {});
          S.stats = Object.assign(freshStats(), d.stats || {});
          if (S.seed === null || S.seed === undefined) S.seed = (Math.random() * 4294967296) >>> 0;
          setOrder(); save(); applySettings(); go('home');
        }
      });
    };
    r.readAsText(f);
  };
  $('#resetBtn').onclick = () => confirmBox({
    title:'Clear all progress?',
    text:'Scores, badges, sketchbook and paused sets will be removed. The set order and the settings stay the same.',
    yes:'Yes, clear everything', no:'Cancel',
    onYes(){ const keep = S.settings, seed = S.seed, order = S.order; S = fresh(); S.settings = keep; S.seed = seed; S.order = order; save(); go('home'); }
  });
}

/* ---------- Global events ---------- */
document.addEventListener('keydown', e => {
  if (layer.innerHTML) { if (e.key === 'Escape') { if (paused) resumeQuiz(); else hideLayer(); } return; }
  if (screen !== 'quiz' || !Q) return;
  const tag = e.target.tagName;
  if (e.key === 'Enter' && (tag === 'INPUT' || e.target === document.body)) {
    e.preventDefault();
    if (Q.checked) next(); else doCheck();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) return; if (screen === 'quiz') pause(); else save(); });
window.addEventListener('resize', syncDockSpace);
window.addEventListener('pagehide', save);

load(); applySettings(); save(); go('home');

/* ---------- Offline support ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
