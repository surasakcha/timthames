<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventors Lab</title>
<meta name="description" content="Pronouns, job words, word families, to + verb grammar, reading, shapes and eye tricks for Year 3 and Year 4.">
<meta name="theme-color" content="#2B5CA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learning">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-64.png" sizes="64x64">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EDF6; --paper:#FBFCFE; --paper-2:#EDF2F9; --ink:#182636; --ink-soft:#4D5F74; --line:#BFCEE0;
  --leaf:#2B5CA8; --leaf-deep:#1B3F77; --leaf-soft:#D6E4F6; --on-leaf:#FFFFFF;
  --sun:#D9841C; --sun-soft:#FBE6C7; --sun-deep:#A56209;
  --sky:#2F76A8; --sky-soft:#D8E9F4;
  --berry:#B23F4B; --berry-soft:#F6DCDE;
  --bark:#8494A8;
  --bot:#5C7FC4; --bot-dark:#2B4C86; --bolt:#E9B949;
  --overlay:rgba(16,28,44,.58);
  --read:'Andika','Trebuchet MS',Verdana,system-ui,sans-serif;
  --round:'Fredoka','Andika','Trebuchet MS',system-ui,sans-serif;
  font-size:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131C28; --paper:#1C2836; --paper-2:#233244; --ink:#E5ECF5; --ink-soft:#A5B6CA; --line:#36485E;
    --leaf:#6FA8E8; --leaf-deep:#3F7CC0; --leaf-soft:#22374F; --on-leaf:#0D1A28;
    --sun:#EDBB55; --sun-soft:#463619; --sun-deep:#B98A2C;
    --sky:#72B6E2; --sky-soft:#1E3A4B;
    --berry:#EC8490; --berry-soft:#4C2A30;
    --bark:#6A7C92; --bot:#7098DA; --bot-dark:#3C6099; --bolt:#F2CD6B;
    --overlay:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131C28; --paper:#1C2836; --paper-2:#233244; --ink:#E5ECF5; --ink-soft:#A5B6CA; --line:#36485E;
  --leaf:#6FA8E8; --leaf-deep:#3F7CC0; --leaf-soft:#22374F; --on-leaf:#0D1A28;
  --sun:#EDBB55; --sun-soft:#463619; --sun-deep:#B98A2C;
  --sky:#72B6E2; --sky-soft:#1E3A4B;
  --berry:#EC8490; --berry-soft:#4C2A30;
  --bark:#6A7C92; --bot:#7098DA; --bot-dark:#3C6099; --bolt:#F2CD6B;
  --overlay:rgba(0,0,0,.62);
  color-scheme:dark;
}
:root[data-size="big"]{font-size:23px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--read);line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--round);line-height:1.15;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:1rem 1rem 2rem}
.hidden{display:none!important}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.1rem;padding:.4rem 1.4rem;border-radius:999px;border:3px solid var(--line);background:var(--paper);font-family:var(--round);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;text-decoration:none;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf);box-shadow:0 5px 0 var(--leaf-deep)}
.btn-go:active:not(:disabled){box-shadow:0 2px 0 var(--leaf-deep)}
.btn-sun{background:var(--sun-soft);border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.btn-wide{width:100%}
.btn-icon{width:3.1rem;padding:0;flex:none;font-size:1.3rem}
.btn-small{min-height:2.5rem;font-size:.9rem;padding:.2rem 1rem;box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:.75rem}

/* Sparky the lab robot */
.bot-bench{stroke:var(--bark);stroke-width:7;stroke-linecap:round;fill:none}
.bot-body,.bot-head{fill:var(--bot);stroke:var(--bot-dark);stroke-width:3}
.bot-panel{fill:var(--bot-dark);opacity:.35}
.bot-eye{fill:var(--paper);stroke:var(--bot-dark);stroke-width:3}
.bot-pupil{fill:#16232F}
.bot-mouth{fill:none;stroke:var(--bot-dark);stroke-width:3;stroke-linecap:round}
.bot-arm{fill:none;stroke:var(--bot-dark);stroke-width:6;stroke-linecap:round}
.bot-wire{fill:none;stroke:var(--bot-dark);stroke-width:4;stroke-linecap:round}
.bot-bulb{fill:var(--bolt);stroke:var(--sun-deep);stroke-width:2.5}
.bot{transition:filter .4s}
.bot.happy{animation:hop .6s ease}
.bot.happy .bot-bulb{animation:glow .6s ease}
.bot.sleepy .bot-pupil{display:none}
.bot.sleepy .bot-bulb{fill:var(--line)}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-4deg)}65%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:1rem;padding:1.25rem 0 .5rem}
.hero h1{font-size:2.6rem;font-weight:700;letter-spacing:-.5px}
.hero p{margin:.4rem 0 0;color:var(--ink-soft);font-size:1.1rem;max-width:30ch}
.hero .bot{width:clamp(130px,30vw,210px);height:auto;display:block}
.notice{background:var(--sun-soft);border:3px solid var(--sun);border-radius:20px;padding:.9rem 1.1rem;margin:1rem 0}
.resume{background:var(--sky-soft);border:3px solid var(--sky);border-radius:24px;padding:1.1rem 1.2rem;margin:1rem 0;display:grid;gap:.75rem}
.resume h2{font-size:1.35rem}
.resume p{margin:0;color:var(--ink-soft)}
.sets{display:grid;gap:1rem;margin-top:1.25rem}
.sets h2.label{font-size:1.4rem}
.setcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1rem;align-items:center;text-align:left;width:100%;padding:1rem 1.1rem;border-radius:26px;border:3px solid var(--line);background:var(--paper);cursor:pointer;box-shadow:0 5px 0 var(--line)}
.setcard:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.setcard .emoji{font-size:2.4rem;width:3.6rem;height:3.6rem;display:grid;place-items:center;border-radius:18px;background:var(--paper-2)}
.setcard .sc-title{font-family:var(--round);font-weight:600;font-size:1.3rem;line-height:1.2}
.setcard .meta{color:var(--ink-soft);font-size:.95rem}
.setcard .go{font-family:var(--round);font-weight:600;color:var(--leaf);font-size:1rem;white-space:nowrap}
.stars{display:inline-flex;gap:2px;font-size:1.1rem;letter-spacing:1px}
.star-on{color:var(--sun)}
.star-off{color:var(--line)}
.homefoot{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.result-head .bot{width:160px;height:auto;display:block;margin:0 auto .5rem}

/* Quiz top */
.topbar{display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:20;background:var(--bg);padding:.6rem 0 .4rem}
.topbar .where{flex:1;min-width:0}
.topbar .where b{font-family:var(--round);font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .where span{color:var(--ink-soft);font-size:.9rem}
.pill{font-family:var(--round);font-weight:600;background:var(--sun-soft);border:3px solid var(--sun);border-radius:999px;padding:.25rem .85rem;white-space:nowrap}
.pill.fire{background:var(--berry-soft);border-color:var(--berry);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.track-wrap{position:relative;height:3.4rem;margin:.2rem 0 .6rem}
.track-wrap .track{position:absolute;left:0;right:0;bottom:.55rem;height:12px;border-radius:99px;background:var(--bark);opacity:.35}
.track-wrap .fill{position:absolute;left:0;bottom:.55rem;height:12px;border-radius:99px;background:var(--leaf);transition:width .5s ease}
.track-wrap .walker{position:absolute;bottom:.3rem;width:4.4rem;transform:translateX(-50%);transition:left .5s ease}
.track-wrap .walker .bot-bench{display:none}
.track-wrap .goal{position:absolute;right:-.2rem;bottom:.6rem;font-size:1.4rem}

/* Question card */
.card{background:var(--paper);border:3px solid var(--line);border-radius:30px;padding:1.2rem 1.2rem 1.5rem;box-shadow:0 6px 0 var(--line)}
.sec-tag{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--round);font-weight:600;font-size:.95rem;padding:.2rem .8rem;border-radius:999px;background:var(--paper-2);border:2px solid var(--line);color:var(--ink-soft)}
.prompt{display:flex;gap:.75rem;align-items:flex-start;margin:.9rem 0 1rem}
.prompt h2{font-size:1.35rem;font-weight:600;flex:1}
.speak{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;border:3px solid var(--sky);background:var(--sky-soft);cursor:pointer;font-size:1.15rem;display:grid;place-items:center}
.qtext{font-size:1.5rem;line-height:1.6;margin:0 0 1.1rem}
.blank{display:inline-block;min-width:4.6em;border-bottom:4px dashed var(--sky);text-align:center;color:var(--sky);font-weight:700;padding:0 .2em}
.blank.filled{border-bottom-style:solid}

/* Passage */
details.story{background:var(--paper-2);border:3px solid var(--line);border-radius:22px;margin:.3rem 0 1rem;overflow:hidden}
details.story summary{cursor:pointer;list-style:none;padding:.8rem 1rem;font-family:var(--round);font-weight:600;font-size:1.05rem;display:flex;gap:.6rem;align-items:center}
details.story summary::-webkit-details-marker{display:none}
details.story summary::after{content:'Show';margin-left:auto;font-size:.9rem;color:var(--sky)}
details.story[open] summary::after{content:'Hide'}
.story-body{padding:0 1.1rem 1rem;font-size:1.2rem;line-height:1.75;max-width:60ch}
.story-body p{margin:0 0 .7rem}

/* Choice */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.8rem}
.opts.pics{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.long{grid-template-columns:1fr}
.opt{min-height:4rem;border-radius:20px;border:3px solid var(--line);background:var(--paper-2);font-size:1.35rem;font-weight:700;cursor:pointer;padding:.5rem 1rem;box-shadow:0 4px 0 var(--line);text-align:center;display:flex;align-items:center;justify-content:center;gap:.5rem;flex-direction:column}
.opts.long .opt{font-size:1.2rem;text-align:left;align-items:flex-start;font-weight:400}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 4px 0 var(--sky)}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 4px 0 var(--leaf)}
.opt.no{border-color:var(--berry);background:var(--berry-soft);box-shadow:0 4px 0 var(--berry)}
.opt small{font-size:.85rem;font-weight:400;color:var(--ink-soft)}

/* Shapes (2D faces, 3D edges) */
.shape{width:4.6rem;height:4.6rem}
.shape .face{fill:var(--sky-soft);stroke:var(--sky);stroke-width:5;stroke-linejoin:round}
.shape .edge{fill:none;stroke:var(--sky);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.shape .hid{fill:none;stroke:var(--sky);stroke-width:4;stroke-dasharray:7 7;opacity:.5}
.opt.ok .shape .face{fill:var(--leaf-soft);stroke:var(--leaf)}
.opt.ok .shape .edge,.opt.ok .shape .hid{stroke:var(--leaf)}
.opt.no .shape .face{fill:var(--berry-soft);stroke:var(--berry)}
.opt.no .shape .edge,.opt.no .shape .hid{stroke:var(--berry)}

/* Chips, bins, blanks */
.bank{display:flex;flex-wrap:wrap;gap:.65rem;justify-content:center;min-height:4rem;padding:.8rem;border-radius:22px;background:var(--paper-2);border:3px dashed var(--line);margin-bottom:1rem}
.bank-label{width:100%;text-align:center;color:var(--ink-soft);font-size:.9rem}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:3.2rem;min-width:3.2rem;padding:.2rem 1.05rem;border-radius:16px;background:var(--sun-soft);border:3px solid var(--sun);font-size:1.3rem;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 var(--sun)}
.chip.sel{background:var(--sky-soft);border-color:var(--sky);box-shadow:0 0 0 4px var(--sky)}
.chip.dragging{opacity:.3}
.chip.ok{background:var(--leaf-soft);border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf)}
.chip.no{background:var(--berry-soft);border-color:var(--berry);box-shadow:0 4px 0 var(--berry)}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;transform:translate(-50%,-60%) scale(1.1);opacity:.95}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.9rem}
.bin{min-height:9rem;border:3px dashed var(--line);border-radius:22px;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;cursor:pointer}
.bin h3{font-size:1.1rem;text-align:center}
.bin .hint{font-size:.85rem;color:var(--ink-soft);text-align:center;margin-top:-.4rem}
.bin .inside{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.over{border-color:var(--sky)!important;background:var(--sky-soft)!important}
.poemtext{font-size:1.3rem;line-height:1.5;margin:0}
.poemtext .line{display:block;margin:0 0 .9rem}
.nowrap{white-space:nowrap}
.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:5.5rem;min-height:3.2rem;margin:0 .15rem;border-bottom:4px dashed var(--sky);border-radius:12px 12px 4px 4px;background:var(--sky-soft);cursor:pointer;line-height:1.2}
.slot .chip{box-shadow:none}

/* Build */
.buildline{min-height:4.4rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem;border-bottom:4px solid var(--sky);margin-bottom:1rem}
.buildline:empty::before{content:'Tap the words below';color:var(--ink-soft);font-size:1.05rem}
.chip.used{visibility:hidden}

/* Order (drag to sequence) */
.orderlist{display:grid;gap:.6rem;margin-bottom:.8rem}
.ord{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.6rem .8rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);font-size:1.08rem;line-height:1.35;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;text-align:left}
.ord .num{font-family:var(--round);font-weight:700;width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;background:var(--sun-soft);border:2px solid var(--sun);flex:none;font-size:.95rem}
.ord .grip{color:var(--ink-soft);font-size:1.3rem;letter-spacing:-2px}
.ord.dragging{opacity:.35}
.ord.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.ord.no{border-color:var(--berry);background:var(--berry-soft)}
.ord-move{display:flex;flex-direction:column;gap:.2rem}
.ord-move button{width:2.1rem;height:1.6rem;border-radius:8px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:.8rem;line-height:1;padding:0}
.ord-move button:disabled{opacity:.3;cursor:default}

/* Match lines */
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:clamp(2.6rem,11vw,6rem)}
.match-col{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-content:stretch;position:relative;z-index:2}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.m-item{position:relative;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:.5rem;min-height:4rem;padding:.45rem .8rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;font-size:1.1rem;line-height:1.3}
.m-item.left{font-weight:700;font-size:1.2rem}
.m-item.right{padding-left:1.15rem}
.m-item .shape{width:2.4rem;height:2.4rem;flex:none}
.m-item .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--paper);border:4px solid var(--ink-soft);transform:translateY(-50%)}
.m-item.left .dot{right:-11px}
.m-item.right .dot{left:-11px}
.m-item.sel{border-color:var(--sky);background:var(--sky-soft)}
.m-item.linked .dot{background:var(--sky);border-color:var(--sky)}
.m-item.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.m-item.no{border-color:var(--berry);background:var(--berry-soft)}
.m-item.ok .dot{background:var(--leaf);border-color:var(--leaf)}
.m-item.no .dot{background:var(--berry);border-color:var(--berry)}
.lines path{fill:none;stroke-width:5;stroke-linecap:round}

/* Spell */
.boxes{display:grid;gap:.35rem;justify-content:center;margin:.5rem 0 1.2rem}
.box{width:100%;aspect-ratio:.8;padding:0;border-radius:12px;border:3px solid var(--line);background:var(--paper-2);display:grid;place-items:center;font-size:1.7em;font-weight:700;cursor:pointer;color:var(--ink)}
.box.next{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft)}
.box.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.box.no{border-color:var(--berry);background:var(--berry-soft)}
.box.gap{border:0;background:transparent;box-shadow:none;cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center}
.tile{width:3.2rem;height:3.2rem;border-radius:14px;border:3px solid var(--sun);background:var(--sun-soft);font-size:1.6rem;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--sun)}
.tile:disabled{opacity:.25;cursor:default;box-shadow:none}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sun)}
.clue{font-size:1.4rem;line-height:1.6;background:var(--paper-2);border-radius:20px;padding:.9rem 1.1rem;margin:0 0 1rem;border-left:8px solid var(--sun)}

/* Write / type */
.write{width:100%;font-family:var(--read);font-size:1.4rem;padding:.8rem 1rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);color:var(--ink);line-height:1.5;resize:vertical}
.write:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-soft)}
textarea.write{min-height:9rem}
.tip{color:var(--ink-soft);font-size:1rem;margin:.6rem 0 0}
.wordcount{color:var(--ink-soft);font-size:.95rem;text-align:right;margin-top:.3rem}
.typeline{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.typeline .write{flex:1;min-width:10rem}
.hintbtn{flex:none}
.hintbox{margin:.7rem 0 0;background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:.6rem .9rem;font-size:1.05rem}

/* Figures (eye tricks) */
.figure{background:var(--paper-2);border:3px solid var(--line);border-radius:22px;padding:1rem;margin:0 0 1rem;text-align:center}
.figure svg{width:100%;max-width:26rem;height:auto}
.figure .proof{opacity:0;transition:opacity .45s ease}
.figure.measured .proof{opacity:1}
.figure .hatch{transition:opacity .45s ease}
.figure.measured .hatch{opacity:.12}
.fig-bg{fill:var(--paper)}
.fig-ink{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fig-grey{fill:var(--bark);opacity:.55}
.fig-orange{fill:#E07A2F}
.fig-blue{fill:#3E7BC4}
.fig-rule{fill:none;stroke:var(--berry);stroke-width:3;stroke-dasharray:8 6}
.fig-label{fill:var(--ink-soft);font-family:var(--round);font-size:13px}
.fig-dark{fill:#22303F}
.fig-light{fill:#F2F4F7}
.fig-same{fill:#9AA4AF}

/* Drawing pad */
.padwrap{display:grid;gap:.7rem}
.pad{width:100%;aspect-ratio:3/2;border-radius:20px;border:3px solid var(--line);background:#FFFFFF;touch-action:none;cursor:crosshair;display:block}
.padtools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:center}
.swatch{width:2.5rem;height:2.5rem;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--sky);border-color:var(--paper)}
.padnote{color:var(--ink-soft);font-size:.95rem;text-align:center;margin:0}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.7rem;margin-top:.7rem}
.badge{display:grid;gap:.15rem;justify-items:center;text-align:center;padding:.7rem .5rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2)}
.badge.on{border-color:var(--sun);background:var(--sun-soft)}
.badge .bi{font-size:1.9rem;line-height:1}
.badge.off .bi{filter:grayscale(1);opacity:.35}
.badge b{font-family:var(--round);font-size:.95rem;font-weight:600}
.badge small{color:var(--ink-soft);font-size:.8rem;line-height:1.25}
.badge-pop{display:flex;gap:.6rem;align-items:center;background:var(--sun-soft);border:3px solid var(--sun);border-radius:18px;padding:.5rem .8rem;margin:.6rem 0 0}
.badge-pop .bi{font-size:1.8rem}

/* Bottom sheet */
.dock-space{height:9rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:3px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom))}
.dock .inner{max-width:820px;margin:0 auto}
.dock.good{background:var(--leaf-soft);border-color:var(--leaf)}
.dock.bad{background:var(--berry-soft);border-color:var(--berry)}
.dock.part{background:var(--sun-soft);border-color:var(--sun)}
.fb{max-height:48vh;overflow:auto;margin-bottom:.8rem}
.fb h3{font-size:1.5rem;display:flex;gap:.5rem;align-items:center}
.fb .gain{font-family:var(--round);font-size:1rem;font-weight:600;margin-left:auto;white-space:nowrap}
.fb p{margin:.45rem 0 0;font-size:1.15rem;line-height:1.55}
.fb .ans{font-weight:700}
.fb .why{background:var(--paper);border-radius:14px;padding:.5rem .8rem;margin-top:.6rem!important}

/* Overlay & modal */
.overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:grid;place-items:center;padding:1rem}
.modal{background:var(--paper);border-radius:30px;border:3px solid var(--line);padding:1.5rem;max-width:30rem;width:100%;text-align:center;display:grid;gap:1rem;max-height:92vh;overflow:auto}
.modal h2{font-size:1.7rem}
.modal p{margin:0;font-size:1.15rem;color:var(--ink-soft)}
.modal .bot{width:170px;margin:0 auto;display:block}

/* Results */
.result-head{text-align:center;padding:1rem 0}
.big-stars{font-size:3.4rem;letter-spacing:.3rem;line-height:1}
.big-stars span{display:inline-block}
.big-stars .star-on{animation:pop .5s both}
.big-stars span:nth-child(2){animation-delay:.2s}
.big-stars span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.result-head .score-big{font-family:var(--round);font-size:2.6rem;font-weight:700;margin:.4rem 0 0}
.result-head p{margin:.3rem 0;font-size:1.2rem;color:var(--ink-soft)}
.bars{display:grid;gap:.9rem;margin:1rem 0}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;align-items:center;font-size:1.05rem}
.bar{grid-column:1/-1;height:16px;border-radius:99px;background:var(--paper-2);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.review{margin-top:1rem}
.review details{border:3px solid var(--line);border-radius:20px;background:var(--paper-2);padding:.4rem 1rem}
.review summary{cursor:pointer;font-family:var(--round);font-weight:600;padding:.4rem 0}
.review li{margin:.6rem 0;font-size:1.05rem}
.review ol{padding-left:1.3rem}

/* History & settings */
.page-head{display:flex;align-items:center;gap:.75rem;padding:.8rem 0}
.page-head h1{font-size:1.9rem;flex:1}
.hist{display:grid;gap:1rem}
.hist .card{padding:1rem 1.1rem}
.hist table{width:100%;border-collapse:collapse;font-size:1rem;margin-top:.5rem}
.hist td,.hist th{text-align:left;padding:.35rem .3rem;border-bottom:2px solid var(--paper-2)}
.hist th{color:var(--ink-soft);font-weight:400;font-size:.9rem}
.scroll-x{overflow-x:auto}
.work-card{white-space:pre-wrap;font-size:1.15rem;line-height:1.7;background:var(--paper-2);border-radius:18px;padding:.8rem 1rem;margin:.6rem 0 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.8rem;margin-top:.6rem}
.gallery figure{margin:0}
.gallery img{width:100%;border-radius:16px;border:3px solid var(--line);background:#fff;display:block}
.gallery figcaption{color:var(--ink-soft);font-size:.85rem;margin-top:.25rem;text-align:center}
.setting{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:2px solid var(--paper-2);flex-wrap:wrap}
.setting b{font-family:var(--round);font-weight:600;font-size:1.1rem}
.setting small{display:block;color:var(--ink-soft);font-size:.9rem}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.45rem .95rem;cursor:pointer;font-family:var(--round);font-weight:600;min-height:2.6rem}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf)}

@media (max-width:520px){
  :root{font-size:18px}
  :root[data-size="big"]{font-size:21px}
  .hero h1{font-size:2.1rem}
  .card{padding:1rem .85rem 1.2rem;border-radius:24px}
  .setcard{grid-template-columns:auto minmax(0,1fr)}
  .setcard .go{grid-column:1/-1;text-align:right}
  .m-item{font-size:.98rem;padding:.4rem .55rem}
  .m-item.left{font-size:1.02rem;flex-direction:column;justify-content:center;gap:.2rem;text-align:center}
  .match{column-gap:2.4rem}
  .qtext{font-size:1.35rem}
  .ord{font-size:.98rem;padding:.5rem .6rem;gap:.5rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>
<div id="dock" class="dock hidden"><div class="inner" id="dockInner"></div></div>
<div id="layer"></div>
<script>
/* ==========================================================================
   CONTENT — 6 sets for Year 3 / Year 4, built from the SG NEXT review sheets:
   subject & object pronouns, job-title vocabulary, word families,
   "to + verb" grammar, reading comprehension, 2D/3D shapes, and the
   optical-illusion "look carefully and explain" work.
   ========================================================================== */
const SUBJ = 'Subject pronouns do the action: I, you, he, she, it, we, they.';
const OBJ  = 'Object pronouns receive the action: me, you, him, her, it, us, them.';
const TOV  = 'After want, hope, plan, try, need, learn and decide we use "to" plus the plain verb: wanted to go, hoped to win.';
const EROR = 'Many job words are the verb plus -er or -or: invent → inventor, build → builder, teach → teacher.';

const SETS = [
/* ---------------------------- SET 1 ---------------------------- */
{
  id:1, title:'Sky Riders', emoji:'✈️', about:'Ibn Firnas and the Wright brothers',
  story:{title:'The Dream of Flying', text:[
    "For thousands of years people watched birds in the sky and wished they could fly too. More than a thousand years ago, in Spain, a clever man named Abbas Ibn Firnas decided to try.",
    "Ibn Firnas built a suit with wings. He used feathers and light wood. One day he climbed a hill, jumped, and glided through the air for a short time before he landed. He was one of the first people in history to try human flight.",
    "Hundreds of years later, in America, two brothers kept the same dream alive. Orville and Wilbur Wright owned a bicycle shop. They watched birds, read everything they could find, and tested kites and wings again and again.",
    "Many of their tries did not work. A wing would snap, or the machine would tip over in the wind. The brothers did not stop. They wrote down what went wrong and built a better wing the next time.",
    "In 1903 their aeroplane finally left the ground. The first flight lasted only twelve seconds, but it changed the world for ever. Ibn Firnas and the Wright brothers were not lucky. They were curious, patient and brave."
  ]},
  sections:[
    {key:'pronouns', items:[
      {t:'choice', prompt:'Pick the right pronoun.', text:'___ built a pair of wings out of feathers and wood.', opts:['He','Him'], ans:0,
        explain:'"He" is the one doing the building, so we need a subject pronoun. A sentence never starts with "him". ' + SUBJ},
      {t:'choice', prompt:'Pick the right pronoun.', text:'A big crowd watched ___ jump from the hill.', opts:['he','him'], ans:1,
        explain:'The crowd does the watching. Ibn Firnas receives the watching, so after the verb we use "him". ' + OBJ},
      {t:'sort', prompt:'Drag each pronoun into the right box.', bins:[['Doer','does the action'],['Getter','receives the action']],
        chips:[['I',0],['them',1],['she',0],['us',1],['they',0],['him',1]],
        explain:'I, she and they can start a sentence and do the action. Them, us and him come after a verb and receive the action.'},
      {t:'build', prompt:'Tap the words to build the sentence.', words:['Wilbur','handed','me','the map.'],
        explain:'Wilbur is the doer, so he comes first. "Me" receives the map, so the object pronoun goes after the verb "handed".'}
    ]},
    {key:'jobs', items:[
      {t:'match', prompt:'Draw a line from each job to what that person does.',
        left:[{label:'inventor'},{label:'pilot'},{label:'engineer'},{label:'scientist'},{label:'architect'}],
        right:['creates brand new things','flies an aeroplane','designs and makes machines','studies nature and does experiments','designs houses and buildings'],
        explain:'Hunt for the clue word inside the job: invent → inventor, machine → engineer, building → architect.'},
      {t:'type', prompt:'Type the job word.', text:'A person who teaches children at school is a ______.',
        accept:['teacher'], hint:'It is the verb "teach" with -er on the end.',
        explain:'teach + er = teacher. ' + EROR},
      {t:'choice', prompt:'Which job word fits best?', long:true,
        text:'Ibn Firnas made a flying suit that nobody had ever made before. He was an ______.',
        opts:['inventor','athlete','farmer'], ans:0,
        explain:'An inventor makes something new that did not exist before. That is exactly what Ibn Firnas did with his wings.'}
    ]},
    {key:'wordfam', items:[
      {t:'type', prompt:'Complete the word family.', text:'to invent → the PERSON who does it is an ______.',
        accept:['inventor'], hint:'Take off the "to" and add -or.',
        explain:'invent + or = inventor. ' + EROR},
      {t:'spell', prompt:'Spell the missing word.', clue:'to invent → the THING that gets made is an ...', ans:'invention',
        explain:'invent + ion = invention. Lots of verbs make a "thing" word with -ion: act → action, collect → collection.'},
      {t:'type', prompt:'Complete the word family.', text:'to build → the PERSON who does it is a ______.',
        accept:['builder'], hint:'Take off the "to" and add -er.',
        explain:'build + er = builder. The thing they make is a building.'}
    ]},
    {key:'grammar', items:[
      {t:'type', prompt:'Write "to" and the correct verb.', text:'Ibn Firnas wanted ______ (fly) like a bird.',
        accept:['to fly'], hint:'Two words. The first one is "to".',
        explain:'After "wanted" we use to + the plain verb: wanted to fly. ' + TOV},
      {t:'choice', prompt:'Pick the right form.', long:true, text:'The Wright brothers hoped ___ a machine with an engine.',
        opts:['to build','building','builds'], ans:0,
        explain:'"Hoped" is followed by to + verb, so it is "hoped to build". ' + TOV},
      {t:'fill', prompt:'Drag the right "to + verb" into each gap.',
        lines:['Wilbur wanted {to test} the new wings.','Orville tried {to fix} the broken engine.','They decided {to work} together every single day.'],
        decoys:['to sleep','to shout'],
        explain:'You test wings, you fix an engine and you work together. The word after "to" must make sense in the sentence.'},
      {t:'build', prompt:'Tap the words to build the sentence.', words:['My sister','plans','to become','an engineer.'],
        explain:'"Plans" is one of the verbs that takes to + verb: plans to become. ' + TOV}
    ]},
    {key:'reading', items:[
      {t:'choice', prompt:'Read the story, then answer.', text:'Where did Abbas Ibn Firnas live?', long:true,
        opts:['In Spain','In America','In Japan'], ans:0,
        explain:'The first paragraph says it happened "in Spain", more than a thousand years ago.'},
      {t:'choice', prompt:'True or false?', text:'The Wright brothers had a bicycle shop before they built aeroplanes.',
        opts:['True','False'], ans:0,
        explain:'True. The story says Orville and Wilbur owned a bicycle shop. Mending bicycles taught them a lot about light, strong machines.'},
      {t:'write', prompt:'Write your answer in a sentence.', text:'What did Ibn Firnas use to make his wings?',
        keys:[['feather','feathers'],['wood','timber']],
        model:'He made his wings out of feathers and light wood.',
        explain:'The story names two materials: feathers and light wood. A full answer mentions both.'},
      {t:'write', prompt:'Write your answer in a sentence.', text:'What did the Wright brothers do when one of their tries did not work?',
        keys:[['wrote','write','wrote down','note','learn','looked','worked out','what went wrong'],['again','better','built','build','tried','try','next time','kept']],
        model:'They wrote down what went wrong and built a better wing the next time.',
        explain:'They did not give up. They studied the mistake, then built a better wing. That is how inventors work.'},
      {t:'order', prompt:'Put the events in the order they happened.',
        items:['Ibn Firnas glides from a hill in Spain','Orville and Wilbur open a bicycle shop','The brothers test kites and wings','The first aeroplane flies in 1903'],
        explain:'Ibn Firnas came first, over a thousand years ago. Then the brothers had their shop, then they tested, and 1903 was last.'}
    ]},
    {key:'shapes', items:[
      {t:'match', prompt:'Draw a line from each shape to its description.',
        left:[{shape:'circle',label:'circle'},{shape:'square',label:'square'},{shape:'triangle',label:'triangle'},{shape:'rectangle',label:'rectangle'},{shape:'pentagon',label:'pentagon'},{shape:'hexagon',label:'hexagon'}],
        right:['round, with no straight sides and no corners','4 equal sides and 4 right angles','3 straight sides and 3 corners','4 sides, with opposite sides equal','5 straight sides','6 straight sides'],
        explain:'Count the sides. "Tri" means 3, "penta" means 5, "hexa" means 6. A circle has no sides at all.'},
      {t:'choice', prompt:'Tap the octagon.',
        opts:[{shape:'hexagon',label:'hexagon'},{shape:'octagon',label:'octagon'},{shape:'pentagon',label:'pentagon'},{shape:'rhombus',label:'rhombus'}], ans:1,
        explain:'An octagon has 8 straight sides. An octopus has 8 arms — "oct" always means eight.'},
      {t:'spell', prompt:'Spell the shape.', clue:'I have 4 equal sides, but my corners are NOT right angles. People often call me a diamond.', ans:'rhombus',
        explain:'A rhombus is a pushed-over square: the sides stay equal but the corners lean.'}
    ]},
    {key:'think', items:[
      {t:'choice', prompt:'Look carefully, then answer.', fig:'ebbinghaus', long:true,
        text:'Look at the two orange circles. What is true?',
        opts:['They are exactly the same size','The left orange circle is bigger','The right orange circle is bigger'], ans:0,
        explain:'They are identical. Tap "Measure it" to see the matching guide lines. Your brain judges each orange circle against its neighbours, so the one beside small circles looks bigger.'},
      {t:'write', prompt:'Explain your thinking.', text:'Why do you think our eyes get tricked by that picture?',
        keys:[['brain','eye','eyes','mind'],['around','next to','beside','compare','compares','near','neighbour','other circles','bigger','smaller']],
        model:'Our brain compares each orange circle with the circles around it, so the one with small circles beside it looks bigger.',
        explain:'Your eyes send the picture, but your brain decides what it means. Brains judge size by comparing, and comparing can fool them.'},
      {t:'draw', prompt:'Design time!', tip:'Draw a flying machine you would invent. Give it wings, wheels, a propeller — anything you like.',
        explain:'Every aeroplane in the world started as somebody’s drawing. Yours is saved in My Workshop.'}
    ]}
  ]
},
/* ---------------------------- SET 2 ---------------------------- */
{
  id:2, title:'Hello, Hello!', emoji:'☎️', about:'Bell, the telephone and the smartphone',
  story:{title:'A New Way to Talk', text:[
    "A long time ago people did not have telephones. If they wanted to talk to someone far away, they had to write a letter and then wait many days for an answer.",
    "In 1876 a man named Alexander Graham Bell invented the telephone. His machine could carry a person's voice along a wire. The very first words he spoke on it were to his helper, Mr Watson, who was sitting in the next room.",
    "At first only a few rich people owned a telephone. Slowly, wires were strung from town to town, and more and more families could ring each other up.",
    "Today almost every family has a phone, and many people carry a small one in their pocket called a smartphone. It can send pictures, show maps and answer questions too.",
    "Bell's invention changed the way people talk to each other for ever. A message that once took days now takes less than a second."
  ]},
  sections:[
    {key:'pronouns', items:[
      {t:'choice', prompt:'Pick the right pronoun.', text:'___ are learning about inventions this week.', opts:['We','Us'], ans:0,
        explain:'"We" are the ones doing the learning, and the doer at the start of a sentence is a subject pronoun. ' + SUBJ},
      {t:'choice', prompt:'Pick the right pronoun.', text:'Mr Watson heard Bell and answered ___ at once.', opts:['he','him'], ans:1,
        explain:'Mr Watson does the answering. Bell receives it, so we use the object pronoun "him". ' + OBJ},
      {t:'sort', prompt:'Drag each pronoun into the right box.', bins:[['Doer','does the action'],['Getter','receives the action']],
        chips:[['he',0],['me',1],['we',0],['her',1],['you',0],['them',1]],
        explain:'He, we and you can do the action. Me, her and them receive it. "You" is special — it can do both jobs!'},
      {t:'build', prompt:'Tap the words to build the sentence.', words:['The teacher','showed','us','an old telephone.'],
        explain:'The teacher is the doer. "Us" receives the showing, so the object pronoun follows the verb "showed".'}
    ]},
    {key:'jobs', items:[
      {t:'sort', prompt:'Sort each job into the right workshop.', bins:[['Works with people','helps or teaches people'],['Works with things','builds, designs or studies']],
        chips:[['teacher',0],['dentist',0],['engineer',1],['architect',1],['nurse',0],['inventor',1]],
        explain:'Teachers, dentists and nurses spend their day helping people. Engineers, architects and inventors spend theirs designing and making.'},
      {t:'type', prompt:'Type the job word.', text:'A person who helps you take care of your teeth is a ______.',
        accept:['dentist'], hint:'It begins with "dent", which is an old word for tooth.',
        explain:'"Dent" means tooth, so a dentist is the tooth doctor. The same root hides in "dental".'},
      {t:'choice', prompt:'Which job word fits best?', long:true,
        text:'Mr Watson worked beside Bell every day and helped him test the machine. He was Bell’s ______.',
        opts:['assistant','customer','neighbour'], ans:0,
        explain:'An assistant is someone who helps another person with their work. The story calls Mr Watson his helper.'}
    ]},
    {key:'wordfam', items:[
      {t:'type', prompt:'Complete the word family.', text:'to teach → the PERSON who does it is a ______.',
        accept:['teacher'], hint:'Take off the "to" and add -er.',
        explain:'teach + er = teacher. ' + EROR},
      {t:'spell', prompt:'Spell the missing word.', clue:'to collect → the GROUP of things you gather is a ...', ans:'collection',
        explain:'collect + ion = collection. Watch the spelling: collect keeps both of its l’s.'},
      {t:'type', prompt:'Complete the word family.', text:'to invent → the THING that is made is an ______.',
        accept:['invention'], hint:'It ends in -ion.',
        explain:'invent + ion = invention. The person is an inventor and the thing is an invention.'}
    ]},
    {key:'grammar', items:[
      {t:'type', prompt:'Write "to" and the correct verb.', text:'Bell hoped ______ (send) a voice along a wire.',
        accept:['to send'], hint:'Two words. The first one is "to".',
        explain:'hoped + to + send. ' + TOV},
      {t:'choice', prompt:'Pick the right form.', long:true, text:'The students want ___ more about inventions.',
        opts:['to learn','learning','learns'], ans:0,
        explain:'"Want" takes to + verb, so it is "want to learn". ' + TOV},
      {t:'fill', prompt:'Drag the right "to + verb" into each gap.',
        lines:['Bell needed {to test} his machine in two rooms.','Mr Watson tried {to hear} the very first words.','Families began {to ring} each other every week.'],
        decoys:['to paint','to swim'],
        explain:'You test a machine, you hear words and you ring a friend. Check that the verb matches what is really happening.'},
      {t:'build', prompt:'Tap the words to build the sentence.', words:['We','hope','to make','our school better.'],
        explain:'"Hope" is followed by to + verb: hope to make. ' + TOV}
    ]},
    {key:'reading', items:[
      {t:'choice', prompt:'Read the story, then answer.', text:'In what year was the telephone invented?',
        opts:['1876','1903','1976'], ans:0,
        explain:'The second paragraph gives the year 1876. The Wright brothers flew in 1903, which was much later.'},
      {t:'choice', prompt:'Read the story, then answer.', long:true, text:'What did people do before telephones if they wanted to talk to someone far away?',
        opts:['They wrote a letter and waited many days','They sent a text message','They shouted very loudly'], ans:0,
        explain:'The story says they had to write a letter and then wait many days for an answer.'},
      {t:'write', prompt:'Write your answer in a sentence.', text:'Who was Alexander Graham Bell’s helper, and where was he when the first words were spoken?',
        keys:[['watson'],['next room','other room','another room','room next door','next door']],
        model:'His helper was Mr Watson, and he was in the next room.',
        explain:'Mr Watson was in the next room — close enough to prove that a voice really could travel down a wire.'},
      {t:'write', prompt:'Write your answer in a sentence.', text:'What do many people carry in their pocket today instead of writing letters?',
        keys:[['smartphone','smart phone','phone','mobile']],
        model:'Many people carry a small telephone called a smartphone.',
        explain:'The story calls it a smartphone: a telephone small enough for a pocket that also shows maps and pictures.'},
      {t:'order', prompt:'Put the events in the order they happened.',
        items:['People write letters and wait many days','Bell invents the telephone in 1876','Wires are strung from town to town','People carry smartphones in their pockets'],
        explain:'The story moves forward in time: letters first, then Bell’s invention, then the wires spreading, and smartphones today.'}
    ]},
    {key:'shapes', items:[
      {t:'match', prompt:'Draw a line from each shape to its description.',
        left:[{shape:'octagon',label:'octagon'},{shape:'oval',label:'oval'},{shape:'rhombus',label:'rhombus'},{shape:'semicircle',label:'semicircle'},{shape:'trapezium',label:'trapezium'}],
        right:['8 straight sides','like a circle that has been stretched','4 equal sides that lean over','exactly half of a circle','4 sides, with just one pair that stay the same distance apart'],
        explain:'A trapezium has exactly one pair of parallel sides — two sides that never get closer, like railway tracks.'},
      {t:'choice', prompt:'Tap the oval.',
        opts:[{shape:'circle',label:'circle'},{shape:'oval',label:'oval'},{shape:'semicircle',label:'semicircle'},{shape:'rhombus',label:'rhombus'}], ans:1,
        explain:'An oval is longer one way than the other, like an egg. A circle is the same width whichever way you measure it.'},
      {t:'spell', prompt:'Spell the shape.', clue:'I have 7 straight sides. I am one more than a hexagon.', ans:'heptagon',
        explain:'"Hepta" means seven, so a heptagon has 7 sides. Six is hexa, seven is hepta, eight is octa.'}
    ]},
    {key:'think', items:[
      {t:'choice', prompt:'Look carefully, then answer.', fig:'mullerlyer', long:true,
        text:'Look at the two black lines. Which one is longer?',
        opts:['They are exactly the same length','The top line is longer','The bottom line is longer'], ans:0,
        explain:'The two lines are the same. Tap "Measure it" to see the guides line up. The arrow heads point outwards on one line and inwards on the other, and your brain reads the outward arrows as "further away, so longer".'},
      {t:'write', prompt:'Explain your thinking.', text:'The lines are the same length. So why does one look longer than the other?',
        keys:[['arrow','arrows','point','pointing','end','ends','head','heads'],['brain','trick','tricks','look','looks','seem','seems','longer','shorter']],
        model:'The arrows at the ends point different ways, and that makes my brain think one line is longer.',
        explain:'Nothing about the lines changed — only the arrows. That is the clue that the trick is happening inside your brain, not in the picture.'},
      {t:'free', prompt:'Write about your own invention.', minWords:12,

const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const shuffleNotSame = a => { if (a.length < 2) return [...a]; let s; do { s = shuffle(a); } while (s.every((v, i) => v === a[i])); return s; };
const shapeSvg = (n, style = '') => `<svg class="shape" viewBox="0 0 100 100" aria-hidden="true" ${style ? `style="${style}"` : ''}>${SHAPES[n]}</svg>`;
const norm = s => String(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
const fmtTime = ms => { const s = Math.max(0, Math.round(ms / 1000)); const m = Math.floor(s / 60); return m ? `${m} min ${s % 60} sec` : `${s} sec`; };
const fmtDate = t => { const d = new Date(t); return d.toLocaleDateString(undefined, {day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}); };
const pick = a => a[Math.floor(Math.random() * a.length)];

/* Seeded shuffle: every learner gets their own set order, and that order
   never changes again once it is saved. */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed) {
  const rnd = mulberry32(seed >>> 0), a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function lev(a, b) { // optimal string alignment distance (forgives swapped letters)
  const d = Array.from({length: a.length + 1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[a.length][b.length];
}
const tolFor = w => w.length >= 8 ? 2 : w.length >= 5 ? 1 : w.length >= 4 ? 1 : 0;
/* Does the child's sentence contain this idea? Tolerant of small misspellings. */
function hasKey(text, key) {
  const t = norm(text), k = norm(key);
  if (!k) return false;
  if (t.includes(k)) return true;
  if (k.includes(' ')) return false;
  const tol = tolFor(k);
  return tol > 0 && t.split(' ').some(w => Math.abs(w.length - k.length) <= tol && lev(w, k) <= tol);
}
/* Short typed answers: ignore case, punctuation, a leading a/an/the, and
   forgive one or two slips of the pen. */
function answerMatches(input, accept) {
  const t = norm(input).replace(/^(a|an|the)\s+/, '');
  if (!t) return false;
  return accept.some(a => {
    const k = norm(a);
    if (t === k) return true;
    const kw = k.split(' '), tw = t.split(' ');
    if (kw.length !== tw.length) return false;
    return kw.every((w, i) => w === tw[i] || (tolFor(w) > 0 && lev(tw[i], w) <= tolFor(w)));
  });
}

const KEY = 'inventorsLab.v1';
const ART = 'inventorsLab.art.v1';
const freshStats = () => ({spell:0, illusion:0, write:0, draw:0, fix:0, streak:0});
const fresh = () => ({v:1, seed:null, order:null, sets:{}, works:[], gallery:[], badges:[], stats:freshStats(),
  current:null, lastRun:null, settings:{size:'normal', theme:'auto', sound:true}});
let S = fresh();
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign(fresh(), d);
      S.settings = Object.assign(fresh().settings, d.settings || {});
      S.stats = Object.assign(freshStats(), d.stats || {});
    }
  } catch (e) { storageOK = false; }
  /* Drawings live in their own key now. Saves made before that change
     kept them in the main one; those are read above and move across on
     the next save, so nobody loses a picture in the upgrade. */
  try {
    const art = localStorage.getItem(ART);
    if (art) S.gallery = JSON.parse(art) || [];
  } catch (e) {}
  if (!Array.isArray(S.gallery)) S.gallery = [];
  if (S.seed === null || S.seed === undefined) S.seed = (Math.random() * 4294967296) >>> 0;
  setOrder();
}

  try {
    localStorage.setItem(k, text);
    return localStorage.getItem(k) === text;
  } catch (e) { return false; }
}
/* All the activities on this site share one storage allowance. Saved art is
   the throwaway tier wherever it came from, so one child's stars may clear
   another activity's pictures — never the other way round. */
function dropArtElsewhere() {
  let keys, freed = false;
  try { keys = Object.keys(localStorage); } catch (e) { return false; }
  for (const k of keys) {
    if (k !== ART && /\.art\.v\d+$/.test(k)) {
      try { localStorage.removeItem(k); freed = true; } catch (e) {}
    }
  }
  return freed;
}
/* Writes the child's progress. Nothing here may be lost for want of room, so
   it gives up pictures — its own first, then any other activity's — before
   it gives up itself. */
function save() {
  S.updatedAt = Date.now();
  const {gallery, ...progress} = S;
  const body = JSON.stringify(progress);
  let ok = writeKey(KEY, body);
  if (!ok) { try { localStorage.removeItem(ART); } catch (e) {} ok = writeKey(KEY, body); }
  if (!ok && dropArtElsewhere()) ok = writeKey(KEY, body);
  storageOK = ok;
  saveArt();
  return ok;
}
/* Pictures, written only once the stars are safely down. Oldest go first
   until the rest fit; none of this can cost a star. */
function saveArt() {
  const clear = () => { try { localStorage.removeItem(ART); } catch (e) {} };
  if (!storageOK || !S.gallery.length) { clear(); return false; }
  let list = S.gallery;
  while (list.length) {
    if (writeKey(ART, JSON.stringify(list))) { S.gallery = list; return true; }
    list = list.slice(0, list.length - 1);
  }
  clear(); S.gallery = [];
  return false;
}
function applySettings() {
  const r = document.documentElement;
  r.dataset.size = S.settings.size;
  if (S.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = S.settings.theme;
}
/* The learner's personal set order. Built once, then only ever added to. */
function setOrder() {
  const ids = SETS.map(s => s.id);
  const kept = (S.order || []).filter(id => ids.includes(id));
  const missing = ids.filter(id => !kept.includes(id));
  if (missing.length || kept.length !== (S.order || []).length) {
    S.order = [...kept, ...(missing.length > 1 ? seededShuffle(missing, S.seed + kept.length) : missing)];
  }

}
const orderPos = id => setOrder().indexOf(id);
const setAtPos = p => getSet(setOrder()[p]);

/* ============ SOUND + READ ALOUD ============ */
let actx = null;
function beep(kind) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [523, 659, 784] : kind === 'part' ? [523, 587] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * 0.1 + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + i * 0.1); o.stop(actx.currentTime + i * 0.1 + 0.25);
    });
  } catch (e) {}
}
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/_+/g, ' blank '));
    u.lang = 'en-GB'; u.rate = 0.9; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ============ CONTENT HELPERS ============ */
const getSet = id => SETS.find(s => s.id === id);
const blanksOf = item => { const out = []; item.lines.forEach(l => l.replace(/\{([^}]+)\}/g, (m, w) => { out.push(w); return m; })); return out; };
function itemTotal(item) {
  switch (item.t) {
    case 'sort':  return item.chips.length;
    case 'match': return item.left.length;
    case 'fill':  return blanksOf(item).length;
    case 'order': return item.items.length;
    case 'write': return item.keys.length;
    case 'draw': case 'free': return 0;
    default: return 1;
  }
}
function flat(set) { if (!set._flat) { set._flat = []; set.sections.forEach(sec => sec.items.forEach(item => set._flat.push({sec:sec.key, item}))); } return set._flat; }
const setTotal = set => flat(set).reduce((a, q) => a + itemTotal(q.item), 0);
const starsFor = pct => pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
const starRow = n => `<span class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i => `<span class="${i < n ? 'star-on' : 'star-off'}">★</span>`).join('')}</span>`;
const setsFinished = s => Object.values(s.sets).filter(r => r && r.best).length;
const threeStarSets = s => Object.values(s.sets).filter(r => r && r.best && starsFor(r.best.pct) === 3).length;
/* Unlocking follows the learner's own order, not the set numbers. */
function questionLabel(item) { return item.text || item.clue || item.tip || item.prompt; }
function answerText(item) {
  switch (item.t) {
    case 'choice': { const o = item.opts[item.ans]; return typeof o === 'object' ? o.label : o; }
    case 'sort':   return item.bins.map((b, bi) => `${b[0]}: ${item.chips.filter(c => c[1] === bi).map(c => c[0]).join(', ')}`).join('. ');
    case 'build':  return item.words.join(' ');
    case 'write':  return item.model;
    case 'type':   return item.accept[0];
    case 'spell':  return item.ans;
    case 'match':  return item.left.map((l, i) => `${l.label || 'shape ' + (i + 1)} goes with ${item.right[i]}`).join('. ');
    case 'fill':   return item.lines.map(l => l.replace(/\{([^}]+)\}/g, '$1')).join(' ');
    case 'order':  return item.items.map((t, i) => `${i + 1}. ${t}`).join('. ');
    default: return '';
  }
}
function speakText(item) {
  const bits = [item.prompt];
  if (item.clue) bits.push(item.clue);
  if (item.text) bits.push(item.text.replace(/_{2,}/g, ' blank '));
  if (item.tip) bits.push(item.tip);
  if (item.t === 'choice' && typeof item.opts[0] === 'string') bits.push(item.opts.join(', or '));
  if (item.t === 'fill') bits.push(item.lines.map(l => l.replace(/\{[^}]+\}/g, 'blank')).join(' '));
  if (item.t === 'order') bits.push(item.items.join('. '));
  return bits.join('. ');
}
/* "Grandpa taught ___ how to ride." -> styled blank, filled in as they answer */
function blankify(text, word) {
  const parts = String(text).split(/_{2,}|___/);
  if (parts.length < 2) return esc(text);
  return esc(parts[0]) + (word
    ? `<span class="blank filled">${esc(word)}</span>`
    : '<span class="blank"><span class="sr">blank</span>&nbsp;</span>') + esc(parts.slice(1).join(' '));
}

/* ============ AUTO-SCROLL WHILE DRAGGING ============ */
function autoScroller(onScroll) {
  let y = null, raf = null;
  const step = () => {
    if (y === null) { raf = null; return; }
    const dockH = dock.classList.contains('hidden') ? 0 : dock.offsetHeight;
    const bottom = window.innerHeight - dockH;
    let d = 0;
    if (y > bottom - 70) d = Math.min(20, (y - (bottom - 70)) / 3 + 2);
    else if (y < 120) d = -Math.min(20, (120 - y) / 3 + 2);
    if (d) { const before = window.scrollY; window.scrollBy(0, d); if (window.scrollY !== before && onScroll) onScroll(); }
    raf = requestAnimationFrame(step);
  };
  return {update(ny) { y = ny; if (!raf) raf = requestAnimationFrame(step); }, stop() { y = null; }};
}

/* ============ DRAG + TAP HELPER (chips into zones) ============ */
function dnd(root, o) {
  let suppress = false;
  root.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.chip[data-id]');
    if (!chip || o.locked() || e.button > 0) return;
    e.preventDefault();
    const id = chip.dataset.id, sx = e.clientX, sy = e.clientY;
    let ghost = null, over = null, lx = sx, ly = sy;
    const findZone = () => {
      const hit = document.elementFromPoint(lx, ly);
      const z = hit && hit.closest('[data-drop]');
      const zone = z && root.contains(z) ? z : null;
      if (zone !== over) { if (over) over.classList.remove('over'); if (zone) zone.classList.add('over'); over = zone; }
    };
    const scroller = autoScroller(findZone);
    const move = ev => {
      lx = ev.clientX; ly = ev.clientY;
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        document.body.appendChild(ghost); chip.classList.add('dragging');
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      scroller.update(ev.clientY);
      findZone();
    };
    const end = ev => {
      scroller.stop();
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (over) over.classList.remove('over');
      if (ghost) { suppress = true; setTimeout(() => { suppress = false; }, 0); ghost.remove(); chip.classList.remove('dragging'); if (ev.type === 'pointerup' && over) o.drop(id, over.dataset.drop); }
      else if (ev.type === 'pointerup') setTimeout(() => o.tap(id), 0);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  root.addEventListener('click', e => {
    if (o.locked() || suppress || e.target.closest('.chip')) return;
    const z = e.target.closest('[data-drop]');
    if (z) o.zoneTap(z.dataset.drop);
  });
  root.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (o.locked()) return;
    const chip = e.target.closest('.chip[data-id]');
    const z = e.target.closest('[data-drop]');
    if (chip) { e.preventDefault(); e.stopPropagation(); o.tap(chip.dataset.id); }
    else if (z) { e.preventDefault(); e.stopPropagation(); o.zoneTap(z.dataset.drop); }
  });
}

/* ============ QUESTION TYPES ============ */
const TYPES = {};

TYPES.choice = (item, root, changed) => {
  let sel = -1, locked = false;
  const pics = typeof item.opts[0] === 'object';
  root.innerHTML = `${item.text ? `<p class="qtext" id="qt">${blankify(item.text, null)}</p>` : ''}
    <div class="opts ${item.long ? 'long' : ''} ${pics ? 'pics' : ''}" role="group" aria-label="Answers">${item.opts.map((o, i) =>
      `<button class="opt" data-i="${i}" ${pics ? `aria-label="Shape ${i + 1}"` : ''}>${pics ? shapeSvg(o.shape) + `<small class="lbl hidden">${esc(o.label)}</small>` : esc(o)}</button>`).join('')}</div>`;
  const btns = $$('.opt', root);
  btns.forEach(b => b.addEventListener('click', () => {
    if (locked) return;
    sel = +b.dataset.i;
    btns.forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
    if (item.text && /_{2,}/.test(item.text)) $('#qt', root).innerHTML = blankify(item.text, item.opts[sel]);
    changed();
  }));
  return {
    ready: () => sel >= 0,
    check() {
      locked = true;
      btns.forEach((b, i) => { b.disabled = true; b.classList.remove('sel'); if (i === item.ans) b.classList.add('ok'); else if (i === sel) b.classList.add('no'); });
      if (pics) $$('.lbl', root).forEach(l => l.classList.remove('hidden'));
      return {e: sel === item.ans ? 1 : 0, t: 1, answer: esc(answerText(item))};
    }
  };
};

TYPES.sort = (item, root, changed) => {
  const chips = shuffle(item.chips.map((c, i) => ({id:i, w:c[0], b:c[1], state:''})));
  const place = {};
  let sel = null, locked = false;
  const chipHtml = c => `<span class="chip ${sel === c.id ? 'sel' : ''} ${c.state}" data-id="${c.id}" role="button" tabindex="0">${esc(c.w)}</span>`;
  function draw() {
    const inBank = chips.filter(c => place[c.id] === undefined);
    root.innerHTML = `<div class="bank" data-drop="bank"><span class="bank-label">${inBank.length ? 'Drag a word to a box, or tap a word and then tap a box.' : 'All sorted! Tap Check when you are ready.'}</span>${inBank.map(chipHtml).join('')}</div>
      <div class="bins">${item.bins.map((b, bi) => `<div class="bin" data-drop="${bi}" tabindex="0" role="button" aria-label="Box: ${esc(b[0])}"><h3>${esc(b[0])}</h3><div class="hint">${esc(b[1])}</div><div class="inside">${chips.filter(c => place[c.id] === bi).map(chipHtml).join('')}</div></div>`).join('')}</div>`;
  }
  function drop(id, zone) { id = +id; if (zone === 'bank') delete place[id]; else place[id] = +zone; sel = null; draw(); changed(); }
  draw();
  dnd(root, {
    locked: () => locked,
    tap(id) { id = +id; if (place[id] !== undefined) { delete place[id]; sel = null; } else sel = sel === id ? null : id; draw(); changed(); },
    drop,
    zoneTap(zone) { if (sel !== null) drop(sel, zone); }
  });
  return {
    ready: () => Object.keys(place).length === chips.length,
    check() {
      locked = true; let e = 0;
      chips.forEach(c => { const ok = place[c.id] === c.b; c.state = ok ? 'ok' : 'no'; if (ok) e++; });
      sel = null; draw();
      return {e, t: chips.length, answer: item.bins.map((b, bi) => `<b>${esc(b[0])}:</b> ${item.chips.filter(c => c[1] === bi).map(c => esc(c[0])).join(', ')}`).join('<br>')};
    }
  };
};

TYPES.fill = (item, root, changed) => {
  const answers = blanksOf(item);
  const words = shuffle([...answers, ...item.decoys]).map((w, i) => ({id:i, w}));
  const slots = answers.map(() => null);
  const spare = item.decoys.length;
  let sel = null, locked = false, marks = null;
  function draw() {
    let k = 0;
    const lines = item.lines.map(l => {
      const parts = l.split(/(\{[^}]+\})/);
      let out = '';
      for (let pi = 0; pi < parts.length; pi++) {
        const part = parts[pi];
        if (!/^\{[^}]+\}$/.test(part)) { out += esc(part); continue; }
        const si = k++, cid = slots[si], w = cid === null ? null : words[cid];
        let punct = '';
        if (parts[pi + 1]) { const m = parts[pi + 1].match(/^[,.!?;:]+/); if (m) { punct = m[0]; parts[pi + 1] = parts[pi + 1].slice(punct.length); } }
        out += `<span class="nowrap"><span class="slot" data-drop="${si}" role="button" tabindex="0" aria-label="Gap ${si + 1}${w ? ': ' + esc(w.w) : ''}">${w ? `<span class="chip ${marks ? (marks[si] ? 'ok' : 'no') : ''}" data-id="${w.id}">${esc(w.w)}</span>` : ''}</span>${esc(punct)}</span>`;
      }
      return `<span class="line">${out}</span>`;
    }).join('');
    const bank = words.filter(w => !slots.includes(w.id));
    root.innerHTML = `<div class="bank" data-drop="bank"><span class="bank-label">Drag a card into a gap, or tap a card and then tap a gap. ${spare} card${spare === 1 ? ' is' : 's are'} left over!</span>${bank.map(w => `<span class="chip ${sel === w.id ? 'sel' : ''}" data-id="${w.id}" role="button" tabindex="0">${esc(w.w)}</span>`).join('')}</div><p class="poemtext">${lines}</p>`;
  }
  function drop(id, zone) {
    id = +id; const from = slots.indexOf(id);
    if (zone === 'bank') { if (from >= 0) slots[from] = null; }
    else { const si = +zone; const prev = slots[si]; if (from >= 0) slots[from] = prev; slots[si] = id; }
    sel = null; draw(); changed();
  }
  draw();
  dnd(root, {
    locked: () => locked,
    tap(id) { id = +id; if (slots.includes(id)) drop(id, 'bank'); else { sel = sel === id ? null : id; draw(); } },
    drop,
    zoneTap(zone) { if (sel !== null) drop(sel, zone); else if (zone !== 'bank' && slots[+zone] !== null) drop(slots[+zone], 'bank'); }
  });
  return {
    ready: () => slots.every(s => s !== null),
    check() {
      locked = true;
      marks = slots.map((cid, si) => cid !== null && words[cid].w === answers[si]);
      draw();
      return {e: marks.filter(Boolean).length, t: answers.length, answer: item.lines.map(l => esc(l).replace(/\{([^}]+)\}/g, '<b>$1</b>')).join('<br>')};
    }
  };
};

TYPES.build = (item, root, changed) => {
  const order = shuffleNotSame(item.words.map((_, i) => i));
  const picked = [];
  let locked = false, mark = '';
  function draw() {
    root.innerHTML = `<div class="buildline" aria-label="Your sentence">${picked.map((wi, pi) => `<span class="chip ${mark}" data-p="${pi}" role="button" tabindex="0">${esc(item.words[wi])}</span>`).join('')}</div>
      <div class="bank"><span class="bank-label">Tap a word to add it. Tap it again in the line to take it back.</span>${order.map(wi => `<span class="chip ${picked.includes(wi) ? 'used' : ''}" data-w="${wi}" role="button" tabindex="0">${esc(item.words[wi])}</span>`).join('')}</div>`;
  }
  function act(c) {
    if (locked || !c) return;
    if (c.dataset.w !== undefined) { const wi = +c.dataset.w; if (!picked.includes(wi)) picked.push(wi); }
    else if (c.dataset.p !== undefined) picked.splice(+c.dataset.p, 1);
    draw(); changed();
  }
  root.addEventListener('click', e => act(e.target.closest('.chip')));
  root.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.chip')) { e.preventDefault(); e.stopPropagation(); act(e.target.closest('.chip')); } });
  draw();
  return {
    ready: () => picked.length === item.words.length,
    check() {
      locked = true;
      const ok = picked.every((wi, i) => wi === i);
      mark = ok ? 'ok' : 'no'; draw();
      return {e: ok ? 1 : 0, t: 1, answer: esc(item.words.join(' '))};
    }
  };
};

TYPES.write = (item, root, changed) => {
