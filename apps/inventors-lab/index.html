TYPES.spell = (item, root, changed) => {
  const ans = item.ans;
  const upper = /^[A-Z]/.test(ans);
  const pool = 'abcdefghklmnoprstuwy';
  const extras = [];
  while (extras.length < (ans.length <= 3 ? 2 : 3)) { const ch = pick(pool); if (!ans.toLowerCase().includes(ch) && !extras.includes(ch)) extras.push(ch); }
  const tiles = shuffle([...ans.split(''), ...extras.map(x => upper ? x.toUpperCase() : x)]).map((ch, i) => ({i, ch, used:false}));
  const boxes = Array(ans.length).fill(null);
  let locked = false, marks = null;
  function draw() {
    const next = boxes.indexOf(null);
    root.innerHTML = `<p class="clue">${esc(item.clue)}</p>
      <div class="boxes" style="grid-template-columns:repeat(${ans.length},minmax(0,2.6rem));font-size:${ans.length > 8 ? '.8em' : '1em'}" role="group" aria-label="Your answer has ${ans.length} letters">${boxes.map((ti, bi) =>
        `<button class="box ${!marks && bi === next ? 'next' : ''} ${marks ? (marks[bi] ? 'ok' : 'no') : ''}" data-b="${bi}" aria-label="Letter ${bi + 1}${ti !== null ? ': ' + esc(tiles[ti].ch) : ', empty'}" ${locked ? 'disabled' : ''}>${ti !== null ? esc(tiles[ti].ch) : ''}</button>`).join('')}</div>
      <div class="tiles">${tiles.map(t => `<button class="tile" data-t="${t.i}" ${t.used || locked ? 'disabled' : ''}>${esc(t.ch)}</button>`).join('')}<button class="tile" data-back="1" aria-label="Delete the last letter" ${locked ? 'disabled' : ''}>⌫</button></div>
      <p class="tip">Tap the letters in order. You can type on a keyboard too.</p>`;
  }
  function put(ti) { const n = boxes.indexOf(null); if (n < 0 || tiles[ti].used) return; boxes[n] = ti; tiles[ti].used = true; draw(); changed(); }
  function clearBox(bi) { if (boxes[bi] === null) return; tiles[boxes[bi]].used = false; boxes[bi] = null; draw(); changed(); }
  function back() { for (let i = boxes.length - 1; i >= 0; i--) if (boxes[i] !== null) return clearBox(i); }
  root.addEventListener('click', e => {
    if (locked) return;
    const t = e.target.closest('.tile'), b = e.target.closest('.box');
    if (t) { if (t.dataset.back) back(); else put(+t.dataset.t); }
    else if (b) clearBox(+b.dataset.b);
  });
  draw();
  return {
    ready: () => boxes.every(b => b !== null),
    check() {
      locked = true;
      marks = boxes.map((ti, bi) => ti !== null && tiles[ti].ch.toLowerCase() === ans[bi].toLowerCase());
      draw();
      return {e: marks.every(Boolean) ? 1 : 0, t: 1, answer: `<span style="letter-spacing:.08em">${esc(ans)}</span>`};
    },
    onKey(e) {
      if (locked) return false;
      if (e.key === 'Backspace') { back(); return true; }
      if (/^[a-z]$/i.test(e.key)) {
        const t = tiles.find(t => !t.used && t.ch.toLowerCase() === e.key.toLowerCase());
        if (t) put(t.i);
        return true;
      }
      return false;
    }
  };
};

const LINE_COLORS = ['var(--sky)', 'var(--sun)', '#8E6AC8', '#D0668E', '#2E9C96', '#C07A34'];
TYPES.match = (item, root, changed, cleanups) => {
  const n = item.left.length;
  const rightOrder = shuffleNotSame(item.right.map((_, i) => i));
  const conn = {};
  let sel = null, temp = null, locked = false, result = false;
  root.innerHTML = `<p class="tip" style="margin:0 0 .9rem">Drag from a box on one side to a box on the other, or tap one on each side.</p>
    <div class="match">
      <svg class="lines" aria-hidden="true"></svg>
      <div class="match-col">${item.left.map((l, i) => `<button class="m-item left" data-side="L" data-i="${i}" aria-label="${l.label ? esc(l.label) : 'Shape ' + (i + 1)}">${l.shape ? shapeSvg(l.shape) : ''}${l.label ? `<span>${esc(l.label)}</span>` : ''}<span class="dot"></span></button>`).join('')}</div>
      <div class="match-col">${rightOrder.map(ri => `<button class="m-item right" data-side="R" data-i="${ri}">${esc(item.right[ri])}<span class="dot"></span></button>`).join('')}</div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:.9rem"><button class="btn btn-small" id="clearLines" type="button">Clear lines</button></div>`;
  const box = $('.match', root), svg = $('svg.lines', root);
  const itemEl = (side, i) => box.querySelector(`.m-item[data-side="${side}"][data-i="${i}"]`);
  const dotPt = el => { const b = box.getBoundingClientRect(), r = el.getBoundingClientRect(); return {x: (el.dataset.side === 'L' ? r.right : r.left) - b.left, y: r.top + r.height / 2 - b.top}; };
  const curve = (a, b) => { const dx = (b.x - a.x) * 0.45; return `M${a.x} ${a.y} C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`; };
  function redraw() {
    let html = '';
    Object.entries(conn).forEach(([li, ri]) => {
      const a = dotPt(itemEl('L', li)), b = dotPt(itemEl('R', ri));
      let color = LINE_COLORS[li % LINE_COLORS.length], extra = '';
      if (result) { const ok = +li === +ri; color = ok ? 'var(--leaf)' : 'var(--berry)'; if (!ok) extra = 'stroke-dasharray="10 8"'; }
      html += `<path d="${curve(a, b)}" stroke="${color}" ${extra}/>`;
    });
    if (temp) { const bb = box.getBoundingClientRect(); html += `<path d="${curve(dotPt(temp.el), {x: temp.cx - bb.left, y: temp.cy - bb.top})}" stroke="var(--ink-soft)" stroke-dasharray="6 7"/>`; }
    svg.innerHTML = html;
    $$('.m-item', box).forEach(el => {
      const side = el.dataset.side, i = +el.dataset.i;
      el.classList.toggle('linked', side === 'L' ? conn[i] !== undefined : Object.values(conn).includes(i));
      el.classList.toggle('sel', !!sel && sel.side === side && sel.i === i);
    });
  }
  function link(li, ri) { for (const k in conn) if (conn[k] === ri) delete conn[k]; conn[li] = ri; sel = null; redraw(); changed(); }
  function unlink(side, i) { if (side === 'L') delete conn[i]; else for (const k in conn) if (conn[k] === i) delete conn[k]; }
  function tapItem(side, i) {
    if (sel && sel.side !== side) { side === 'L' ? link(i, sel.i) : link(sel.i, i); return; }
    if (sel && sel.side === side && sel.i === i) { unlink(side, i); sel = null; redraw(); changed(); return; }
    sel = {side, i}; redraw();
  }
  box.addEventListener('pointerdown', e => {
    const el = e.target.closest('.m-item');
    if (!el || locked || e.button > 0) return;
    e.preventDefault();
    const side = el.dataset.side, i = +el.dataset.i, sx = e.clientX, sy = e.clientY;
    let dragging = false;
    const scroller = autoScroller(() => { if (temp) redraw(); });
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) dragging = true;
      if (dragging) { temp = {el, cx: ev.clientX, cy: ev.clientY}; sel = {side, i}; scroller.update(ev.clientY); redraw(); }
    };
    const end = ev => {
      scroller.stop();
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (dragging) {
        temp = null;
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        const t = hit && hit.closest('.m-item');
        if (ev.type === 'pointerup' && t && box.contains(t) && t.dataset.side !== side) { const j = +t.dataset.i; side === 'L' ? link(i, j) : link(j, i); }
        else { sel = null; redraw(); }
      } else if (ev.type === 'pointerup') tapItem(side, i);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  box.addEventListener('click', e => { const el = e.target.closest('.m-item'); if (el && e.detail === 0 && !locked) tapItem(el.dataset.side, +el.dataset.i); });
  $('#clearLines', root).addEventListener('click', () => { if (locked) return; for (const k in conn) delete conn[k]; sel = null; redraw(); changed(); });
  const ro = new ResizeObserver(() => redraw()); ro.observe(box);
  cleanups.push(() => ro.disconnect());
  requestAnimationFrame(redraw);
  return {
    ready: () => Object.keys(conn).length === n,
    check() {
      locked = true; result = true; let e = 0;
      for (let i = 0; i < n; i++) {
        const ok = conn[i] === i; if (ok) e++;
        itemEl('L', i).classList.add(ok ? 'ok' : 'no');
        const r = itemEl('R', i), rOk = Object.entries(conn).some(([li, ri]) => ri === i && +li === i);
        r.classList.add(rOk ? 'ok' : 'no');
      }
      $$('.m-item', box).forEach(b => b.disabled = true);
      $('#clearLines', root).disabled = true;
      redraw();
      return {e, t: n, answer: item.left.map((l, i) => `${l.shape && !l.label ? shapeSvg(l.shape, 'width:1.6rem;height:1.6rem;vertical-align:middle') : `<b>${esc(l.label)}</b>`} ➜ ${esc(item.right[i])}`).join('<br>')};
    }
  };
};

/* Put the cards in the right order: drag them, or use the little arrows. */
TYPES.order = (item, root, changed) => {
  const n = item.items.length;
  let seq = shuffleNotSame(item.items.map((_, i) => i));
  let locked = false, marks = null, dragPos = -1;
  function draw() {
    root.innerHTML = `<p class="tip" style="margin:0 0 .9rem">Drag a card up or down, or use the ▲ ▼ arrows, until the order is right.</p>
      <div class="orderlist">${seq.map((si, p) => `
        <div class="ord ${dragPos === p ? 'dragging' : ''} ${marks ? (marks[p] ? 'ok' : 'no') : ''}" data-p="${p}" role="listitem" aria-label="Position ${p + 1}: ${esc(item.items[si])}">
          <span class="num">${p + 1}</span>
          <span>${esc(item.items[si])}</span>
          <span class="ord-move">
            <button type="button" data-up="${p}" aria-label="Move up" ${p === 0 || locked ? 'disabled' : ''}>▲</button>
            <button type="button" data-down="${p}" aria-label="Move down" ${p === n - 1 || locked ? 'disabled' : ''}>▼</button>
          </span>
        </div>`).join('')}</div>`;
  }
  function move(from, to) {
    if (to < 0 || to >= n || from === to) return;
    const [x] = seq.splice(from, 1); seq.splice(to, 0, x);
  }
  draw();
  root.addEventListener('click', e => {
    if (locked) return;
    const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-down]');
    if (up) { const p = +up.dataset.up; move(p, p - 1); draw(); changed(); $$(`[data-up="${p - 1}"]`, root)[0].focus(); }
    else if (dn) { const p = +dn.dataset.down; move(p, p + 1); draw(); changed(); $$(`[data-down="${p + 1}"]`, root)[0].focus(); }
  });
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('.ord');
    if (!el || locked || e.button > 0 || e.target.closest('.ord-move')) return;
    e.preventDefault();
    const sy = e.clientY;
    dragPos = +el.dataset.p;
    let ghost = null;
    const scroller = autoScroller(() => {});
    const place = y => {
      const rows = $$('.ord', root);
      let target = dragPos;
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].getBoundingClientRect();
        if (y > r.top && y < r.bottom) { target = i; break; }
        if (i === 0 && y <= r.top) target = 0;
        if (i === rows.length - 1 && y >= r.bottom) target = rows.length - 1;
      }
      if (target !== dragPos) { move(dragPos, target); dragPos = target; draw(); }
    };
    const onMove = ev => {
      if (!ghost) {
        if (Math.abs(ev.clientY - sy) < 8) return;
        ghost = el.cloneNode(true);
        ghost.classList.add('ghost'); ghost.classList.remove('dragging');
        ghost.style.width = el.getBoundingClientRect().width + 'px';
        document.body.appendChild(ghost);
        draw();
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      scroller.update(ev.clientY);
      place(ev.clientY);
    };
    const end = () => {
      scroller.stop();
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (ghost) { ghost.remove(); changed(); }
      dragPos = -1; draw();
    };
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  return {
    ready: () => true,
    check() {
      locked = true;
      marks = seq.map((si, p) => si === p);
      draw();
      return {e: marks.filter(Boolean).length, t: n, answer: item.items.map((t, i) => `<b>${i + 1}.</b> ${esc(t)}`).join('<br>')};
    }
  };
};

/* Draw your invention. Saved as a small picture in My Workshop. */
const PEN_COLORS = ['#1F2A37', '#C0392B', '#2F76A8', '#2E8B57', '#D9841C', '#8E6AC8'];
TYPES.draw = (item, root, changed) => {
  root.innerHTML = `<p class="clue">${esc(item.tip)}</p>
    <div class="padwrap">
      <canvas id="pad" class="pad" width="600" height="400" aria-label="Drawing area. Use a finger, a pen or a mouse."></canvas>
      <div class="padtools" role="group" aria-label="Drawing tools">
        ${PEN_COLORS.map((c, i) => `<button type="button" class="swatch" data-c="${i}" style="background:${c}" aria-label="Colour ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}
        <button type="button" class="btn btn-small" id="undoBtn">↶ Undo</button>
        <button type="button" class="btn btn-small" id="clearPad">Start again</button>
      </div>
      <p class="padnote">Draw something, then tap Check to keep it. There are no wrong answers here.</p>
    </div>`;
  const cv = $('#pad', root), ctx = cv.getContext('2d');
  let strokes = [], cur = null, color = PEN_COLORS[0], locked = false;
  function repaint() {
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of strokes.concat(cur ? [cur] : [])) {
      if (s.pts.length < 2) {
        ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.pts[0].x, s.pts[0].y, s.w / 2, 0, 7); ctx.fill();
        continue;
      }
      ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
      ctx.stroke();
    }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height}; };
  cv.addEventListener('pointerdown', e => {
    if (locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = {c: color, w: 6, pts: [pos(e)]}; repaint();
  });
  cv.addEventListener('pointermove', e => { if (!cur) return; cur.pts.push(pos(e)); repaint(); });
  const stop = () => { if (!cur) return; strokes.push(cur); cur = null; repaint(); changed(); };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  cv.addEventListener('pointerleave', stop);
  $$('.swatch', root).forEach(b => b.onclick = () => {
    color = PEN_COLORS[+b.dataset.c];
    $$('.swatch', root).forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  $('#undoBtn', root).onclick = () => { if (locked) return; strokes.pop(); repaint(); changed(); };
  $('#clearPad', root).onclick = () => { if (locked) return; strokes = []; repaint(); changed(); };
  repaint();
  return {
    ready: () => strokes.length > 0,
    check() {
      locked = true;
      let url = '';
      try {
        const small = document.createElement('canvas');
        small.width = 360; small.height = 240;
        const sc = small.getContext('2d');
        sc.fillStyle = '#FFFFFF'; sc.fillRect(0, 0, 360, 240);
        sc.drawImage(cv, 0, 0, 360, 240);
        /* JPEG, not PNG. A drawing on white costs about a tenth as much that
           way, and every activity on this site shares a few megabytes. */
        url = small.toDataURL('image/jpeg', 0.72);
      } catch (e) {}
      return {e: 0, t: 0, picture: url, strokes: strokes.length};
    }
  };
};

/* Free writing: a short paragraph about an invention or an idea. */
TYPES.free = (item, root, changed) => {
  const need = item.minWords || 12;
  root.innerHTML = `<p class="clue">${esc(item.tip)}</p>
    <label class="sr" for="wr">Your writing</label>
    <textarea id="wr" class="write" rows="6" placeholder="Start writing here..."></textarea>
    <div class="wordcount" id="wc">0 words</div>`;
  const ta = $('#wr', root), wc = $('#wc', root);
  const count = () => norm(ta.value).split(' ').filter(Boolean).length;
  ta.addEventListener('input', () => {
    const c = count();
    wc.textContent = `${c} word${c === 1 ? '' : 's'}${c < need ? ` (write at least ${need})` : ' — nice work!'}`;
    changed();
  });
  return {
    ready: () => count() >= need,
    check() {
      ta.readOnly = true;
      const text = ta.value.trim();
      const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean).length;
      return {e: 0, t: 0, response: text, words: count(), sentences};
    },
    focus: () => ta.focus()
  };
};

/* ============ APP ============ */
const app = $('#app'), dock = $('#dock'), dockInner = $('#dockInner'), layer = $('#layer');
let screen = 'home', Q = null, timer = null, paused = false, cleanups = [], streak = 0;

function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function showLayer(html) { layer.innerHTML = html; const b = $('button', layer); if (b) b.focus(); }
function hideLayer() { layer.innerHTML = ''; }
function confirmBox({title, text, yes, no = 'Cancel', onYes, bot = false}) {
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="cbT"><div class="modal">${bot ? sparky() : ''}<h2 id="cbT">${esc(title)}</h2><p>${esc(text)}</p><button class="btn btn-go btn-wide" id="cbYes">${esc(yes)}</button>${no === null ? '' : `<button class="btn btn-wide" id="cbNo">${esc(no)}</button>`}</div></div>`);
  $('#cbYes').onclick = () => { hideLayer(); onYes(); };

function go(name) {

  dock.className = 'dock hidden'; dockInner.innerHTML = ''; Q = null;

  if (name !== 'quiz') window.scrollTo(0, 0);
}

/* ---------- Home ---------- */

function tryStart(id, mode = 'full', queue = null) {
  const c = S.current;
  if (c && c.setId === id && mode === 'full') {

}
function startSet(id, mode = 'full', queue = null) {
  const f = flat(getSet(id));
  S.current = {setId:id, mode, queue: queue || f.map((_, i) => i), answers:{}, elapsed:0, started:Date.now()};
  streak = 0;

}

/* ---------- Quiz ---------- */
function startTimer() {
  stopTimer();
  let last = Date.now(), ticks = 0;
  timer = setInterval(() => { const now = Date.now(); if (S.current && !paused) { S.current.elapsed += now - last; if (++ticks % 5 === 0) save(); } last = now; }, 1000);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function openQuiz() { if (!S.current) return go('home'); paused = false; renderQuestion(); if (screen === 'quiz' && S.current) startTimer(); }
function tally(c) { let e = 0, t = 0; Object.values(c.answers).forEach(a => { e += a.e; t += a.t; }); return {e, t}; }

function renderQuestion() {

  const pct = done / c.queue.length;

  app.innerHTML = `

      ${sec === 'reading' ? `<details class="story" ${idx === firstRead ? 'open' : ''}><summary>📖 Story: ${esc(set.story.title)}</summary><div class="story-body">${canSpeak ? '<button class="btn btn-small" id="storyBtn" style="margin-bottom:.7rem">🔊 Read the story to me</button>' : ''}${set.story.text.map(p => `<p>${esc(p)}</p>`).join('')}</div></details>` : ''}
      ${fig ? `<div class="figure" id="figBox">
        <svg viewBox="${fig.box}" role="img" aria-label="${esc(fig.cap)}">${fig.svg}</svg>

  const body = $('#qbody');
  const h = TYPES[item.t](item, body, () => { const b = $('#checkBtn'); if (b) b.disabled = !h.ready(); }, cleanups);
  Q = {idx, item, sec, h, checked:false};
  const sb = $('#speakBtn'); if (sb) sb.onclick = () => speak(speakText(item));
  const stb = $('#storyBtn'); if (stb) stb.onclick = () => speak(set.story.text.join(' '));
  const mb = $('#measureBtn');
  if (mb) mb.onclick = () => { $('#figBox').classList.toggle('measured'); mb.textContent = $('#figBox').classList.contains('measured') ? '👁️ Hide the guides' : '📏 Measure it'; };
  $('#pauseBtn').onclick = pause;
  dock.className = 'dock';
  dockInner.innerHTML = `<button class="btn btn-go btn-wide" id="checkBtn" disabled>${item.t === 'draw' || item.t === 'free' ? 'Save my work' : 'Check my answer'}</button>`;
  $('#checkBtn').onclick = doCheck;
  $('#checkBtn').disabled = !h.ready();
  syncDockSpace();
}
function syncDockSpace() { const sp = $('#dockSpace'); if (sp) sp.style.height = (dock.offsetHeight + 24) + 'px'; }

function doCheck() {
  if (!Q || Q.checked || !Q.h.ready()) return;
  const c = S.current, set = getSet(c.setId), item = Q.item;
  const res = Q.h.check();
  Q.checked = true;
  c.answers[Q.idx] = {e: res.e, t: res.t};

  /* keep the child's own work */
  if (item.t === 'free' && res.response) { S.works.unshift({setId:set.id, text:res.response, date:Date.now()}); S.works = S.works.slice(0, 30); }
  if (item.t === 'draw' && res.picture) { S.gallery.unshift({setId:set.id, img:res.picture, tip:item.tip, date:Date.now()}); S.gallery = S.gallery.slice(0, 8); }

  /* counters that feed the badges */
  if (item.t === 'spell' && res.e) S.stats.spell++;
  if (item.t === 'write' && res.e === res.t) S.stats.write++;
  if (item.fig && res.e) S.stats.illusion++;
  if (item.t === 'draw') S.stats.draw++;
  if (res.t > 0) { streak = res.e === res.t ? streak + 1 : 0; if (streak > S.stats.streak) S.stats.streak = streak; }

  const earned = newBadges();
  save();

  const {e, t} = tally(c);
  const pill = $('#scorePill'); pill.textContent = `⭐ ${e}/${t}`; pill.setAttribute('aria-label', `${e} stars out of ${t}`);
  const figBox = $('#figBox'); if (figBox) figBox.classList.add('measured');

  const kind = res.t === 0 || res.e === res.t ? 'good' : res.e === 0 ? 'bad' : 'part';
  let title, body = '';
  if (item.t === 'draw') {
    title = '🎨 Brilliant design!';
    body = `<p>Your drawing is saved in My Workshop. ${res.strokes > 12 ? 'You put a lot of detail into that one!' : 'Come back any time and draw another.'}</p>`;
  } else if (item.t === 'free') {
    title = '✍️ Great writing!';
    body = `<p>${res.words} words in ${res.sentences} sentence${res.sentences === 1 ? '' : 's'}. ${res.sentences >= 2 ? 'Splitting your idea into sentences makes it easy to read.' : 'Next time try splitting your idea into two or three sentences.'} It is saved in My Workshop.</p>`;
  } else {
    title = kind === 'good' ? '✅ ' + pick(['Great job!', 'You got it!', 'Spot on!', 'Well done!', 'Brilliant!'])
      : kind === 'part' ? '🌟 ' + pick(['Almost!', 'So close!', 'Good work, nearly all of it!'])
      : '💪 ' + pick(['Nice try!', 'Good try!', 'Not quite yet.']);
    if (item.t === 'type' && res.nearly) body += `<p>You had the right word — just watch the spelling: <b>${esc(item.accept[0])}</b>.</p>`;
    if (kind !== 'good') body += `<p><span class="ans">The answer:</span><br>${res.answer}</p>`;
    else if (res.model) body += `<p><span class="ans">Another good way to say it:</span> ${res.model}</p>`;
    if (kind === 'part' && item.t === 'write') body += `<p>You found ${res.e} of the ${res.t} things. Read the question again and see what is missing.</p>`;
  }
  if (item.explain) body += `<p class="why">💡 ${esc(item.explain)}</p>`;
  if (streak === 3) body += `<p>🔥 Three right in a row!</p>`;
  else if (streak >= 6) body += `<p>🔥 ${streak} in a row — you are on fire!</p>`;
  earned.forEach(b => { body += `<div class="badge-pop"><span class="bi">${b.icon}</span><span><b>New badge: ${esc(b.name)}</b><br><small>${esc(b.desc)}</small></span></div>`; });

  const gain = res.t ? `+${res.e} of ${res.t}` : 'Saved';
  const last = c.queue.every(i => c.answers[i]);
  dock.className = 'dock ' + kind;
  dockInner.innerHTML = `<div class="fb" role="status"><h3>${title}<span class="gain">${gain}</span></h3>${body}</div>
    <button class="btn btn-go btn-wide" id="nextBtn">${last ? '🏁 See my results' : 'Next question ▶'}</button>`;
  $('#nextBtn').onclick = next;
  $('#nextBtn').focus({preventScroll:true});
  syncDockSpace();
  beep(res.t === 0 ? 'good' : kind);
  if (kind === 'good') { const b = $('.walker .bot'); if (b) { b.classList.remove('happy'); void b.offsetWidth; b.classList.add('happy'); } }
}
function next() { if (!Q || !Q.checked) return; renderQuestion(); window.scrollTo(0, 0); const f = Q && Q.h && Q.h.focus; if (f && matchMedia('(pointer: fine)').matches) f(); }

function newBadges() {
  const out = [];
  BADGES.forEach(b => { if (!S.badges.includes(b.id) && b.got(S)) { S.badges.push(b.id); out.push(b); } });
  return out;
}

function pause() {
  if (!S.current) return;
  paused = true; save();
  const {e, t} = tally(S.current);
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="modal">${sparky('sleepy')}<h2 id="pT">Paused</h2>
    <p>You have ${e} of ${t} stars so far. Your place is saved, so you can come back any time.</p>
    <button class="btn btn-go btn-wide" id="resumeBtn">▶ Keep going</button>
    <button class="btn btn-wide" id="homeBtn">Save and go home</button></div></div>`);
  $('#resumeBtn').onclick = resumeQuiz;
  $('#homeBtn').onclick = () => go('home');
}
function resumeQuiz() { paused = false; hideLayer(); }

function finishRun() {
  stopTimer();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  let e = 0, t = 0; const bySec = {};
  c.queue.forEach(i => { const a = c.answers[i], s = f[i].sec; bySec[s] = bySec[s] || {e:0, t:0}; if (a) { e += a.e; t += a.t; bySec[s].e += a.e; bySec[s].t += a.t; } });
  const pct = t ? Math.round(e / t * 100) : 0;
  const order = setOrder(), pos = orderPos(set.id), nextId = pos >= 0 && pos + 1 < order.length ? order[pos + 1] : null;
  const rec = S.sets[set.id] = S.sets[set.id] || {attempts:[], best:null};
  rec.attempts.unshift({mode:c.mode, e, t, pct, time:c.elapsed, date:Date.now()});
  rec.attempts = rec.attempts.slice(0, 20);
  if (c.mode === 'full' && (!rec.best || pct > rec.best.pct || (pct === rec.best.pct && c.elapsed < rec.best.time))) rec.best = {e, t, pct, time:c.elapsed, date:Date.now()};
  if (c.mode === 'fix') S.stats.fix++;
  S.lastRun = {setId:set.id, mode:c.mode, e, t, pct, time:c.elapsed, bySec, answers:c.answers, queue:c.queue};
  S.current = null;
  const earned = newBadges();
  S.lastRun.badges = earned.map(b => b.id);
  save();
  go('results');
}

/* ---------- Results ---------- */
function renderResults() {
  const r = S.lastRun; if (!r) return go('home');
  const set = getSet(r.setId), f = flat(set), stars = starsFor(r.pct);
  const order = setOrder(), pos = orderPos(set.id);
  const nextSet = pos + 1 < order.length ? getSet(order[pos + 1]) : null;
  const wrong = r.queue.filter(i => r.answers[i] && r.answers[i].t > 0 && r.answers[i].e < r.answers[i].t);
  const msg = r.mode === 'fix'
    ? (r.e === r.t ? 'You fixed every single mistake. Amazing!' : `You fixed ${r.e} of ${r.t}. Keep going — you are getting better!`)
    : stars === 3 ? 'Outstanding work, inventor!' : stars === 2 ? 'Really good work!' : stars === 1 ? 'Good effort — keep practising!' : 'Every inventor starts somewhere. Try again!';
  const gotBadges = (r.badges || []).map(id => BADGES.find(b => b.id === id)).filter(Boolean);
  app.innerHTML = `
    ${storageOK ? '' : '<div class="notice">⚠️ This browser would not save these results. Nothing is lost while this page stays open — open Settings and use <b>Save backup</b> to keep them.</div>'}
    <div class="result-head">
      ${sparky(stars >= 2 ? 'happy' : '')}
      <h1 id="rT" class="sr">Results</h1>
      <div class="big-stars" aria-label="${stars} of 3 stars">${[0,1,2].map(i => `<span class="${i < stars ? 'star-on' : 'star-off'}">★</span>`).join('')}</div>
      <p class="score-big">${r.e} / ${r.t}</p>
      <p>${r.pct}% — ${esc(msg)}</p>
      <p>Time: ${fmtTime(r.time)}</p>
    </div>
    ${gotBadges.length ? `<div class="card" style="margin-bottom:1rem"><h2 style="font-size:1.2rem">🎉 New badges</h2><div class="badges">${gotBadges.map(b => `<div class="badge on"><span class="bi">${b.icon}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`).join('')}</div></div>` : ''}
    <div class="card">
      <h2 style="font-size:1.25rem">How each part went</h2>
      <div class="bars">${Object.keys(SECTIONS).filter(k => r.bySec[k] && r.bySec[k].t).map(k => {
        const b = r.bySec[k], p = Math.round(b.e / b.t * 100);
        return `<div class="bar-row"><span>${SECTIONS[k].icon} ${SECTIONS[k].name}</span><span>${b.e}/${b.t}</span><span class="bar"><i style="width:${p}%"></i></span></div>`;
      }).join('')}</div>
      ${wrong.length ? `<div class="review"><details><summary>🔎 Look again at ${wrong.length} question${wrong.length === 1 ? '' : 's'}</summary><ol>${wrong.map(i => {
        const it = f[i].item;
        return `<li><b>${esc(questionLabel(it))}</b><br>Answer: ${esc(answerText(it))}${it.explain ? `<br><span style="color:var(--ink-soft)">💡 ${esc(it.explain)}</span>` : ''}</li>`;
      }).join('')}</ol></details></div>` : ''}
      <div class="stack" style="margin-top:1.2rem">
        ${wrong.length ? `<button class="btn btn-go btn-wide" id="fixBtn">🔁 Fix my mistakes (${wrong.length})</button>` : ''}
        ${nextSet
          ? `<button class="btn ${wrong.length ? 'btn-sun' : 'btn-go'} btn-wide" id="upBtn">⬆ Next set: ${nextSet.emoji} ${esc(nextSet.title)}</button>`
          : `<p class="tip" style="text-align:center">You have reached the last set in your lab! 🏁</p>`}
        <button class="btn btn-wide" id="againBtn">Try the whole set again</button>
        <button class="btn btn-wide" id="homeBtn2">🏠 Home</button>
      </div>
    </div>`;
  if (wrong.length) $('#fixBtn').onclick = () => startSet(set.id, 'fix', wrong);
  if (nextSet) $('#upBtn').onclick = () => tryStart(nextSet.id);
  $('#againBtn').onclick = () => startSet(set.id, 'full');
  $('#homeBtn2').onclick = () => go('home');
}

/* ---------- My results ---------- */
function renderHistory() {
  const order = setOrder();
  const any = order.some(id => S.sets[id] && S.sets[id].attempts.length);
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>🏆 My results</h1></div>
    <div class="hist">
      <section class="card">
        <h2 style="font-size:1.3rem">Badges (${S.badges.length} of ${BADGES.length})</h2>
        <div class="badges">${BADGES.map(b => {
          const on = S.badges.includes(b.id);
          return `<div class="badge ${on ? 'on' : 'off'}"><span class="bi">${b.icon}</span><b>${on ? esc(b.name) : 'Locked'}</b><small>${esc(b.desc)}</small></div>`;
        }).join('')}</div>
      </section>
      ${!any ? `<div class="card"><p style="margin:0;font-size:1.15rem">No results yet. Pick a set on the home page and start inventing!</p></div>` : ''}
      ${order.map((id, pos) => {
        const set = getSet(id), rec = S.sets[id];
        if (!rec || !rec.attempts.length) return '';
        return `<section class="card"><h2 style="font-size:1.3rem">${set.emoji} Set ${pos + 1}: ${esc(set.title)}</h2>
          <p style="margin:.3rem 0">${rec.best ? `Best score: <b>${rec.best.e} of ${rec.best.t}</b> (${rec.best.pct}%) ${starRow(starsFor(rec.best.pct))}` : 'Not finished as a whole set yet'}</p>
          <div class="scroll-x"><table><thead><tr><th>When</th><th>Type</th><th>Score</th><th>Time</th></tr></thead><tbody>
            ${rec.attempts.slice(0, 8).map(a => `<tr><td>${fmtDate(a.date)}</td><td>${a.mode === 'fix' ? 'Fix mistakes' : 'Whole set'}</td><td>${a.e}/${a.t} (${a.pct}%)</td><td>${fmtTime(a.time)}</td></tr>`).join('')}
          </tbody></table></div></section>`;
      }).join('')}
      ${S.gallery.length ? `<section class="card"><h2 style="font-size:1.3rem">🎨 My Workshop — drawings</h2>
        <div class="gallery">${S.gallery.map(g => `<figure><img src="${g.img}" alt="A drawing made on ${fmtDate(g.date)}"><figcaption>${fmtDate(g.date)}</figcaption></figure>`).join('')}</div></section>` : ''}
      ${S.works.length ? `<section class="card"><h2 style="font-size:1.3rem">✍️ My Workshop — writing</h2>${S.works.map(p => `<div class="work-card">${esc(p.text)}</div><p class="tip" style="margin:.3rem 0 0">${esc(getSet(p.setId) ? getSet(p.setId).title : 'Set ' + p.setId)}, ${fmtDate(p.date)}</p>`).join('')}</section>` : ''}
    </div>`;
  $('#backBtn').onclick = () => go('home');
}

/* ---------- Settings ---------- */
function renderSettings() {
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${String(S.settings[key]) === String(v)}">${l}</button>`).join('')}</div>`;
  const order = setOrder();
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>⚙️ Settings</h1></div>
    <div class="card">
      <div class="setting"><div><b>Text size</b><small>Bigger text is easier on young eyes.</small></div>${seg('size', [['normal', 'Big'], ['big', 'Bigger']])}</div>
      <div class="setting"><div><b>Colours</b><small>Dark is gentle at night.</small></div>${seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}</div>
      <div class="setting"><div><b>Sounds</b><small>Little chimes for right and wrong answers.</small></div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
      <div class="setting"><div><b>Backup progress</b><small>Saves a file with stars, badges, writing and drawings.</small></div><button class="btn btn-small" id="exportBtn">Save backup</button></div>
      <div class="setting"><div><b>Restore progress</b><small>Load a backup from another device or an earlier day.</small></div><button class="btn btn-small" id="importBtn">Load backup</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>
      <div class="setting"><div><b>Clear all progress</b><small>Removes scores, badges, workshop and any paused set.</small></div><button class="btn btn-small" id="resetBtn">Clear progress</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">This learner's set order</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Each new learner gets the sets in their own shuffled order, and that order then stays the same for ever, on every visit. This device is using:</p>
      <p style="margin:.5rem 0 0;font-size:1.05rem">${order.map((id, i) => `<b>${i + 1}.</b> ${getSet(id).emoji} ${esc(getSet(id).title)}`).join(' &nbsp; ')}</p>
      <div class="setting" style="border:0"><div><b>Give a new order</b><small>Only for a different child sharing this device. It also clears their progress.</small></div><button class="btn btn-small" id="reshuffleBtn">Shuffle again</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">How scoring works</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Each question counts the first answer. Sorting, matching, ordering and gap-filling give one star per part, and a written answer gives one star for each thing it needed to mention. Drawings and free writing always count as finished — they are saved in My Workshop rather than marked. "Fix my mistakes" repeats only what was missed; the best score always comes from a whole-set try.</p>
    </div>
    <div class="card" style="margin-top:1rem" id="storeCard">
      <h2 style="font-size:1.2rem">Where the stars are kept</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Progress lives in this device's browser. It is not sent anywhere and no account is needed.</p>
      <div id="iosNote"></div>
    </div>`;
  $('#backBtn').onclick = () => go('home');
  $$('.seg button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; let v = b.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S.settings[k] = v; save(); applySettings(); renderSettings();
    const again = $(`.seg button[data-k="${k}"][data-v="${b.dataset.v}"]`); if (again) again.focus();
  });
  $('#reshuffleBtn').onclick = () => confirmBox({
    title:'Give a new set order?',
    text:'This is for a different child using the same device. It picks a fresh order and clears the stars, badges and workshop on this device.',
    yes:'Yes, new learner', no:'Cancel',
    onYes(){ const keep = S.settings; S = fresh(); S.settings = keep; S.seed = (Math.random() * 4294967296) >>> 0; setOrder(); save(); go('home'); }
  });
  const installed = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const onIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const note = $('#iosNote');
  if (note) {
    if (onIOS && !installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:.7rem .9rem">' +
        '<b>Worth doing:</b> add this page to the Home Screen (Share → Add to Home Screen) and open it from that icon. ' +
        'Safari erases saved progress after about a week of not visiting. Home Screen apps keep theirs.</p>';
    } else if (installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;color:var(--ink-soft)">Running from the Home Screen — progress is kept safely.</p>';
    }
  }

  $('#exportBtn').onclick = () => {
    try {
      const stamp = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'inventors-lab-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      confirmBox({title:'Could not save', text:'This browser would not let the file be saved.', yes:'OK', no:null, onYes(){}});
    }
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(String(r.result)); } catch (e) {}
      if (!d || typeof d !== 'object' || typeof d.sets !== 'object' || d.sets === null) {
        confirmBox({title:'That file did not fit', text:'It is not an Inventors Lab backup. Look for a file named inventors-lab-....json', yes:'OK', no:null, onYes(){}});
        return;
      }
      const done = Object.keys(d.sets).length, works = Array.isArray(d.works) ? d.works.length : 0, pics = Array.isArray(d.gallery) ? d.gallery.length : 0;
      const bits = [done + ' set' + (done === 1 ? '' : 's') + ' started', works + ' piece' + (works === 1 ? '' : 's') + ' of writing', pics + ' drawing' + (pics === 1 ? '' : 's')];
      if (d.current) bits.push('a paused set');
      confirmBox({
        title:'Load this backup?',
        text:'It has ' + bits.join(', ') + '. This replaces what is on this device now.',
        yes:'Yes, load it', no:'Cancel',
        onYes(){
          S = Object.assign(fresh(), d);
          S.settings = Object.assign(fresh().settings, d.settings || {});
          S.stats = Object.assign(freshStats(), d.stats || {});
          if (S.seed === null || S.seed === undefined) S.seed = (Math.random() * 4294967296) >>> 0;
          setOrder(); save(); applySettings(); go('home');
        }
      });
    };
    r.readAsText(f);
  };
  $('#resetBtn').onclick = () => confirmBox({
    title:'Clear all progress?',
    text:'Scores, badges, workshop and paused sets will be removed. The set order and the settings stay the same.',
    yes:'Yes, clear everything', no:'Cancel',
    onYes(){ const keep = S.settings, seed = S.seed, order = S.order; S = fresh(); S.settings = keep; S.seed = seed; S.order = order; save(); go('home'); }
  });
}

/* ---------- Global events ---------- */
document.addEventListener('keydown', e => {
  if (layer.innerHTML) { if (e.key === 'Escape') { if (paused) resumeQuiz(); else hideLayer(); } return; }
  if (screen !== 'quiz' || !Q) return;
  const tag = e.target.tagName;
  if (!Q.checked && Q.h.onKey && tag !== 'TEXTAREA' && tag !== 'INPUT' && !e.ctrlKey && !e.metaKey && !e.altKey) { if (Q.h.onKey(e)) { e.preventDefault(); return; } }
  if (e.key === 'Enter' && (tag === 'INPUT' || e.target === document.body)) {
    e.preventDefault();
    if (Q.checked) next(); else doCheck();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) return; if (screen === 'quiz') pause(); else save(); });
window.addEventListener('resize', syncDockSpace);
window.addEventListener('pagehide', save);

load(); applySettings(); save(); go('home');

/* ---------- Offline support ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
