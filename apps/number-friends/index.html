<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Number Friends</title>
<meta name="description" content="Counting, adding, taking away and finding the missing number, for Year 1.">
<meta name="theme-color" content="#B4530E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learning">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/favicon-64.png" sizes="64x64">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF2E7; --paper:#FFFCF7; --paper-2:#FAF0E2; --ink:#3A2415; --ink-soft:#7A5A43; --line:#E0CAAE;
  --leaf:#B4530E; --leaf-deep:#8A3E09; --leaf-soft:#FBE3D0; --on-leaf:#FFFFFF;
  --sun:#C98A00; --sun-soft:#FBEBC4; --sun-deep:#8F6200;
  --sky:#2F76A8; --sky-soft:#DCEBF6;
  --berry:#B23F4B; --berry-soft:#F8DEE0;
  --bark:#B39A7E;
  --owl:#D79A3E; --owl-dark:#8A5A18; --owl-tum:#F6E2BE;
  --overlay:rgba(48,28,12,.58);
  --read:'Andika','Trebuchet MS',Verdana,system-ui,sans-serif;
  --round:'Fredoka','Andika','Trebuchet MS',system-ui,sans-serif;
  font-size:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241A12; --paper:#31241A; --paper-2:#3C2D20; --ink:#F6E9DC; --ink-soft:#CBB09A; --line:#5C4634;
    --leaf:#F0A068; --leaf-deep:#C77B45; --leaf-soft:#4A2A15; --on-leaf:#241208;
    --sun:#EDBB55; --sun-soft:#4A3718; --sun-deep:#B98A2C;
    --sky:#72B6E2; --sky-soft:#1E3A4B;
    --berry:#EC8490; --berry-soft:#4C2A30;
    --bark:#8A7460;
    --owl:#C98A3A; --owl-dark:#F0C68A; --owl-tum:#5A4227;
    --overlay:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241A12; --paper:#31241A; --paper-2:#3C2D20; --ink:#F6E9DC; --ink-soft:#CBB09A; --line:#5C4634;
  --leaf:#F0A068; --leaf-deep:#C77B45; --leaf-soft:#4A2A15; --on-leaf:#241208;
  --sun:#EDBB55; --sun-soft:#4A3718; --sun-deep:#B98A2C;
  --sky:#72B6E2; --sky-soft:#1E3A4B;
  --berry:#EC8490; --berry-soft:#4C2A30;
  --bark:#8A7460;
  --owl:#C98A3A; --owl-dark:#F0C68A; --owl-tum:#5A4227;
  --overlay:rgba(0,0,0,.62);
  color-scheme:dark;
}
:root[data-size="big"]{font-size:23px}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--read);line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--round);line-height:1.15;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:1rem 1rem 2rem}
.hidden{display:none!important}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.1rem;padding:.4rem 1.4rem;border-radius:999px;border:3px solid var(--line);background:var(--paper);font-family:var(--round);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s;text-decoration:none;user-select:none}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf);box-shadow:0 5px 0 var(--leaf-deep)}
.btn-go:active:not(:disabled){box-shadow:0 2px 0 var(--leaf-deep)}
.btn-sun{background:var(--sun-soft);border-color:var(--sun);box-shadow:0 4px 0 var(--sun)}
.btn-wide{width:100%}
.btn-icon{width:3.1rem;padding:0;flex:none;font-size:1.3rem}
.btn-small{min-height:2.5rem;font-size:.9rem;padding:.2rem 1rem;box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:.75rem}

/* Hoot the owl, this activity’s mascot */
.ow-branch{stroke:var(--bark);stroke-width:7;stroke-linecap:round;fill:none}
.ow-body{fill:var(--owl);stroke:var(--owl-dark);stroke-width:3.5}
.ow-tuft{fill:var(--owl);stroke:var(--owl-dark);stroke-width:3.5;stroke-linejoin:round}
.ow-wing{fill:var(--owl-dark);opacity:.3;stroke:none}
.ow-tum{fill:var(--owl-tum);stroke:none}
.ow-eye{fill:#FFFFFF;stroke:var(--owl-dark);stroke-width:3}
.ow-pupil{fill:#2A1B0C}
.ow-beak{fill:var(--sun-deep);stroke:var(--owl-dark);stroke-width:2;stroke-linejoin:round}
.ow-foot{fill:none;stroke:var(--sun-deep);stroke-width:4;stroke-linecap:round}
.mascot{transition:filter .4s}
.mascot.happy{animation:hop .6s ease}
.mascot.happy .ow-tuft{animation:spin .6s ease;transform-origin:65px 26px}
.mascot.sleepy .ow-pupil{display:none}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-4deg)}65%{transform:translateY(0)}80%{transform:translateY(-4px)}}
@keyframes spin{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:1rem;padding:1.25rem 0 .5rem}
.hero h1{font-size:2.5rem;font-weight:700;letter-spacing:-.5px}
.hero p{margin:.4rem 0 0;color:var(--ink-soft);font-size:1.1rem;max-width:30ch}
.hero .mascot{width:clamp(120px,26vw,185px);height:auto;display:block}
.notice{background:var(--sun-soft);border:3px solid var(--sun);border-radius:20px;padding:.9rem 1.1rem;margin:1rem 0}
.resume{background:var(--sky-soft);border:3px solid var(--sky);border-radius:24px;padding:1.1rem 1.2rem;margin:1rem 0;display:grid;gap:.75rem}
.resume h2{font-size:1.35rem}
.resume p{margin:0;color:var(--ink-soft)}
.sets{display:grid;gap:1rem;margin-top:1.25rem}
.sets h2.label{font-size:1.4rem}
.setcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1rem;align-items:center;text-align:left;width:100%;padding:1rem 1.1rem;border-radius:26px;border:3px solid var(--line);background:var(--paper);cursor:pointer;box-shadow:0 5px 0 var(--line)}
.setcard:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.setcard .emoji{font-size:2.4rem;width:3.6rem;height:3.6rem;display:grid;place-items:center;border-radius:18px;background:var(--paper-2)}
.setcard .sc-title{font-family:var(--round);font-weight:600;font-size:1.3rem;line-height:1.2}
.setcard .meta{color:var(--ink-soft);font-size:.95rem}
.setcard .go{font-family:var(--round);font-weight:600;color:var(--leaf);font-size:1rem;white-space:nowrap}
.chal{display:inline-block;font-family:var(--round);font-weight:600;font-size:.78rem;padding:.05rem .5rem;border-radius:999px;background:var(--sun-soft);border:2px solid var(--sun);color:var(--sun-deep);margin-left:.4rem;vertical-align:middle}
.stars{display:inline-flex;gap:2px;font-size:1.1rem;letter-spacing:1px}
.star-on{color:var(--sun)}
.star-off{color:var(--line)}
.homefoot{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.result-head .mascot{width:150px;height:auto;display:block;margin:0 auto .5rem}

/* Knowledge list */
.knows{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.know{font-size:.85rem;background:var(--paper-2);border:2px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--ink-soft)}

/* Quiz top */
.topbar{display:flex;align-items:center;gap:.75rem;position:sticky;top:0;z-index:20;background:var(--bg);padding:.6rem 0 .4rem}
.topbar .where{flex:1;min-width:0}
.topbar .where b{font-family:var(--round);font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .where span{color:var(--ink-soft);font-size:.9rem}
.pill{font-family:var(--round);font-weight:600;background:var(--sun-soft);border:3px solid var(--sun);border-radius:999px;padding:.25rem .85rem;white-space:nowrap}
.pill.fire{background:var(--berry-soft);border-color:var(--berry);animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.track-wrap{position:relative;height:3.4rem;margin:.2rem 0 .6rem}
.track-wrap .track{position:absolute;left:0;right:0;bottom:.55rem;height:12px;border-radius:99px;background:var(--bark);opacity:.35}
.track-wrap .fill{position:absolute;left:0;bottom:.55rem;height:12px;border-radius:99px;background:var(--leaf);transition:width .5s ease}
.track-wrap .walker{position:absolute;bottom:.3rem;width:3.6rem;transform:translateX(-50%);transition:left .5s ease}
.track-wrap .walker .ow-branch{display:none}
.track-wrap .goal{position:absolute;right:-.2rem;bottom:.6rem;font-size:1.4rem}

/* Question card */
.card{background:var(--paper);border:3px solid var(--line);border-radius:30px;padding:1.2rem 1.2rem 1.5rem;box-shadow:0 6px 0 var(--line)}
.sec-tag{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--round);font-weight:600;font-size:.95rem;padding:.2rem .8rem;border-radius:999px;background:var(--paper-2);border:2px solid var(--line);color:var(--ink-soft)}
.prompt{display:flex;gap:.75rem;align-items:flex-start;margin:.9rem 0 1rem}
.prompt h2{font-size:1.35rem;font-weight:600;flex:1}
.speak{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;border:3px solid var(--sky);background:var(--sky-soft);cursor:pointer;font-size:1.15rem;display:grid;place-items:center}
.qtext{font-size:1.45rem;line-height:1.6;margin:0 0 1.1rem}
.blank{display:inline-block;min-width:4.6em;border-bottom:4px dashed var(--sky);text-align:center;color:var(--sky);font-weight:700;padding:0 .2em}
.blank.filled{border-bottom-style:solid}

/* Choice */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.8rem}
.opts.long{grid-template-columns:1fr}
.opt{min-height:4rem;border-radius:20px;border:3px solid var(--line);background:var(--paper-2);font-size:1.3rem;font-weight:700;cursor:pointer;padding:.5rem 1rem;box-shadow:0 4px 0 var(--line);text-align:center;display:flex;align-items:center;justify-content:center;gap:.5rem;flex-direction:column}
.opts.long .opt{font-size:1.15rem;text-align:left;align-items:flex-start;font-weight:400}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 4px 0 var(--sky)}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 4px 0 var(--leaf)}
.opt.no{border-color:var(--berry);background:var(--berry-soft);box-shadow:0 4px 0 var(--berry)}
.opts.multi{grid-template-columns:1fr}
.opts.multi .opt{flex-direction:row;justify-content:flex-start;gap:.7rem;text-align:left;font-weight:400;font-size:1.12rem}
.tickbox{flex:none;width:2rem;height:2rem;border-radius:8px;border:3px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:1.15rem;font-weight:700;color:var(--leaf-deep);line-height:1}
.opt.sel .tickbox{border-color:var(--sky);background:var(--sky-soft)}
.opt.ok .tickbox{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.no .tickbox{border-color:var(--berry);background:var(--berry-soft)}
.opt .should{margin-left:auto;font-size:.85rem;color:var(--ink-soft);white-space:nowrap;font-family:var(--round)}

/* Chips, bins, blanks */
.bank{display:flex;flex-wrap:wrap;gap:.65rem;justify-content:center;min-height:4rem;padding:.8rem;border-radius:22px;background:var(--paper-2);border:3px dashed var(--line);margin-bottom:1rem}
.bank-label{width:100%;text-align:center;color:var(--ink-soft);font-size:.9rem}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:3.2rem;min-width:3.2rem;padding:.2rem 1.05rem;border-radius:16px;background:var(--sun-soft);border:3px solid var(--sun);font-size:1.2rem;font-weight:700;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 var(--sun)}
.chip.sel{background:var(--sky-soft);border-color:var(--sky);box-shadow:0 0 0 4px var(--sky)}
.chip.dragging{opacity:.3}
.chip.ok{background:var(--leaf-soft);border-color:var(--leaf);box-shadow:0 4px 0 var(--leaf)}
.chip.no{background:var(--berry-soft);border-color:var(--berry);box-shadow:0 4px 0 var(--berry)}
.ghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;transform:translate(-50%,-60%) scale(1.1);opacity:.95}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.9rem}
.bin{min-height:9rem;border:3px dashed var(--line);border-radius:22px;padding:.7rem;display:flex;flex-direction:column;gap:.6rem;cursor:pointer}
.bin h3{font-size:1.05rem;text-align:center}
.bin .hint{font-size:.85rem;color:var(--ink-soft);text-align:center;margin-top:-.4rem}
.bin .inside{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.over{border-color:var(--sky)!important;background:var(--sky-soft)!important}
.poemtext{font-size:1.25rem;line-height:1.5;margin:0}
.poemtext .line{display:block;margin:0 0 .9rem}
.nowrap{white-space:nowrap}
.slot{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:5.5rem;min-height:3.2rem;margin:0 .15rem;border-bottom:4px dashed var(--sky);border-radius:12px 12px 4px 4px;background:var(--sky-soft);cursor:pointer;line-height:1.2}
.slot .chip{box-shadow:none}

/* Order (drag to sequence) */
.orderlist{display:grid;gap:.6rem;margin-bottom:.8rem}
.ord{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.6rem .8rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);font-size:1.05rem;line-height:1.35;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;text-align:left}
.ord .num{font-family:var(--round);font-weight:700;width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;background:var(--sun-soft);border:2px solid var(--sun);flex:none;font-size:.95rem}
.ord.dragging{opacity:.35}
.ord.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.ord.no{border-color:var(--berry);background:var(--berry-soft)}
.ord-move{display:flex;flex-direction:column;gap:.2rem}
.ord-move button{width:2.1rem;height:1.6rem;border-radius:8px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:.8rem;line-height:1;padding:0}
.ord-move button:disabled{opacity:.3;cursor:default}

/* Match lines */
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:clamp(2.6rem,11vw,6rem)}
.match-col{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-content:stretch;position:relative;z-index:2}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.m-item{position:relative;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:.5rem;min-height:4rem;padding:.45rem .8rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;font-size:1.05rem;line-height:1.3}
.m-item.left{font-weight:700;font-size:1.15rem}
.m-item.right{padding-left:1.15rem}
.m-item .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--paper);border:4px solid var(--ink-soft);transform:translateY(-50%)}
.m-item.left .dot{right:-11px}
.m-item.right .dot{left:-11px}
.m-item.sel{border-color:var(--sky);background:var(--sky-soft)}
.m-item.linked .dot{background:var(--sky);border-color:var(--sky)}
.m-item.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.m-item.no{border-color:var(--berry);background:var(--berry-soft)}
.m-item.ok .dot{background:var(--leaf);border-color:var(--leaf)}
.m-item.no .dot{background:var(--berry);border-color:var(--berry)}
.lines path{fill:none;stroke-width:5;stroke-linecap:round}

/* Tick-or-cross grid */
.gridq{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gridq table{border-collapse:separate;border-spacing:4px;margin:0 auto}
.gridq th{font-family:var(--round);font-weight:600;font-size:.88rem;line-height:1.2;color:var(--ink-soft);padding:.2rem .3rem;vertical-align:bottom;max-width:7.5rem;min-width:4.6rem}
.gridq th.rowhead{text-align:right;vertical-align:middle;color:var(--ink);font-size:1.05rem;white-space:nowrap;padding-right:.5rem}
.cell{width:3.4rem;height:3.4rem;border-radius:14px;border:3px solid var(--line);background:var(--paper-2);font-size:1.5rem;font-weight:700;cursor:pointer;padding:0;line-height:1}
.cell.tick{color:var(--leaf-deep);border-color:var(--leaf);background:var(--leaf-soft)}
.cell.cross{color:var(--berry);border-color:var(--berry);background:var(--berry-soft)}
.cell.ok{box-shadow:inset 0 0 0 3px var(--leaf)}
.cell.no{box-shadow:inset 0 0 0 3px var(--berry);opacity:.85}
.cell .mark-was{display:block;font-size:.65rem;font-weight:400;color:var(--ink-soft)}

/* True / false rows */
.tflist{display:grid;gap:.7rem}
.tfrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.6rem .8rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);font-size:1.08rem;line-height:1.35}
.tfrow.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.tfrow.no{border-color:var(--berry);background:var(--berry-soft)}
.tfbtns{display:flex;gap:.4rem;flex:none}
.tfbtns button{min-width:4rem;min-height:2.8rem;border-radius:14px;border:3px solid var(--line);background:var(--paper);font-family:var(--round);font-weight:600;cursor:pointer;font-size:.95rem}
.tfbtns button[aria-pressed="true"]{background:var(--sky-soft);border-color:var(--sky)}
.tfbtns button:disabled{cursor:default}
.tfrow.ok .tfbtns button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.tfrow.no .tfbtns button[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:#fff}

/* Spell */
.boxes{display:grid;gap:.35rem;justify-content:center;margin:.5rem 0 1.2rem}
.box{width:100%;aspect-ratio:.8;padding:0;border-radius:12px;border:3px solid var(--line);background:var(--paper-2);display:grid;place-items:center;font-size:1.6em;font-weight:700;cursor:pointer;color:var(--ink)}
.box.next{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft)}
.box.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.box.no{border-color:var(--berry);background:var(--berry-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center}
.tile{width:3.2rem;height:3.2rem;border-radius:14px;border:3px solid var(--sun);background:var(--sun-soft);font-size:1.6rem;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--sun)}
.tile:disabled{opacity:.25;cursor:default;box-shadow:none}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sun)}
.clue{font-size:1.3rem;line-height:1.6;background:var(--paper-2);border-radius:20px;padding:.9rem 1.1rem;margin:0 0 1rem;border-left:8px solid var(--sun)}

/* Type */
.write{width:100%;font-family:var(--read);font-size:1.35rem;padding:.8rem 1rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2);color:var(--ink);line-height:1.5}
.write:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-soft)}
.tip{color:var(--ink-soft);font-size:1rem;margin:.6rem 0 0}
.typeline{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.typeline .write{flex:1;min-width:10rem}
.hintbox{margin:.7rem 0 0;background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:.6rem .9rem;font-size:1.05rem}

/* A number sentence, big enough to read across the room, with a tappable box */
.sentence{font-family:var(--round);font-weight:700;font-size:clamp(2rem,8.5vw,3rem);text-align:center;
  margin:.4rem 0 1.1rem;line-height:1.5;display:flex;flex-wrap:wrap;gap:.3em;justify-content:center;align-items:center}
.sbox{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:1.5em;
  border:4px dashed var(--sky);border-radius:16px;background:var(--paper);color:var(--sky)}
.sbox.filled{border-style:solid;background:var(--sky-soft);color:var(--ink)}
.sbox.ok{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink)}
.sbox.no{border-style:solid;border-color:var(--berry);background:var(--berry-soft);color:var(--ink)}
.story-line{font-size:1.3rem;text-align:center;margin:0 0 .2rem}

/* Number keys. A six-year-old should never have to find a keyboard. */
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;max-width:26rem;margin:0 auto}
.numkey{font-family:var(--round);font-weight:700;font-size:1.6rem;min-height:3.4rem;border-radius:16px;
  border:3px solid var(--line);background:var(--paper-2);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.numkey.clear{grid-column:1/-1;font-size:1.1rem;min-height:2.9rem}
.numkey:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.numkey[disabled]{opacity:.45;cursor:default;box-shadow:none;transform:none}

/* Ten-frames: counting is easier when the pictures sit in fives */
.frames{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;margin:0 0 1rem}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--paper-2);
  border:3px solid var(--line);border-radius:18px;padding:6px}
.fcell{position:relative;width:2.7rem;height:2.7rem;display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;line-height:1;background:var(--paper);border-radius:11px;border:2px solid var(--line)}
.fcell.empty{background:transparent;border-style:dashed;opacity:.65}
.fpic{line-height:1}
.fcell.gone .fpic{opacity:.3}
.fcell.gone::before,.fcell.gone::after{content:'';position:absolute;left:8%;right:8%;top:calc(50% - 2.5px);
  height:5px;border-radius:3px;background:var(--berry)}
.fcell.gone::before{transform:rotate(40deg)}
.fcell.gone::after{transform:rotate(-40deg)}

/* Part, part, whole */
.bondwrap{display:block;width:min(100%,19rem);height:auto;margin:0 auto 1rem}
.bond-link{fill:none;stroke:var(--line);stroke-width:6;stroke-linecap:round}
.bond-ring{fill:var(--paper-2);stroke:var(--leaf);stroke-width:4}
.bond-hole{fill:var(--paper);stroke:var(--sky);stroke-width:4;stroke-dasharray:9 8}
.bond-hole.ok{stroke:var(--leaf);stroke-dasharray:none}
.bond-hole.no{stroke:var(--berry);stroke-dasharray:none}
.bond-num{fill:var(--ink);font-family:var(--round);font-weight:700;font-size:30px}

/* Drawing pad */
.padwrap{display:grid;gap:.7rem}
.pad{width:100%;aspect-ratio:3/2;border-radius:20px;border:3px solid var(--line);background:#FFFFFF;touch-action:none;cursor:crosshair;display:block}
.padtools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:center}
.swatch{width:2.5rem;height:2.5rem;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--sky);border-color:var(--paper)}
.padnote{color:var(--ink-soft);font-size:.95rem;text-align:center;margin:0}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.7rem;margin-top:.7rem}
.badge{display:grid;gap:.15rem;justify-items:center;text-align:center;padding:.7rem .5rem;border-radius:18px;border:3px solid var(--line);background:var(--paper-2)}
.badge.on{border-color:var(--sun);background:var(--sun-soft)}
.badge .bi{font-size:1.9rem;line-height:1}
.badge.off .bi{filter:grayscale(1);opacity:.35}
.badge b{font-family:var(--round);font-size:.95rem;font-weight:600}
.badge small{color:var(--ink-soft);font-size:.8rem;line-height:1.25}
.badge-pop{display:flex;gap:.6rem;align-items:center;background:var(--sun-soft);border:3px solid var(--sun);border-radius:18px;padding:.5rem .8rem;margin:.6rem 0 0}
.badge-pop .bi{font-size:1.8rem}

/* Bottom sheet */
.dock-space{height:9rem}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:3px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom))}
.dock .inner{max-width:820px;margin:0 auto}
.dock.good{background:var(--leaf-soft);border-color:var(--leaf)}
.dock.bad{background:var(--berry-soft);border-color:var(--berry)}
.dock.part{background:var(--sun-soft);border-color:var(--sun)}
.fb{max-height:48vh;overflow:auto;margin-bottom:.8rem}
.fb h3{font-size:1.45rem;display:flex;gap:.5rem;align-items:center}
.fb .gain{font-family:var(--round);font-size:1rem;font-weight:600;margin-left:auto;white-space:nowrap}
.fb p{margin:.45rem 0 0;font-size:1.1rem;line-height:1.55}
.fb .ans{font-weight:700}
.fb .why{background:var(--paper);border-radius:14px;padding:.5rem .8rem;margin-top:.6rem!important}

/* Overlay & modal */
.overlay{position:fixed;inset:0;z-index:100;background:var(--overlay);display:grid;place-items:center;padding:1rem}
.modal{background:var(--paper);border-radius:30px;border:3px solid var(--line);padding:1.5rem;max-width:30rem;width:100%;text-align:center;display:grid;gap:1rem;max-height:92vh;overflow:auto}
.modal h2{font-size:1.6rem}
.modal p{margin:0;font-size:1.1rem;color:var(--ink-soft)}
.modal .mascot{width:150px;margin:0 auto;display:block}

/* Results */
.result-head{text-align:center;padding:1rem 0}
.big-stars{font-size:3.4rem;letter-spacing:.3rem;line-height:1}
.big-stars span{display:inline-block}
.big-stars .star-on{animation:pop .5s both}
.big-stars span:nth-child(2){animation-delay:.2s}
.big-stars span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.result-head .score-big{font-family:var(--round);font-size:2.6rem;font-weight:700;margin:.4rem 0 0}
.result-head p{margin:.3rem 0;font-size:1.15rem;color:var(--ink-soft)}
.bars{display:grid;gap:.9rem;margin:1rem 0}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;align-items:center;font-size:1.05rem}
.bar{grid-column:1/-1;height:16px;border-radius:99px;background:var(--paper-2);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.review{margin-top:1rem}
.review details{border:3px solid var(--line);border-radius:20px;background:var(--paper-2);padding:.4rem 1rem}
.review summary{cursor:pointer;font-family:var(--round);font-weight:600;padding:.4rem 0}
.review li{margin:.6rem 0;font-size:1.05rem}
.review ol{padding-left:1.3rem}

/* History & settings */
.page-head{display:flex;align-items:center;gap:.75rem;padding:.8rem 0}
.page-head h1{font-size:1.8rem;flex:1}
.hist{display:grid;gap:1rem}
.hist .card{padding:1rem 1.1rem}
.hist table{width:100%;border-collapse:collapse;font-size:1rem;margin-top:.5rem}
.hist td,.hist th{text-align:left;padding:.35rem .3rem;border-bottom:2px solid var(--paper-2)}
.hist th{color:var(--ink-soft);font-weight:400;font-size:.9rem}
.scroll-x{overflow-x:auto}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:.8rem;margin-top:.6rem}
.gallery figure{margin:0}
.gallery img{width:100%;border-radius:16px;border:3px solid var(--line);background:#fff;display:block}
.gallery figcaption{color:var(--ink-soft);font-size:.85rem;margin-top:.25rem;text-align:center}
.setting{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:2px solid var(--paper-2);flex-wrap:wrap}
.setting b{font-family:var(--round);font-weight:600;font-size:1.1rem}
.setting small{display:block;color:var(--ink-soft);font-size:.9rem}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.45rem .95rem;cursor:pointer;font-family:var(--round);font-weight:600;min-height:2.6rem}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf)}

@media (max-width:520px){
  :root{font-size:18px}
  :root[data-size="big"]{font-size:21px}
  .hero h1{font-size:2rem}
  .card{padding:1rem .8rem 1.2rem;border-radius:24px}
  .setcard{grid-template-columns:auto minmax(0,1fr)}
  .setcard .go{grid-column:1/-1;text-align:right}
  .m-item{font-size:.96rem;padding:.4rem .55rem}
  .m-item.left{font-size:1rem;text-align:center;justify-content:center}
  .match{column-gap:2.4rem}
  .qtext{font-size:1.28rem}
  .ord{font-size:.96rem;padding:.5rem .6rem;gap:.5rem}
  .tfrow{font-size:.98rem;grid-template-columns:1fr;gap:.5rem}
  .tfbtns{justify-content:flex-end}
  /* a four-column tick table has to fit a phone without sideways scrolling */
  .cell{width:2.4rem;height:2.4rem;font-size:1.1rem;border-width:2px;border-radius:10px}
  .gridq table{border-spacing:3px}
  .gridq th{font-size:.66rem;width:2.9rem;min-width:0;max-width:none;padding:.12rem .08rem;overflow-wrap:anywhere}
  .gridq th.rowhead{font-size:.85rem;width:3.4rem;padding-right:.3rem;white-space:normal}
  /* two ten-frames still have to sit side by side on a phone */
  .fcell{width:2.1rem;height:2.1rem;font-size:1.25rem;border-radius:9px}
  .frame{gap:3px;padding:4px;border-radius:14px}
  .frames{gap:.6rem}
  .numpad{gap:.4rem}
  .numkey{font-size:1.4rem;min-height:3rem;border-radius:13px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<main id="app" class="wrap" aria-live="polite"></main>
<div id="dock" class="dock hidden"><div class="inner" id="dockInner"></div></div>
<div id="layer"></div>
<script>
/* ==========================================================================
   CONTENT — five sets of Year 1 maths, built from the P.1 workbook pages on
   finding a missing number. The workbook teaches four separate rules; they
   are really one rule, and the app says so every time:

     the box is the BIGGEST number  ->  ADD the two smaller ones
     the box is one of the PARTS    ->  TAKE the small one AWAY from the big

   The sets are parallel, not a progression: every set covers all six
   topics, so a child can start anywhere.
   ========================================================================== */
const WHOLE = 'The box is the BIGGEST number, so you ADD the other two.';
const PART  = 'The box is one of the smaller parts, so you TAKE AWAY.';

const SETS = [
/* ---------------------------- SET 1 ---------------------------- */
{
  id:1, title:'Apple Orchard', emoji:'🍎', about:'Counting and adding in the apple trees',
  aligns:['Counting to 10','Adding and taking away','Finding the missing number','Add or take away?','Pairs that make 10','Story sums'],
  sections:[
    {key:'count', items:[
      {t:'counters', prompt:'Count them.', text:'How many apples?', groups:[['🍎',7]], ans:7,
        explain:'Seven apples. Touch each one as you count so you do not count the same apple twice.'},
      {t:'choice', prompt:'Which number?', text:'Which number comes just after 7?',
        opts:['8','6','9'], ans:0,
        explain:'Counting up: 6, 7, 8. The number just after 7 is 8, which is one more.'},
      {t:'order', prompt:'Put the numbers in order, smallest first.',
        items:['2','5','7','9'],
        explain:'2 is the smallest and 9 is the biggest. Say them out loud: two, five, seven, nine.'},
      {t:'counters', prompt:'Count them.', text:'How many green apples?', groups:[['🍏',10]], ans:10,
        explain:'Ten. A full ten-frame is always 10, so once the frame is full you do not need to count again.'},
      {t:'tfgrid', prompt:'True or false?',
        rows:[['6 is more than 4.', true], ['9 is less than 5.', false],
              ['0 means none at all.', true], ['10 comes just after 9.', true]],
        explain:'9 is MORE than 5, not less. Think of the counting order: the further along, the bigger.'}
    ]},
    {key:'addsub', items:[
      {t:'keypad', prompt:'Work it out.', text:'4 + 3 = □', ans:7,
        explain:'Start at 4 and count on three: 5, 6, 7.'},
      {t:'keypad', prompt:'Work it out.', text:'9 − 2 = □', ans:7,
        explain:'Start at 9 and count back two: 8, 7.'},
      {t:'counters', prompt:'Add them together.', text:'How many apples altogether?',
        groups:[['🍎',5],['🍏',3]], ans:8,
        explain:'5 red and 3 green. Start at 5 and count on the green ones: 6, 7, 8.'},
      {t:'match', prompt:'Match each sum to its answer.',
        left:[{label:'2 + 2'},{label:'5 + 1'},{label:'3 + 4'},{label:'6 + 2'}],
        right:['4','6','7','8'],
        explain:'Double 2 is 4. One more than 5 is 6. 3 and 4 make 7. 6 and 2 make 8.'},
      {t:'keypad', prompt:'Work it out.', text:'5 + 5 = □', ans:10,
        explain:'Double 5 is 10. Five fingers on each hand makes ten.'}
    ]},
    {key:'missing', items:[
      {t:'keypad', prompt:'Find the missing number.', text:'5 + □ = 8', ans:3,
        explain:'8 is the biggest number, so the box is a part. ' + PART + ' 8 − 5 = 3.'},
      {t:'keypad', prompt:'Find the missing number.', text:'□ + 3 = 7', ans:4,
        explain:'7 is the biggest number, so the box is a part. ' + PART + ' 7 − 3 = 4.'},
      {t:'keypad', prompt:'Find the missing number.', text:'9 − □ = 4', ans:5,
        explain:'9 is the biggest number, so the box is a part. ' + PART + ' 9 − 4 = 5.'},
      {t:'keypad', prompt:'Find the missing number.', text:'□ − 2 = 6', ans:8,
        explain:'Here the box IS the biggest number. ' + WHOLE + ' 2 + 6 = 8.'},
      {t:'bond', prompt:'Fill in the missing part.', whole:9, known:6, ans:3,
        explain:'9 is the whole and 6 is one part, so the other part is 9 − 6 = 3.'}
    ]},
    {key:'method', items:[
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'6 − □ = 4',
        opts:['6 − 4 = 2','6 + 4 = 10'], ans:0,
        explain:'6 is the biggest number, so the box is a part. ' + PART + ' 6 − 4 = 2.'},
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'□ − 1 = 8',
        opts:['8 + 1 = 9','8 − 1 = 7'], ans:0,
        explain:'The box is the biggest number here. ' + WHOLE + ' 1 + 8 = 9.'},
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'9 − □ = 4',
        opts:['9 + 4 = 13','9 − 4 = 5'], ans:1,
        explain:'9 is the biggest number, so the box is a part. ' + PART + ' 9 − 4 = 5.'},
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'□ + 3 = 4',
        opts:['4 + 3 = 7','4 − 3 = 1'], ans:1,
        explain:'4 is the biggest number, so the box is a part. ' + PART + ' 4 − 3 = 1.'},
      {t:'sort', prompt:'Add or take away to find the box?',
        bins:[['Add','the box is the biggest number'],['Take away','the box is a smaller part']],
        chips:[['□ − 1 = 8',0],['□ − 2 = 3',0],['6 − □ = 4',1],['5 + □ = 8',1]],
        explain:'Look at the box. If it is the biggest number in the line, add the other two. If a bigger number is already showing, take away.'}
    ]},
    {key:'bonds', items:[
      {t:'bond', prompt:'Fill in the missing part.', whole:10, known:4, ans:6,
        explain:'4 and 6 make 10. Hold up 4 fingers — the 6 still down are the other part.'},
      {t:'match', prompt:'Match each number to the one that makes 10 with it.',
        left:[{label:'1'},{label:'3'},{label:'4'},{label:'7'}],
        right:['9','7','6','3'],
        explain:'1 and 9, 3 and 7, 4 and 6. Notice that 3 and 7 work both ways round.'},
      {t:'keypad', prompt:'Find the missing number.', text:'10 = 6 + □', ans:4,
        explain:'The 10 is on the left this time, but it is still the biggest number. 10 − 6 = 4.'},
      {t:'sort', prompt:'Does it make 10?',
        bins:[['Makes 10','the answer is 10'],['Does not make 10','the answer is not 10']],
        chips:[['6 + 4',0],['8 + 2',0],['5 + 5',0],['3 + 4',1],['7 + 1',1],['2 + 6',1]],
        explain:'6+4, 8+2 and 5+5 all make 10. The other three make 7, 8 and 8.'}
    ]},
    {key:'story', items:[
      {t:'counters', prompt:'Take them away.', text:'There were 8 apples. 3 were eaten. How many are left?',
        groups:[['🍎',8]], gone:3, ans:5,
        explain:'The crossed-out apples are gone. Count the ones still whole: 5.'},
      {t:'keypad', prompt:'Work out the story.', story:'Ben has 6 apples. He picks 3 more.',
        text:'6 + 3 = □', ans:9,
        explain:'"Picks more" means the pile grows, so you add. 6 and 3 make 9.'},
      {t:'choice', prompt:'Which sum tells the story?', long:true,
        text:'Mia had 9 stickers. She gave 4 away.',
        opts:['9 − 4','9 + 4','4 − 9'], ans:0,
        explain:'"Gave away" means fewer, so you take away. Start with what she had: 9 − 4.'},
      {t:'draw', prompt:'Drawing time!',
        tip:'Draw a tree with 7 apples on it. Count them to check you drew exactly 7.',
        explain:'Drawing the right number is another way of counting. Your picture is saved in My Notebook.'}
    ]}
  ]
},
/* ---------------------------- SET 2 ---------------------------- */
{
  id:2, title:'The Fish Tank', emoji:'🐟', about:'Counting fish and taking them away',
  aligns:['Counting to 10','Adding and taking away','Finding the missing number','Add or take away?','Pairs that make 10','Story sums'],
  sections:[
    {key:'count', items:[
      {t:'counters', prompt:'Count them.', text:'How many fish?', groups:[['🐟',6]], ans:6,
        explain:'Six fish. The ten-frame shows six filled and four empty.'},
      {t:'choice', prompt:'Which number?', text:'Which number comes just before 5?',
        opts:['4','6','3'], ans:0,
        explain:'Counting up: 3, 4, 5. The number just before 5 is 4, which is one less.'},
      {t:'order', prompt:'Put the numbers in order, smallest first.',
        items:['1','4','6','8'],
        explain:'1 is the smallest. Each one after it is bigger than the one before.'},
      {t:'counters', prompt:'Count them.', text:'How many shells?', groups:[['🐚',9]], ans:9,
        explain:'Nine. One space in the ten-frame is still empty, and 10 take away 1 is 9.'},
      {t:'tfgrid', prompt:'True or false?',
        rows:[['8 is more than 3.', true], ['5 comes just before 6.', true],
              ['2 is more than 7.', false], ['7 is less than 10.', true]],
        explain:'2 is LESS than 7. When you count up you say 2 long before you say 7.'}
    ]},
    {key:'addsub', items:[
      {t:'keypad', prompt:'Work it out.', text:'3 + 5 = □', ans:8,
        explain:'Start at 5 — the bigger number — and count on three: 6, 7, 8. It works either way round.'},
      {t:'keypad', prompt:'Work it out.', text:'7 − 3 = □', ans:4,
        explain:'Start at 7 and count back three: 6, 5, 4.'},
      {t:'counters', prompt:'Take them away.', text:'7 fish. 2 swim away. How many are left?',
        groups:[['🐟',7]], gone:2, ans:5,
        explain:'Two are crossed out. Five fish are still swimming.'},
      {t:'match', prompt:'Match each sum to its answer.',
        left:[{label:'4 + 4'},{label:'9 − 3'},{label:'2 + 7'},{label:'8 − 5'}],
        right:['8','6','9','3'],
        explain:'Double 4 is 8. 9 back three is 6. 2 and 7 make 9. 8 back five is 3.'},
      {t:'keypad', prompt:'Work it out.', text:'10 − 4 = □', ans:6,
        explain:'10 take away 4. If you know 4 and 6 make 10, you already know the answer is 6.'}
    ]},
    {key:'missing', items:[
      {t:'keypad', prompt:'Find the missing number.', text:'4 + □ = 9', ans:5,
        explain:'9 is the biggest number, so the box is a part. ' + PART + ' 9 − 4 = 5.'},
      {t:'keypad', prompt:'Find the missing number.', text:'□ + 6 = 8', ans:2,
        explain:'8 is the biggest number, so the box is a part. ' + PART + ' 8 − 6 = 2.'},
      {t:'keypad', prompt:'Find the missing number.', text:'7 − □ = 3', ans:4,
        explain:'7 is the biggest number, so the box is a part. ' + PART + ' 7 − 3 = 4.'},
      {t:'keypad', prompt:'Find the missing number.', text:'□ − 4 = 5', ans:9,
        explain:'Here the box IS the biggest number. ' + WHOLE + ' 4 + 5 = 9.'},
      {t:'bond', prompt:'Fill in the missing part.', whole:8, known:5, ans:3,
        explain:'8 is the whole and 5 is one part, so the other part is 8 − 5 = 3.'}
    ]},
    {key:'method', items:[
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'□ − 3 = 5',
        opts:['5 − 3 = 2','5 + 3 = 8'], ans:1,
        explain:'The box is the biggest number here. ' + WHOLE + ' 3 + 5 = 8.'},
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'8 − □ = 2',
        opts:['8 − 2 = 6','8 + 2 = 10'], ans:0,
        explain:'8 is the biggest number, so the box is a part. ' + PART + ' 8 − 2 = 6.'},
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'4 + □ = 9',
        opts:['9 + 4 = 13','9 − 4 = 5'], ans:1,
        explain:'9 is the biggest number, so the box is a part. ' + PART + ' 9 − 4 = 5.'},
      {t:'choice', big:true, prompt:'Tick the right way to find the answer.', text:'□ − 6 = 1',
        opts:['6 + 1 = 7','6 − 1 = 5'], ans:0,
        explain:'The box is the biggest number here. ' + WHOLE + ' 6 + 1 = 7.'},
      {t:'sort', prompt:'Add or take away to find the box?',
        bins:[['Add','the box is the biggest number'],['Take away','the box is a smaller part']],
        chips:[['□ − 3 = 4',0],['□ − 5 = 2',0],['9 − □ = 6',1],['3 + □ = 7',1]],
        explain:'In the first two the box sits at the front of a take-away, which always makes it the biggest number. Add to find those.'}
    ]},
    {key:'bonds', items:[
      {t:'bond', prompt:'Fill in the missing part.', whole:10, known:7, ans:3,
        explain:'7 and 3 make 10. If you count on from 7 — 8, 9, 10 — that is three steps.'},
      {t:'match', prompt:'Match each number to the one that makes 10 with it.',
        left:[{label:'2'},{label:'5'},{label:'6'},{label:'8'}],
        right:['8','5','4','2'],
        explain:'2 and 8, 5 and 5, 6 and 4. 5 is the only number that pairs with itself.'},

/* ============ UTILITIES ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const shuffleNotSame = a => { if (a.length < 2) return [...a]; let s; do { s = shuffle(a); } while (s.every((v, i) => v === a[i])); return s; };
const norm = s => String(s).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
const fmtTime = ms => { const s = Math.max(0, Math.round(ms / 1000)); const m = Math.floor(s / 60); return m ? `${m} min ${s % 60} sec` : `${s} sec`; };
const fmtDate = t => { const d = new Date(t); return d.toLocaleDateString(undefined, {day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}); };
const pick = a => a[Math.floor(Math.random() * a.length)];

/* Seeded shuffle: every learner gets their own set order, and that order
   never changes again once it is saved. */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed) {
  const rnd = mulberry32(seed >>> 0), a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function lev(a, b) { // optimal string alignment distance (forgives swapped letters)
  const d = Array.from({length: a.length + 1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);

/* ============ STORAGE (kept in this browser) ============ */
const KEY = 'numberFriends.v1';
const ART = 'numberFriends.art.v1';
const freshStats = () => ({count:0, missing:0, method:0, bonds:0, draw:0, streak:0, fix:0});
const fresh = () => ({v:1, seed:null, order:null, sets:{}, gallery:[], badges:[], stats:freshStats(),
  current:null, lastRun:null, settings:{size:'big', theme:'auto', sound:true}});
let S = fresh();
let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign(fresh(), d);
      S.settings = Object.assign(fresh().settings, d.settings || {});
      S.stats = Object.assign(freshStats(), d.stats || {});
    }
  } catch (e) { storageOK = false; }
  /* Drawings live in their own key now. Saves made before that change
     kept them in the main one; those are read above and move across on
     the next save, so nobody loses a picture in the upgrade. */
  try {
    const art = localStorage.getItem(ART);
    if (art) S.gallery = JSON.parse(art) || [];
  } catch (e) {}
  if (!Array.isArray(S.gallery)) S.gallery = [];
  if (S.seed === null || S.seed === undefined) S.seed = (Math.random() * 4294967296) >>> 0;
  setOrder();
}
/* setItem throws when the browser is full, and in a couple of private modes
   it fails quietly, so every write is read back before it is believed. */
function writeKey(k, text) {
  try {
    localStorage.setItem(k, text);
    return localStorage.getItem(k) === text;
  } catch (e) { return false; }
}
/* All the activities on this site share one storage allowance. Saved art is
   the throwaway tier wherever it came from, so one child's stars may clear
   another activity's pictures — never the other way round. */
function dropArtElsewhere() {
  let keys, freed = false;
  try { keys = Object.keys(localStorage); } catch (e) { return false; }
  for (const k of keys) {
    if (k !== ART && /\.art\.v\d+$/.test(k)) {
      try { localStorage.removeItem(k); freed = true; } catch (e) {}
    }
  }
  return freed;
}
/* Writes the child's progress. Nothing here may be lost for want of room, so
   it gives up pictures — its own first, then any other activity's — before
   it gives up itself. */
function save() {
  S.updatedAt = Date.now();
  const {gallery, ...progress} = S;
  const body = JSON.stringify(progress);
  let ok = writeKey(KEY, body);
  if (!ok) { try { localStorage.removeItem(ART); } catch (e) {} ok = writeKey(KEY, body); }
  if (!ok && dropArtElsewhere()) ok = writeKey(KEY, body);
  storageOK = ok;
  saveArt();
  return ok;
}
/* Pictures, written only once the stars are safely down. Oldest go first
   until the rest fit; none of this can cost a star. */
function saveArt() {
  const clear = () => { try { localStorage.removeItem(ART); } catch (e) {} };
  if (!storageOK || !S.gallery.length) { clear(); return false; }
  let list = S.gallery;
  while (list.length) {
    if (writeKey(ART, JSON.stringify(list))) { S.gallery = list; return true; }
    list = list.slice(0, list.length - 1);
  }
  clear(); S.gallery = [];
  return false;
}
function applySettings() {
  const r = document.documentElement;
  r.dataset.size = S.settings.size;
  if (S.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.dataset.theme = S.settings.theme;
}
/* The learner's personal set order. Built once, then only ever added to. */
function setOrder() {
  const ids = SETS.map(s => s.id);
  const kept = (S.order || []).filter(id => ids.includes(id));
  const missing = ids.filter(id => !kept.includes(id));
  if (missing.length || kept.length !== (S.order || []).length) {
    /* Core sets are shuffled among themselves and challenge sets among
       themselves, but a challenge set never lands before a core one. A
       returning learner keeps the order already saved; new sets are only
       ever appended to it. */
    const spread = list => list.length > 1 ? seededShuffle(list, S.seed + kept.length + list.length) : list;
    const core = missing.filter(id => !getSet(id).challenge);
    const chal = missing.filter(id => getSet(id).challenge);
    S.order = [...kept, ...spread(core), ...spread(chal)];
  }
  return S.order;
}
const orderPos = id => setOrder().indexOf(id);

/* ============ SOUND + READ ALOUD ============ */
let actx = null;
function beep(kind) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'good' ? [523, 659, 784] : kind === 'part' ? [523, 587] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * 0.1);
      g.gain.exponentialRampToValueAtTime(0.16, actx.currentTime + i * 0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * 0.1 + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + i * 0.1); o.stop(actx.currentTime + i * 0.1 + 0.25);
    });
  } catch (e) {}
}
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/_+/g, ' blank '));

/* ============ CONTENT HELPERS ============ */
const getSet = id => SETS.find(s => s.id === id);
const blanksOf = item => { const out = []; item.lines.forEach(l => l.replace(/\{([^}]+)\}/g, (m, w) => { out.push(w); return m; })); return out; };
function itemTotal(item) {
  switch (item.t) {
    case 'sort':   return item.chips.length;
    case 'match':  return item.left.length;

    case 'grid':   return item.rows.length * item.cols.length;
    case 'tfgrid': return item.rows.length;
    case 'multi':   return item.opts.length;

}
function flat(set) { if (!set._flat) { set._flat = []; set.sections.forEach(sec => sec.items.forEach(item => set._flat.push({sec:sec.key, item}))); } return set._flat; }
const setTotal = set => flat(set).reduce((a, q) => a + itemTotal(q.item), 0);
const starsFor = pct => pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
const starRow = n => `<span class="stars" aria-label="${n} of 3 stars">${[0,1,2].map(i => `<span class="${i < n ? 'star-on' : 'star-off'}">★</span>`).join('')}</span>`;

const threeStarSets = s => Object.values(s.sets).filter(r => r && r.best && starsFor(r.best.pct) === 3).length;
/* Unlocking follows the learner's own order, not the set numbers. */
function questionLabel(item) { return item.text || item.story || item.tip || item.prompt; }
function answerText(item) {
  switch (item.t) {
    case 'choice': return item.opts[item.ans];
    case 'sort':   return item.bins.map((b, bi) => `${b[0]}: ${item.chips.filter(c => c[1] === bi).map(c => c[0]).join(', ')}`).join('. ');
    case 'type':   return item.accept[0];

    case 'tfgrid': return item.rows.map(([text, want]) => `${want ? 'True' : 'False'}: ${text}`).join('. ');

  }
}
function speakText(item) {
  const bits = [item.prompt];
  if (item.text) bits.push(item.text.replace(/_{2,}/g, ' blank '));
  if (item.tip) bits.push(item.tip);
  if (item.t === 'choice') bits.push(item.opts.join(', or '));
  if (item.t === 'fill') bits.push(item.lines.map(l => l.replace(/\{[^}]+\}/g, 'blank')).join(' '));
  if (item.t === 'order') bits.push(item.items.join('. '));
  if (item.t === 'tfgrid') bits.push(item.rows.map(r => r[0]).join('. '));

function blankify(text, word) {

  return esc(parts[0]) + (word
    ? `<span class="blank filled">${esc(word)}</span>`
    : '<span class="blank"><span class="sr">blank</span>&nbsp;</span>') + esc(parts.slice(1).join(' '));
}

/* ============ AUTO-SCROLL WHILE DRAGGING ============ */
function autoScroller(onScroll) {
  let y = null, raf = null;
  const step = () => {
    if (y === null) { raf = null; return; }
    const dockH = dock.classList.contains('hidden') ? 0 : dock.offsetHeight;
    const bottom = window.innerHeight - dockH;
    let d = 0;
    if (y > bottom - 70) d = Math.min(20, (y - (bottom - 70)) / 3 + 2);
    else if (y < 120) d = -Math.min(20, (120 - y) / 3 + 2);
    if (d) { const before = window.scrollY; window.scrollBy(0, d); if (window.scrollY !== before && onScroll) onScroll(); }
    raf = requestAnimationFrame(step);
  };
  return {update(ny) { y = ny; if (!raf) raf = requestAnimationFrame(step); }, stop() { y = null; }};
}

/* ============ DRAG + TAP HELPER (chips into zones) ============ */
function dnd(root, o) {
  let suppress = false;
  root.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.chip[data-id]');
    if (!chip || o.locked() || e.button > 0) return;
    e.preventDefault();
    const id = chip.dataset.id, sx = e.clientX, sy = e.clientY;
    let ghost = null, over = null, lx = sx, ly = sy;
    const findZone = () => {
      const hit = document.elementFromPoint(lx, ly);
      const z = hit && hit.closest('[data-drop]');
      const zone = z && root.contains(z) ? z : null;
      if (zone !== over) { if (over) over.classList.remove('over'); if (zone) zone.classList.add('over'); over = zone; }
    };
    const scroller = autoScroller(findZone);
    const move = ev => {
      lx = ev.clientX; ly = ev.clientY;
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        ghost = chip.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        document.body.appendChild(ghost); chip.classList.add('dragging');
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      scroller.update(ev.clientY);
      findZone();
    };
    const end = ev => {
      scroller.stop();
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (over) over.classList.remove('over');
      if (ghost) { suppress = true; setTimeout(() => { suppress = false; }, 0); ghost.remove(); chip.classList.remove('dragging'); if (ev.type === 'pointerup' && over) o.drop(id, over.dataset.drop); }
      else if (ev.type === 'pointerup') setTimeout(() => o.tap(id), 0);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  root.addEventListener('click', e => {
    if (o.locked() || suppress || e.target.closest('.chip')) return;
    const z = e.target.closest('[data-drop]');
    if (z) o.zoneTap(z.dataset.drop);
  });
  root.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (o.locked()) return;
    const chip = e.target.closest('.chip[data-id]');
    const z = e.target.closest('[data-drop]');
    if (chip) { e.preventDefault(); e.stopPropagation(); o.tap(chip.dataset.id); }
    else if (z) { e.preventDefault(); e.stopPropagation(); o.zoneTap(z.dataset.drop); }
  });
}

/* ============ QUESTION TYPES ============ */
const TYPES = {};

TYPES.choice = (item, root, changed) => {
  let sel = -1, locked = false;
  /* A bare number sentence is what the child is actually solving, so it is
     shown at full size with a real box, not as a line of small text. */
  root.innerHTML = `${item.text ? (item.big
      ? `<p class="sentence">${sentenceHTML(item.text, '', null)}</p>`
      : `<p class="qtext" id="qt">${blankify(item.text, null)}</p>`) : ''}
    <div class="opts ${item.long ? 'long' : ''}" role="group" aria-label="Answers">${item.opts.map((o, i) =>
      `<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  const btns = $$('.opt', root);
  btns.forEach(b => b.addEventListener('click', () => {
    if (locked) return;
    sel = +b.dataset.i;
    btns.forEach(x => { x.classList.toggle('sel', x === b); x.setAttribute('aria-pressed', x === b); });
    if (item.text && /_{2,}/.test(item.text)) $('#qt', root).innerHTML = blankify(item.text, item.opts[sel]);
    changed();
  }));
  return {
    ready: () => sel >= 0,
    check() {
      locked = true;
      btns.forEach((b, i) => { b.disabled = true; b.classList.remove('sel'); if (i === item.ans) b.classList.add('ok'); else if (i === sel) b.classList.add('no'); });
      return {e: sel === item.ans ? 1 : 0, t: 1, answer: esc(item.opts[item.ans])};
    }
  };
};

TYPES.sort = (item, root, changed) => {
  const chips = shuffle(item.chips.map((c, i) => ({id:i, w:c[0], b:c[1], state:''})));
  const place = {};
  let sel = null, locked = false;
  const chipHtml = c => `<span class="chip ${sel === c.id ? 'sel' : ''} ${c.state}" data-id="${c.id}" role="button" tabindex="0">${esc(c.w)}</span>`;
  function draw() {
    const inBank = chips.filter(c => place[c.id] === undefined);
    root.innerHTML = `<div class="bank" data-drop="bank"><span class="bank-label">${inBank.length ? 'Drag a card to a box, or tap a card and then tap a box.' : 'All sorted! Tap Check when you are ready.'}</span>${inBank.map(chipHtml).join('')}</div>
      <div class="bins">${item.bins.map((b, bi) => `<div class="bin" data-drop="${bi}" tabindex="0" role="button" aria-label="Box: ${esc(b[0])}"><h3>${esc(b[0])}</h3><div class="hint">${esc(b[1])}</div><div class="inside">${chips.filter(c => place[c.id] === bi).map(chipHtml).join('')}</div></div>`).join('')}</div>`;
  }
  function drop(id, zone) { id = +id; if (zone === 'bank') delete place[id]; else place[id] = +zone; sel = null; draw(); changed(); }
  draw();
  dnd(root, {
    locked: () => locked,
    tap(id) { id = +id; if (place[id] !== undefined) { delete place[id]; sel = null; } else sel = sel === id ? null : id; draw(); changed(); },
    drop,
    zoneTap(zone) { if (sel !== null) drop(sel, zone); }
  });
  return {
    ready: () => Object.keys(place).length === chips.length,
    check() {
      locked = true; let e = 0;
      chips.forEach(c => { const ok = place[c.id] === c.b; c.state = ok ? 'ok' : 'no'; if (ok) e++; });
      sel = null; draw();
      return {e, t: chips.length, answer: item.bins.map((b, bi) => `<b>${esc(b[0])}:</b> ${item.chips.filter(c => c[1] === bi).map(c => esc(c[0])).join(', ')}`).join('<br>')};
    }
  };
};

TYPES.fill = (item, root, changed) => {
  const answers = blanksOf(item);
  const words = shuffle([...answers, ...item.decoys]).map((w, i) => ({id:i, w}));
  const slots = answers.map(() => null);
  const spare = item.decoys.length;
  let sel = null, locked = false, marks = null;
  function draw() {
    let k = 0;
    const lines = item.lines.map(l => {
      const parts = l.split(/(\{[^}]+\})/);
      let out = '';
      for (let pi = 0; pi < parts.length; pi++) {
        const part = parts[pi];
        if (!/^\{[^}]+\}$/.test(part)) { out += esc(part); continue; }
        const si = k++, cid = slots[si], w = cid === null ? null : words[cid];
        let punct = '';
        if (parts[pi + 1]) { const m = parts[pi + 1].match(/^[,.!?;:]+/); if (m) { punct = m[0]; parts[pi + 1] = parts[pi + 1].slice(punct.length); } }
        out += `<span class="nowrap"><span class="slot" data-drop="${si}" role="button" tabindex="0" aria-label="Gap ${si + 1}${w ? ': ' + esc(w.w) : ''}">${w ? `<span class="chip ${marks ? (marks[si] ? 'ok' : 'no') : ''}" data-id="${w.id}">${esc(w.w)}</span>` : ''}</span>${esc(punct)}</span>`;
      }
      return `<span class="line">${out}</span>`;
    }).join('');
    const bank = words.filter(w => !slots.includes(w.id));
    root.innerHTML = `<div class="bank" data-drop="bank"><span class="bank-label">Drag a card into a gap, or tap a card and then tap a gap. ${spare} card${spare === 1 ? ' is' : 's are'} left over!</span>${bank.map(w => `<span class="chip ${sel === w.id ? 'sel' : ''}" data-id="${w.id}" role="button" tabindex="0">${esc(w.w)}</span>`).join('')}</div><p class="poemtext">${lines}</p>`;
  }
  function drop(id, zone) {
    id = +id; const from = slots.indexOf(id);
    if (zone === 'bank') { if (from >= 0) slots[from] = null; }
    else { const si = +zone; const prev = slots[si]; if (from >= 0) slots[from] = prev; slots[si] = id; }
    sel = null; draw(); changed();
  }
  draw();
  dnd(root, {
    locked: () => locked,
    tap(id) { id = +id; if (slots.includes(id)) drop(id, 'bank'); else { sel = sel === id ? null : id; draw(); } },
    drop,
    zoneTap(zone) { if (sel !== null) drop(sel, zone); else if (zone !== 'bank' && slots[+zone] !== null) drop(slots[+zone], 'bank'); }
  });
  return {
    ready: () => slots.every(s => s !== null),
    check() {
      locked = true;
      marks = slots.map((cid, si) => cid !== null && words[cid].w === answers[si]);
      draw();
      return {e: marks.filter(Boolean).length, t: answers.length, answer: item.lines.map(l => esc(l).replace(/\{([^}]+)\}/g, '<b>$1</b>')).join('<br>')};
    }
  };
};

TYPES.type = (item, root, changed) => {
  root.innerHTML = `<p class="qtext" id="qt">${blankify(item.text, null)}</p>
    <div class="typeline">
      <label class="sr" for="wr">Your answer</label>
      <input id="wr" class="write" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" placeholder="Type one word">
      ${item.hint ? '<button class="btn btn-small" id="hintBtn" type="button">💡 Hint</button>' : ''}
    </div>
    <div id="hintOut"></div>`;
  const inp = $('#wr', root), qt = $('#qt', root);
  inp.addEventListener('input', () => { qt.innerHTML = blankify(item.text, inp.value.trim()); changed(); });
  const hb = $('#hintBtn', root);
  if (hb) hb.onclick = () => { $('#hintOut', root).innerHTML = `<p class="hintbox">💡 ${esc(item.hint)}</p>`; hb.disabled = true; inp.focus(); };
  return {
    ready: () => norm(inp.value).length >= 1,
    check() {
      inp.readOnly = true;
      const ok = answerMatches(inp.value, item.accept);
      qt.innerHTML = blankify(item.text, inp.value.trim());
      inp.style.borderColor = ok ? 'var(--leaf)' : 'var(--berry)';
      const exact = item.accept.some(a => norm(a) === norm(inp.value).replace(/^(a|an|the)\s+/, ''));
      return {e: ok ? 1 : 0, t: 1, answer: esc(item.accept[0]), nearly: ok && !exact};
    },
    focus: () => inp.focus()
  };
};

/* The tick-or-cross table from the worksheet. Tap a box to cycle it. */
TYPES.grid = (item, root, changed) => {
  const state = item.rows.map(() => item.cols.map(() => 0)); // 0 blank, 1 tick, 2 cross
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `<div class="gridq"><table>
      <thead><tr><th></th>${item.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${item.rows.map(([label], r) => `<tr><th class="rowhead" scope="row">${esc(label)}</th>${item.cols.map((col, c) => {
        const v = state[r][c], ok = marks ? marks[r][c] : null;
        return `<td><button type="button" class="cell ${v === 1 ? 'tick' : v === 2 ? 'cross' : ''} ${ok === true ? 'ok' : ok === false ? 'no' : ''}"
          data-r="${r}" data-c="${c}" ${locked ? 'disabled' : ''}
          aria-label="${esc(label)}, ${esc(col)}: ${v === 1 ? 'tick' : v === 2 ? 'cross' : 'not answered yet'}">${v === 1 ? '✓' : v === 2 ? '✗' : ''}</button></td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="tip">Tap a box to change it: empty → ✓ → ✗ → empty. Fill in every box.</p>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('.cell');
    if (!b || locked) return;
    const r = +b.dataset.r, c = +b.dataset.c;
    state[r][c] = (state[r][c] + 1) % 3;
    draw(); changed();
  });
  draw();
  return {
    ready: () => state.every(row => row.every(v => v !== 0)),
    check() {
      locked = true;
      marks = state.map((row, r) => row.map((v, c) => (v === 1) === (item.rows[r][1][c] === 1)));
      draw();
      return {e: marks.flat().filter(Boolean).length, t: item.rows.length * item.cols.length,
        answer: item.rows.map(([label, want]) => `<b>${esc(label)}:</b> ${want.map((m, i) => `${esc(item.cols[i])} ${m ? '✓' : '✗'}`).join(' · ')}`).join('<br>')};
    }
  };
};

/* Tick every one that is true. Scored per option, so a child has to judge
   each line on its own instead of hunting for the single best answer. */
TYPES.multi = (item, root, changed) => {
  const sel = item.opts.map(() => false);
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `${item.text ? `<p class="qtext">${esc(item.text)}</p>` : ''}
      <div class="opts long multi" role="group" aria-label="Tick every one that is true">${item.opts.map(([txt, want], i) =>
        `<button type="button" class="opt ${sel[i] ? 'sel' : ''} ${marks ? (marks[i] ? 'ok' : 'no') : ''}" data-i="${i}"
           aria-pressed="${sel[i]}" ${locked ? 'disabled' : ''}>
           <span class="tickbox" aria-hidden="true">${sel[i] ? '\u2713' : ''}</span><span>${esc(txt)}</span>
           ${marks ? `<span class="should">${want ? 'should be ticked' : 'should be left'}</span>` : ''}
         </button>`).join('')}</div>
      <p class="tip">Tick as many as you need \u2014 there may be more than one. Every line you get right is a star.</p>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b || locked) return;
    const i = +b.dataset.i;
    sel[i] = !sel[i];
    draw(); changed();
  });
  draw();
  return {
    ready: () => sel.some(Boolean),
    check() {
      locked = true;
      marks = sel.map((v, i) => v === item.opts[i][1]);
      draw();
      return {e: marks.filter(Boolean).length, t: item.opts.length,
        answer: item.opts.filter(o => o[1]).map(o => `\u2713 ${esc(o[0])}`).join('<br>')};
    }
  };
};

/* Several statements, each one true or false. One star per row. */
TYPES.tfgrid = (item, root, changed) => {
  const given = item.rows.map(() => null);
  let locked = false, marks = null;
  function draw() {
    root.innerHTML = `<div class="tflist">${item.rows.map(([text], i) => `
      <div class="tfrow ${marks ? (marks[i] ? 'ok' : 'no') : ''}">
        <span>${esc(text)}</span>
        <span class="tfbtns" role="group" aria-label="True or false: ${esc(text)}">
          <button type="button" data-i="${i}" data-v="1" aria-pressed="${given[i] === true}" ${locked ? 'disabled' : ''}>True</button>
          <button type="button" data-i="${i}" data-v="0" aria-pressed="${given[i] === false}" ${locked ? 'disabled' : ''}>False</button>
        </span>
      </div>`).join('')}</div>`;
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || locked) return;
    given[+b.dataset.i] = b.dataset.v === '1';
    draw(); changed();
  });
  draw();
  return {
    ready: () => given.every(a => a !== null),
    check() {
      locked = true;
      marks = given.map((a, i) => a === item.rows[i][1]);
      draw();
      return {e: marks.filter(Boolean).length, t: item.rows.length,
        answer: item.rows.map(([text, want]) => `<b>${want ? 'True' : 'False'}</b> — ${esc(text)}`).join('<br>')};
    }
  };
};

const LINE_COLORS = ['var(--sky)', 'var(--sun)', '#8E6AC8', '#D0668E', '#2E9C96', '#C07A34'];
TYPES.match = (item, root, changed, cleanups) => {
  const n = item.left.length;
  const rightOrder = shuffleNotSame(item.right.map((_, i) => i));
  const conn = {};
  let sel = null, temp = null, locked = false, result = false;
  root.innerHTML = `<p class="tip" style="margin:0 0 .9rem">Drag from a box on one side to a box on the other, or tap one on each side.</p>
    <div class="match">
      <svg class="lines" aria-hidden="true"></svg>
      <div class="match-col">${item.left.map((l, i) => `<button class="m-item left" data-side="L" data-i="${i}"><span>${esc(l.label)}</span><span class="dot"></span></button>`).join('')}</div>
      <div class="match-col">${rightOrder.map(ri => `<button class="m-item right" data-side="R" data-i="${ri}">${esc(item.right[ri])}<span class="dot"></span></button>`).join('')}</div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:.9rem"><button class="btn btn-small" id="clearLines" type="button">Clear lines</button></div>`;
  const box = $('.match', root), svg = $('svg.lines', root);
  const itemEl = (side, i) => box.querySelector(`.m-item[data-side="${side}"][data-i="${i}"]`);
  const dotPt = el => { const b = box.getBoundingClientRect(), r = el.getBoundingClientRect(); return {x: (el.dataset.side === 'L' ? r.right : r.left) - b.left, y: r.top + r.height / 2 - b.top}; };
  const curve = (a, b) => { const dx = (b.x - a.x) * 0.45; return `M${a.x} ${a.y} C${a.x + dx} ${a.y} ${b.x - dx} ${b.y} ${b.x} ${b.y}`; };
  function redraw() {
    let html = '';
    Object.entries(conn).forEach(([li, ri]) => {
      const a = dotPt(itemEl('L', li)), b = dotPt(itemEl('R', ri));
      let color = LINE_COLORS[li % LINE_COLORS.length], extra = '';
      if (result) { const ok = +li === +ri; color = ok ? 'var(--leaf)' : 'var(--berry)'; if (!ok) extra = 'stroke-dasharray="10 8"'; }
      html += `<path d="${curve(a, b)}" stroke="${color}" ${extra}/>`;
    });
    if (temp) { const bb = box.getBoundingClientRect(); html += `<path d="${curve(dotPt(temp.el), {x: temp.cx - bb.left, y: temp.cy - bb.top})}" stroke="var(--ink-soft)" stroke-dasharray="6 7"/>`; }
    svg.innerHTML = html;
    $$('.m-item', box).forEach(el => {
      const side = el.dataset.side, i = +el.dataset.i;
      el.classList.toggle('linked', side === 'L' ? conn[i] !== undefined : Object.values(conn).includes(i));
      el.classList.toggle('sel', !!sel && sel.side === side && sel.i === i);
    });
  }
  function link(li, ri) { for (const k in conn) if (conn[k] === ri) delete conn[k]; conn[li] = ri; sel = null; redraw(); changed(); }
  function unlink(side, i) { if (side === 'L') delete conn[i]; else for (const k in conn) if (conn[k] === i) delete conn[k]; }
  function tapItem(side, i) {
    if (sel && sel.side !== side) { side === 'L' ? link(i, sel.i) : link(sel.i, i); return; }
    if (sel && sel.side === side && sel.i === i) { unlink(side, i); sel = null; redraw(); changed(); return; }
    sel = {side, i}; redraw();
  }
  box.addEventListener('pointerdown', e => {
    const el = e.target.closest('.m-item');
    if (!el || locked || e.button > 0) return;
    e.preventDefault();
    const side = el.dataset.side, i = +el.dataset.i, sx = e.clientX, sy = e.clientY;
    let dragging = false;
    const scroller = autoScroller(() => { if (temp) redraw(); });
    const move = ev => {
      if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) dragging = true;
      if (dragging) { temp = {el, cx: ev.clientX, cy: ev.clientY}; sel = {side, i}; scroller.update(ev.clientY); redraw(); }
    };
    const end = ev => {
      scroller.stop();
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (dragging) {
        temp = null;
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        const t = hit && hit.closest('.m-item');
        if (ev.type === 'pointerup' && t && box.contains(t) && t.dataset.side !== side) { const j = +t.dataset.i; side === 'L' ? link(i, j) : link(j, i); }
        else { sel = null; redraw(); }
      } else if (ev.type === 'pointerup') tapItem(side, i);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  box.addEventListener('click', e => { const el = e.target.closest('.m-item'); if (el && e.detail === 0 && !locked) tapItem(el.dataset.side, +el.dataset.i); });
  $('#clearLines', root).addEventListener('click', () => { if (locked) return; for (const k in conn) delete conn[k]; sel = null; redraw(); changed(); });
  const ro = new ResizeObserver(() => redraw()); ro.observe(box);
  cleanups.push(() => ro.disconnect());
  requestAnimationFrame(redraw);
  return {
    ready: () => Object.keys(conn).length === n,
    check() {
      locked = true; result = true; let e = 0;
      for (let i = 0; i < n; i++) {
        const ok = conn[i] === i; if (ok) e++;
        itemEl('L', i).classList.add(ok ? 'ok' : 'no');
        const r = itemEl('R', i), rOk = Object.entries(conn).some(([li, ri]) => ri === i && +li === i);
        r.classList.add(rOk ? 'ok' : 'no');
      }
      $$('.m-item', box).forEach(b => b.disabled = true);
      $('#clearLines', root).disabled = true;
      redraw();
      return {e, t: n, answer: item.left.map((l, i) => `<b>${esc(l.label)}</b> ➜ ${esc(item.right[i])}`).join('<br>')};
    }
  };
};

/* Put the steps in the right order: drag them, or use the little arrows. */
TYPES.order = (item, root, changed) => {
  const n = item.items.length;
  let seq = shuffleNotSame(item.items.map((_, i) => i));
  let locked = false, marks = null, dragPos = -1;
  function draw() {
    root.innerHTML = `<p class="tip" style="margin:0 0 .9rem">Drag a card up or down, or use the ▲ ▼ arrows, until the order is right.</p>
      <div class="orderlist">${seq.map((si, p) => `
        <div class="ord ${dragPos === p ? 'dragging' : ''} ${marks ? (marks[p] ? 'ok' : 'no') : ''}" data-p="${p}" role="listitem" aria-label="Position ${p + 1}: ${esc(item.items[si])}">
          <span class="num">${p + 1}</span>
          <span>${esc(item.items[si])}</span>
          <span class="ord-move">
            <button type="button" data-up="${p}" aria-label="Move up" ${p === 0 || locked ? 'disabled' : ''}>▲</button>
            <button type="button" data-down="${p}" aria-label="Move down" ${p === n - 1 || locked ? 'disabled' : ''}>▼</button>
          </span>
        </div>`).join('')}</div>`;
  }
  function move(from, to) {
    if (to < 0 || to >= n || from === to) return;
    const [x] = seq.splice(from, 1); seq.splice(to, 0, x);
  }
  draw();
  root.addEventListener('click', e => {
    if (locked) return;
    const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-down]');
    if (up) { const p = +up.dataset.up; move(p, p - 1); draw(); changed(); const f = $(`[data-up="${p - 1}"]`, root); if (f) f.focus(); }
    else if (dn) { const p = +dn.dataset.down; move(p, p + 1); draw(); changed(); const f = $(`[data-down="${p + 1}"]`, root); if (f) f.focus(); }
  });
  root.addEventListener('pointerdown', e => {
    const el = e.target.closest('.ord');
    if (!el || locked || e.button > 0 || e.target.closest('.ord-move')) return;
    e.preventDefault();
    const sy = e.clientY;
    dragPos = +el.dataset.p;
    let ghost = null;
    const scroller = autoScroller(() => {});
    const place = y => {
      const rows = $$('.ord', root);
      let target = dragPos;
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].getBoundingClientRect();
        if (y > r.top && y < r.bottom) { target = i; break; }
        if (i === 0 && y <= r.top) target = 0;
        if (i === rows.length - 1 && y >= r.bottom) target = rows.length - 1;
      }
      if (target !== dragPos) { move(dragPos, target); dragPos = target; draw(); }
    };
    const onMove = ev => {
      if (!ghost) {
        if (Math.abs(ev.clientY - sy) < 8) return;
        ghost = el.cloneNode(true);
        ghost.classList.add('ghost'); ghost.classList.remove('dragging');
        ghost.style.width = el.getBoundingClientRect().width + 'px';
        document.body.appendChild(ghost);
        draw();
      }
      ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
      scroller.update(ev.clientY);
      place(ev.clientY);
    };
    const end = () => {
      scroller.stop();
      window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end);
      if (ghost) { ghost.remove(); changed(); }
      dragPos = -1; draw();
    };
    window.addEventListener('pointermove', onMove); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  });
  return {
    ready: () => true,
    check() {
      locked = true;
      marks = seq.map((si, p) => si === p);
      draw();
      return {e: marks.filter(Boolean).length, t: n, answer: item.items.map((t, i) => `<b>${i + 1}.</b> ${esc(t)}`).join('<br>')};
    }
  };
};

/* ============ NUMBER PAD ============
   Every typed answer in this activity is a number from 0 to 20, and a
   six-year-old should not have to go hunting for a keyboard. */
function numPad(host, onChange) {
  let val = '';
  host.innerHTML = `<div class="numpad" role="group" aria-label="Number keys">
    ${[1,2,3,4,5,6,7,8,9,0].map(d => `<button type="button" class="numkey" data-d="${d}">${d}</button>`).join('')}
    <button type="button" class="numkey clear" data-clear="1">⌫ Clear</button>
  </div>`;
  host.addEventListener('click', e => {
    const b = e.target.closest('.numkey');
    if (!b || b.disabled) return;
    /* a fresh 0 is replaced rather than kept, so 0 then 5 reads as 5 */
    if (b.dataset.clear) val = '';
    else val = (val === '' || val === '0') ? b.dataset.d : (val + b.dataset.d).slice(0, 2);
    onChange(val);
  });
  return {
    value: () => val,
    lock: () => $$('.numkey', host).forEach(b => b.disabled = true)
  };
}
/* A number sentence with one box in it, such as "5 + □ = 8". */
function sentenceHTML(text, val, mark) {
  return String(text).split(' ').map(tok => tok === '□'
    ? `<span class="sbox ${val ? 'filled' : ''} ${mark || ''}" role="img" aria-label="${val ? 'box holds ' + val : 'empty box'}">${esc(val || '')}</span>`
    : `<span>${esc(tok)}</span>`).join('');
}

/* Fill the box in a number sentence. */
TYPES.keypad = (item, root, changed) => {
  let mark = null;
  root.innerHTML = `${item.story ? `<p class="story-line">${esc(item.story)}</p>` : ''}
    <p class="sentence" id="sent"></p>
    <div id="padhost"></div>
    <p class="tip">Tap the numbers to fill the box.</p>`;
  const sent = $('#sent', root);
  const draw = val => { sent.innerHTML = sentenceHTML(item.text, val, mark); };
  const pad = numPad($('#padhost', root), v => { draw(v); changed(); });
  draw('');
  return {
    ready: () => pad.value() !== '',
    check() {
      pad.lock();
      const got = Number(pad.value());
      mark = got === item.ans ? 'ok' : 'no';
      draw(pad.value());
      return {e: got === item.ans ? 1 : 0, t: 1, answer: `<b>${item.ans}</b>`};
    }
  };
};

/* Count the pictures. They sit in ten-frames, because a row of five is far
   easier to see at a glance than a row of seven. */
TYPES.counters = (item, root, changed) => {
  let mark = null;
  const total = item.groups.reduce((a, g) => a + g[1], 0), gone = item.gone || 0;
  const frames = item.groups.map(([emoji, n], gi) => {
    const last = gi === item.groups.length - 1;
    const cells = [];
    for (let i = 0; i < (n > 5 ? 10 : 5); i++) {
      const filled = i < n, crossed = last && filled && i >= n - gone;
      cells.push(`<span class="fcell ${filled ? '' : 'empty'} ${crossed ? 'gone' : ''}">${filled ? `<span class="fpic">${emoji}</span>` : ''}</span>`);
    }
    return `<div class="frame">${cells.join('')}</div>`;
  }).join('');
  root.innerHTML = `${item.text ? `<p class="qtext">${esc(item.text)}</p>` : ''}
    <div class="frames" role="img" aria-label="${total} picture${total === 1 ? '' : 's'}${gone ? `, ${gone} of them crossed out` : ''}">${frames}</div>
    <p class="sentence" id="sent"></p>
    <div id="padhost"></div>
    <p class="tip">Count the pictures, then tap the number.</p>`;
  const sent = $('#sent', root);
  const draw = val => { sent.innerHTML = sentenceHTML('□', val, mark); };
  const pad = numPad($('#padhost', root), v => { draw(v); changed(); });
  draw('');
  return {
    ready: () => pad.value() !== '',
    check() {
      pad.lock();
      const got = Number(pad.value());
      mark = got === item.ans ? 'ok' : 'no';
      draw(pad.value());
      return {e: got === item.ans ? 1 : 0, t: 1, answer: `<b>${item.ans}</b>`};
    }
  };
};

/* Part, part, whole: the whole on top, its two parts hanging below. */
TYPES.bond = (item, root, changed) => {
