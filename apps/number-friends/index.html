      aria-label="A number bond. The whole is ${item.whole}. One part is ${item.known}. The other part is missing.">
      <path class="bond-link" d="M112 68 L84 114 M148 68 L176 114"/>
      <circle class="bond-ring" cx="130" cy="42" r="36"/>

      <circle class="bond-ring" cx="62" cy="148" r="36"/>

      <circle class="bond-hole" id="hole" cx="198" cy="148" r="36"/>

/* Draw a picture. Saved in My Notebook. */
const PEN_COLORS = ['#1F2A37', '#C0392B', '#2F76A8', '#2E8B57', '#D9841C', '#8E6AC8'];
TYPES.draw = (item, root, changed) => {
  root.innerHTML = `<p class="clue">${esc(item.tip)}</p>
    <div class="padwrap">
      <canvas id="pad" class="pad" width="600" height="400" aria-label="Drawing area. Use a finger, a pen or a mouse."></canvas>
      <div class="padtools" role="group" aria-label="Drawing tools">
        ${PEN_COLORS.map((c, i) => `<button type="button" class="swatch" data-c="${i}" style="background:${c}" aria-label="Colour ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}
        <button type="button" class="btn btn-small" id="undoBtn">↶ Undo</button>
        <button type="button" class="btn btn-small" id="clearPad">Start again</button>
      </div>
      <p class="padnote">Draw your picture, then tap Save. There are no wrong answers here.</p>
    </div>`;
  const cv = $('#pad', root), ctx = cv.getContext('2d');
  let strokes = [], cur = null, color = PEN_COLORS[0], locked = false;
  function repaint() {
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of strokes.concat(cur ? [cur] : [])) {
      if (s.pts.length < 2) { ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.pts[0].x, s.pts[0].y, s.w / 2, 0, 7); ctx.fill(); continue; }
      ctx.strokeStyle = s.c; ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let i = 1; i < s.pts.length; i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
      ctx.stroke();
    }
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height}; };
  cv.addEventListener('pointerdown', e => {
    if (locked) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur = {c: color, w: 6, pts: [pos(e)]}; repaint();
  });
  cv.addEventListener('pointermove', e => { if (!cur) return; cur.pts.push(pos(e)); repaint(); });
  const stop = () => { if (!cur) return; strokes.push(cur); cur = null; repaint(); changed(); };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  cv.addEventListener('pointerleave', stop);
  $$('.swatch', root).forEach(b => b.onclick = () => {
    color = PEN_COLORS[+b.dataset.c];
    $$('.swatch', root).forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  $('#undoBtn', root).onclick = () => { if (locked) return; strokes.pop(); repaint(); changed(); };
  $('#clearPad', root).onclick = () => { if (locked) return; strokes = []; repaint(); changed(); };
  repaint();
  return {
    ready: () => strokes.length > 0,
    check() {
      locked = true;
      let url = '';
      try {
        const small = document.createElement('canvas');
        small.width = 360; small.height = 240;
        const sc = small.getContext('2d');
        sc.fillStyle = '#FFFFFF'; sc.fillRect(0, 0, 360, 240);
        sc.drawImage(cv, 0, 0, 360, 240);
        /* JPEG, not PNG. A drawing on white costs about a tenth as much that
           way, and every activity on this site shares a few megabytes. */
        url = small.toDataURL('image/jpeg', 0.72);
      } catch (e) {}
      return {e: 0, t: 0, picture: url, strokes: strokes.length};
    }
  };
};

/* ============ APP ============ */
const app = $('#app'), dock = $('#dock'), dockInner = $('#dockInner'), layer = $('#layer');
let screen = 'home', Q = null, timer = null, paused = false, cleanups = [], streak = 0;

function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function showLayer(html) { layer.innerHTML = html; const b = $('button', layer); if (b) b.focus(); }
function hideLayer() { layer.innerHTML = ''; }
function confirmBox({title, text, yes, no = 'Cancel', onYes, bot = false}) {
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="cbT"><div class="modal">${bot ? owl() : ''}<h2 id="cbT">${esc(title)}</h2><p>${esc(text)}</p><button class="btn btn-go btn-wide" id="cbYes">${esc(yes)}</button>${no === null ? '' : `<button class="btn btn-wide" id="cbNo">${esc(no)}</button>`}</div></div>`);
  $('#cbYes').onclick = () => { hideLayer(); onYes(); };
  const nb = $('#cbNo'); if (nb) nb.onclick = hideLayer;
}

function go(name) {
  screen = name; runCleanups(); hideLayer(); stopTimer();
  dock.className = 'dock hidden'; dockInner.innerHTML = ''; Q = null;
  ({home:renderHome, quiz:openQuiz, results:renderResults, history:renderHistory, settings:renderSettings}[name] || renderHome)();
  if (name !== 'quiz') window.scrollTo(0, 0);
}

/* ---------- Home ---------- */
function renderHome() {

          <span class="go">${best ? starRow(starsFor(best.pct)) : 'Start ▶'}</span>
        </button>`;
      }).join('')}
    </section>
    <section class="card" style="margin-top:1.25rem">

}

function tryStart(id, mode = 'full', queue = null) {
  const c = S.current;
  if (c && c.setId === id && mode === 'full') {
    confirmBox({title:'That set is paused', text:'Do you want to keep going from where you stopped?', yes:'▶ Continue', no:'Start again', onYes(){ go('quiz'); }});
    $('#cbNo').onclick = () => { hideLayer(); startSet(id, mode, queue); };
    return;
  }
  if (c) { confirmBox({title:'You have a paused set', text:`Starting now will clear your paused set: ${getSet(c.setId).title}.`, yes:'Start the new set', no:'Cancel', onYes(){ startSet(id, mode, queue); }}); return; }
  startSet(id, mode, queue);
}
function startSet(id, mode = 'full', queue = null) {
  const f = flat(getSet(id));
  S.current = {setId:id, mode, queue: queue || f.map((_, i) => i), answers:{}, elapsed:0, started:Date.now()};
  streak = 0;
  save(); go('quiz');
}

/* ---------- Quiz ---------- */
function startTimer() {
  stopTimer();
  let last = Date.now(), ticks = 0;
  timer = setInterval(() => { const now = Date.now(); if (S.current && !paused) { S.current.elapsed += now - last; if (++ticks % 5 === 0) save(); } last = now; }, 1000);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function openQuiz() { if (!S.current) return go('home'); paused = false; renderQuestion(); if (screen === 'quiz' && S.current) startTimer(); }
function tally(c) { let e = 0, t = 0; Object.values(c.answers).forEach(a => { e += a.e; t += a.t; }); return {e, t}; }

function renderQuestion() {
  runCleanups();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  const pos = c.queue.findIndex(i => !c.answers[i]);
  if (pos < 0) return finishRun();
  const idx = c.queue[pos], {sec, item} = f[idx];
  const done = c.queue.length - c.queue.filter(i => !c.answers[i]).length;
  const pct = done / c.queue.length;
  const {e, t} = tally(c);
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-icon" id="pauseBtn" aria-label="Pause">⏸</button>
      <span class="where"><b>${set.emoji} ${esc(set.title)}</b><span>Question ${done + 1} of ${c.queue.length}</span></span>
      ${streak >= 3 ? `<span class="pill fire" aria-label="${streak} right in a row">🔥 ${streak}</span>` : ''}
      <span class="pill" id="scorePill" aria-label="${e} stars out of ${t}">⭐ ${e}/${t}</span>
    </div>
    <div class="track-wrap" aria-hidden="true">
      <div class="track"></div><div class="fill" style="width:${pct * 100}%"></div>
      <div class="walker" style="left:${pct * 100}%">${owl()}</div><div class="goal">🏁</div>
    </div>
    <article class="card" id="qcard">
      <span class="sec-tag">${SECTIONS[sec].icon} ${SECTIONS[sec].name}</span>
      <div class="prompt"><h2>${esc(item.prompt)}</h2>${canSpeak ? '<button class="speak" id="speakBtn" aria-label="Read the question out loud">🔊</button>' : ''}</div>
      <div id="qbody"></div>
    </article>
    <div class="dock-space" id="dockSpace"></div>`;
  const body = $('#qbody');
  const h = TYPES[item.t](item, body, () => { const b = $('#checkBtn'); if (b) b.disabled = !h.ready(); }, cleanups);
  Q = {idx, item, sec, h, checked:false};
  const sb = $('#speakBtn'); if (sb) sb.onclick = () => speak(speakText(item));
  $('#pauseBtn').onclick = pause;
  dock.className = 'dock';
  dockInner.innerHTML = `<button class="btn btn-go btn-wide" id="checkBtn" disabled>${item.t === 'draw' ? 'Save my drawing' : 'Check my answer'}</button>`;
  $('#checkBtn').onclick = doCheck;
  $('#checkBtn').disabled = !h.ready();
  syncDockSpace();
}
function syncDockSpace() { const sp = $('#dockSpace'); if (sp) sp.style.height = (dock.offsetHeight + 24) + 'px'; }

function doCheck() {
  if (!Q || Q.checked || !Q.h.ready()) return;
  const c = S.current, set = getSet(c.setId), item = Q.item;
  const res = Q.h.check();
  Q.checked = true;
  c.answers[Q.idx] = {e: res.e, t: res.t};

  if (item.t === 'draw' && res.picture) { S.gallery.unshift({setId:set.id, img:res.picture, tip:item.tip, date:Date.now()}); S.gallery = S.gallery.slice(0, 8); }

  const full = res.t > 0 && res.e === res.t;
  if (item.t === 'draw') S.stats.draw++;
  if (Q.sec === 'count' && full) S.stats.count++;
  if (Q.sec === 'missing' && full) S.stats.missing++;
  if (Q.sec === 'method' && full) S.stats.method++;
  if (Q.sec === 'bonds' && full) S.stats.bonds++;
  if (res.t > 0) { streak = full ? streak + 1 : 0; if (streak > S.stats.streak) S.stats.streak = streak; }

  const earned = newBadges();
  save();

  const {e, t} = tally(c);
  const pill = $('#scorePill'); pill.textContent = `⭐ ${e}/${t}`; pill.setAttribute('aria-label', `${e} stars out of ${t}`);

  const kind = res.t === 0 || res.e === res.t ? 'good' : res.e === 0 ? 'bad' : 'part';
  let title, body = '';
  if (item.t === 'draw') {
    title = '🎨 Lovely drawing!';
    body = `<p>Your picture is saved in My Notebook. ${res.strokes > 12 ? 'You put a lot into that one!' : 'Come back any time and draw another.'}</p>`;
  } else {
    /* With a table worth a dozen stars, "nearly all of it" has to mean it. */
    const frac = res.t ? res.e / res.t : 1;
    title = kind === 'good' ? '✅ ' + pick(['Great thinking!', 'You got it!', 'Spot on!', 'Well done!', 'Exactly right!'])
      : kind === 'part' ? '🌟 ' + (frac >= 0.6
          ? pick(['Almost!', 'So close!', 'Good work, nearly all of it!'])
          : pick(['A good start!', 'Some of it is right.', 'Part of the way there.']))
      : '💪 ' + pick(['Nice try!', 'Good try!', 'Not quite yet.']);
    if (item.t === 'type' && res.nearly) body += `<p>Right word — just watch the spelling: <b>${esc(item.accept[0])}</b>.</p>`;
    if (kind !== 'good') body += `<p><span class="ans">The answer:</span><br>${res.answer}</p>`;
    if (kind === 'part' && res.t > 2) body += `<p>You got ${res.e} of the ${res.t} parts right.</p>`;
  }
  if (item.explain) body += `<p class="why">💡 ${esc(item.explain)}</p>`;
  if (streak === 3) body += `<p>🔥 Three right in a row!</p>`;
  else if (streak >= 6) body += `<p>🔥 ${streak} in a row — you are on fire!</p>`;
  earned.forEach(b => { body += `<div class="badge-pop"><span class="bi">${b.icon}</span><span><b>New badge: ${esc(b.name)}</b><br><small>${esc(b.desc)}</small></span></div>`; });

  const gain = res.t ? `+${res.e} of ${res.t}` : 'Saved';
  const last = c.queue.every(i => c.answers[i]);
  dock.className = 'dock ' + kind;
  dockInner.innerHTML = `<div class="fb" role="status"><h3>${title}<span class="gain">${gain}</span></h3>${body}</div>
    <button class="btn btn-go btn-wide" id="nextBtn">${last ? '🏁 See my results' : 'Next question ▶'}</button>`;
  $('#nextBtn').onclick = next;
  $('#nextBtn').focus({preventScroll:true});
  syncDockSpace();
  beep(res.t === 0 ? 'good' : kind);
  if (kind === 'good') { const b = $('.walker .mascot'); if (b) { b.classList.remove('happy'); void b.offsetWidth; b.classList.add('happy'); } }
}
function next() { if (!Q || !Q.checked) return; renderQuestion(); window.scrollTo(0, 0); const f = Q && Q.h && Q.h.focus; if (f && matchMedia('(pointer: fine)').matches) f(); }

function newBadges() {
  const out = [];
  BADGES.forEach(b => { if (!S.badges.includes(b.id) && b.got(S)) { S.badges.push(b.id); out.push(b); } });
  return out;
}

function pause() {
  if (!S.current) return;
  paused = true; save();
  const {e, t} = tally(S.current);
  showLayer(`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="pT"><div class="modal">${owl('sleepy')}<h2 id="pT">Paused</h2>
    <p>You have ${e} of ${t} stars so far. Your place is saved, so you can come back any time.</p>
    <button class="btn btn-go btn-wide" id="resumeBtn">▶ Keep going</button>
    <button class="btn btn-wide" id="homeBtn">Save and go home</button></div></div>`);
  $('#resumeBtn').onclick = resumeQuiz;
  $('#homeBtn').onclick = () => go('home');
}
function resumeQuiz() { paused = false; hideLayer(); }

function finishRun() {
  stopTimer();
  const c = S.current, set = getSet(c.setId), f = flat(set);
  let e = 0, t = 0; const bySec = {};
  c.queue.forEach(i => { const a = c.answers[i], s = f[i].sec; bySec[s] = bySec[s] || {e:0, t:0}; if (a) { e += a.e; t += a.t; bySec[s].e += a.e; bySec[s].t += a.t; } });
  const pct = t ? Math.round(e / t * 100) : 0;
  const order = setOrder(), pos = orderPos(set.id), nextId = pos >= 0 && pos + 1 < order.length ? order[pos + 1] : null;
  const rec = S.sets[set.id] = S.sets[set.id] || {attempts:[], best:null};
  rec.attempts.unshift({mode:c.mode, e, t, pct, time:c.elapsed, date:Date.now()});
  rec.attempts = rec.attempts.slice(0, 20);
  if (c.mode === 'full' && (!rec.best || pct > rec.best.pct || (pct === rec.best.pct && c.elapsed < rec.best.time))) rec.best = {e, t, pct, time:c.elapsed, date:Date.now()};
  if (c.mode === 'fix') S.stats.fix++;
  S.lastRun = {setId:set.id, mode:c.mode, e, t, pct, time:c.elapsed, bySec, answers:c.answers, queue:c.queue};
  S.current = null;
  const earned = newBadges();
  S.lastRun.badges = earned.map(b => b.id);
  save();
  go('results');
}

/* ---------- Settings ---------- */
function renderSettings() {
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" aria-pressed="${String(S.settings[key]) === String(v)}">${l}</button>`).join('')}</div>`;
  const order = setOrder();
  app.innerHTML = `
    <div class="page-head"><button class="btn btn-icon" id="backBtn" aria-label="Back to home">⬅</button><h1>⚙️ Settings</h1></div>
    <div class="card">
      <div class="setting"><div><b>Text size</b><small>Bigger text is easier on young eyes.</small></div>${seg('size', [['normal', 'Big'], ['big', 'Bigger']])}</div>
      <div class="setting"><div><b>Colours</b><small>Dark is gentle at night.</small></div>${seg('theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}</div>
      <div class="setting"><div><b>Sounds</b><small>Little chimes for right and wrong answers.</small></div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
      <div class="setting"><div><b>Backup progress</b><small>Saves a file with stars, badges and the pictures in My Notebook.</small></div><button class="btn btn-small" id="exportBtn">Save backup</button></div>
      <div class="setting"><div><b>Restore progress</b><small>Load a backup from another device or an earlier day.</small></div><button class="btn btn-small" id="importBtn">Load backup</button><input type="file" id="importFile" accept="application/json,.json" style="display:none"></div>
      <div class="setting"><div><b>Clear all progress</b><small>Removes scores, badges, pictures and any paused set.</small></div><button class="btn btn-small" id="resetBtn">Clear progress</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">This learner's set order</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Each new learner gets the sets in their own shuffled order, and that order then stays the same for ever, on every visit. Every set covers all six topics, so no order is harder than another. This device is using:</p>
      <p style="margin:.5rem 0 0;font-size:1.05rem">${order.map((id, i) => `<b>${i + 1}.</b> ${getSet(id).emoji} ${esc(getSet(id).title)}`).join(' &nbsp; ')}</p>
      <div class="setting" style="border:0"><div><b>Give a new order</b><small>Only for a different child sharing this device. It also clears their progress.</small></div><button class="btn btn-small" id="reshuffleBtn">Shuffle again</button></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">What this covers</h2>
      <p style="margin:.5rem 0 .5rem;font-size:1.05rem">Year 1 maths: counting to 10, adding and taking away, and finding a missing number in a number sentence. The heart of it is one rule the exercise book teaches four different ways — if the box is the biggest number, add the other two; if it is one of the smaller parts, take away.</p>
      <div class="knows">${[...new Set(SETS.flatMap(s => s.aligns))].map(a => `<span class="know">${esc(a)}</span>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:1rem">
      <h2 style="font-size:1.2rem">How scoring works</h2>
      <p style="margin:.5rem 0 0;font-size:1.05rem">Each question counts the first answer. Sorting, matching, ordering and true-or-false lists all give one star per part, so a nearly-right answer still earns most of the stars. Counting, the number pad and the number bonds are worth one star each. Drawings are saved in My Notebook rather than marked. "Fix my mistakes" repeats only what was missed; the best score always comes from a whole-set try.</p>
      <div id="iosNote"></div>
    </div>`;
  $('#backBtn').onclick = () => go('home');
  $$('.seg button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; let v = b.dataset.v;
    if (v === 'true') v = true; else if (v === 'false') v = false;
    S.settings[k] = v; save(); applySettings(); renderSettings();
    const again = $(`.seg button[data-k="${k}"][data-v="${b.dataset.v}"]`); if (again) again.focus();
  });
  $('#reshuffleBtn').onclick = () => confirmBox({
    title:'Give a new set order?',
    text:'This is for a different child using the same device. It picks a fresh order and clears the stars, badges and pictures on this device.',
    yes:'Yes, new learner', no:'Cancel',
    onYes(){ const keep = S.settings; S = fresh(); S.settings = keep; S.seed = (Math.random() * 4294967296) >>> 0; setOrder(); save(); go('home'); }
  });
  const installed = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const onIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const note = $('#iosNote');
  if (note) {
    if (onIOS && !installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;background:var(--sun-soft);border-left:8px solid var(--sun);border-radius:14px;padding:.7rem .9rem">' +
        '<b>Worth doing:</b> add this page to the Home Screen (Share → Add to Home Screen) and open it from that icon. ' +
        'Safari erases saved progress after about a week of not visiting. Home Screen apps keep theirs.</p>';
    } else if (installed) {
      note.innerHTML = '<p style="margin:.6rem 0 0;font-size:1.05rem;color:var(--ink-soft)">Running from the Home Screen — progress is kept safely.</p>';
    }
  }
  $('#exportBtn').onclick = () => {
    try {
      const stamp = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'number-friends-' + stamp + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      confirmBox({title:'Could not save', text:'This browser would not let the file be saved.', yes:'OK', no:null, onYes(){}});
    }
  };
  $('#importBtn').onclick = () => $('#importFile').click();
  $('#importFile').onchange = ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(String(r.result)); } catch (e) {}
      if (!d || typeof d !== 'object' || typeof d.sets !== 'object' || d.sets === null) {
        confirmBox({title:'That file did not fit', text:'It is not a Number Friends backup. Look for a file named number-friends-....json', yes:'OK', no:null, onYes(){}});
        return;
      }
      const done = Object.keys(d.sets).length, pics = Array.isArray(d.gallery) ? d.gallery.length : 0;
      const bits = [done + ' set' + (done === 1 ? '' : 's') + ' started', pics + ' drawing' + (pics === 1 ? '' : 's')];
      if (d.current) bits.push('a paused set');
      confirmBox({
        title:'Load this backup?',
        text:'It has ' + bits.join(', ') + '. This replaces what is on this device now.',
        yes:'Yes, load it', no:'Cancel',
        onYes(){
          S = Object.assign(fresh(), d);
          S.settings = Object.assign(fresh().settings, d.settings || {});
          S.stats = Object.assign(freshStats(), d.stats || {});
          if (S.seed === null || S.seed === undefined) S.seed = (Math.random() * 4294967296) >>> 0;
          setOrder(); save(); applySettings(); go('home');
        }
      });
    };
    r.readAsText(f);
  };
  $('#resetBtn').onclick = () => confirmBox({
    title:'Clear all progress?',
    text:'Scores, badges, pictures and paused sets will be removed. The set order and the settings stay the same.',
    yes:'Yes, clear everything', no:'Cancel',
    onYes(){ const keep = S.settings, seed = S.seed, order = S.order; S = fresh(); S.settings = keep; S.seed = seed; S.order = order; save(); go('home'); }
  });
}

/* ---------- Global events ---------- */
document.addEventListener('keydown', e => {
  if (layer.innerHTML) { if (e.key === 'Escape') { if (paused) resumeQuiz(); else hideLayer(); } return; }
  if (screen !== 'quiz' || !Q) return;
  const tag = e.target.tagName;
  if (e.key === 'Enter' && (tag === 'INPUT' || e.target === document.body)) {
    e.preventDefault();
    if (Q.checked) next(); else doCheck();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) return; if (screen === 'quiz') pause(); else save(); });
window.addEventListener('resize', syncDockSpace);
window.addEventListener('pagehide', save);

load(); applySettings(); save(); go('home');

/* ---------- Offline support ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
